<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Markdown Editor | Kazuha Mo — UC Irvine</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="../../favicon.ico" type="image/x-icon" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="../../assets/css/bento.css" />
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde@2/dist/easymde.min.css" />
		<script>
			(function () {
				try {
					var saved = localStorage.getItem("kzh-theme");
					var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
					document.documentElement.setAttribute("data-theme", saved || (prefersDark ? "dark" : "light"));
				} catch (e) {}
			})();
		</script>
		<style>
			#main > * > .inner { max-width: none; width: calc(100% - 8em); }

			:root {
				--me-blue: #244f8f;
				--me-blue-bg: rgba(36, 79, 143, 0.10);
				--me-blue-border: rgba(36, 79, 143, 0.22);
				--me-blue-bg-strong: rgba(36, 79, 143, 0.17);
				--me-blue-hover: #183b73;
				--me-border: rgba(42, 79, 133, 0.16);
				--me-border-soft: rgba(42, 79, 133, 0.12);
				--me-ink: #23324a;
				--me-muted: #516074;
				--me-card-bg: rgba(255, 255, 255, 0.98);
				--me-card-bg-soft:
					radial-gradient(circle at top right, rgba(36, 79, 143, 0.08), transparent 18rem),
					linear-gradient(135deg, rgba(255,255,255,0.98) 0%, rgba(246,249,255,0.99) 58%, rgba(250,252,255,0.98) 100%);
				--me-card-shadow: 0 1.25rem 3rem rgba(23, 43, 77, 0.08);
				--me-card-shadow-lg: 0 1.5rem 3.5rem rgba(23, 43, 77, 0.08);
				--me-editor-bg: #ffffff;
				--me-toolbar-bg: #f8f9fb;
				--me-preview-bg: #fafbfd;
				--me-chip-current-text: #ffffff;
				--me-crumb-sep: #97a7bb;
				--me-gutter-text: #aab3c0;
				--me-hr-muted: #aab3c0;
				--me-code-dark-bg: #1e1e1e;

				/* CodeMirror / preview pane height. JS overrides this with a
				 * pixel value computed from the actual card top + viewport so
				 * the editor fills the available viewport height. The fallback
				 * matches the historical fixed value in case JS hasn't run yet. */
				--me-editor-h: calc(100vh - 20rem);

				/* CodeMirror syntax tokens (light) */
				--me-cm-header: #244f8f;
				--me-cm-strong: #1a1a2e;
				--me-cm-em: #8b5a18;
				--me-cm-strike: #999;
				--me-cm-link: #0c8a5f;
				--me-cm-url: #2d5b95;
				--me-cm-comment: #6a737d;
				--me-cm-quote: #42526b;
				--me-cm-tag: #808080;
				--me-cm-string: #c7254e;
				--me-cm-keyword: #244f8f;
				--me-cm-variable: #2d5b95;
				--me-cm-toolbar-btn: #555;

				/* Preview (mirrors md-viewer styling) */
				--me-h2-border: #2d5b95;
				--me-h3: #334155;
				--me-inline-code-bg: rgba(33, 82, 164, 0.08);
				--me-inline-code-text: #293e6a;
				--me-blockquote-bg: rgba(33, 82, 164, 0.05);
				--me-blockquote-border: rgba(33, 82, 164, 0.45);
				--me-blockquote-text: #42526b;
				--me-hr: rgba(144, 163, 191, 0.35);
				--me-table-header-bg: rgba(33, 82, 164, 0.06);
				--me-a-underline: rgba(36, 79, 143, 0.28);
				--me-a-underline-hover: rgba(24, 59, 115, 0.52);
			}

			html[data-theme="dark"] {
				--me-blue: #6aa3f5;
				--me-blue-bg: rgba(106, 163, 245, 0.15);
				--me-blue-border: rgba(106, 163, 245, 0.32);
				--me-blue-bg-strong: rgba(106, 163, 245, 0.24);
				--me-blue-hover: #a8c9ff;
				--me-border: rgba(255, 255, 255, 0.1);
				--me-border-soft: rgba(255, 255, 255, 0.07);
				--me-ink: #dde4f0;
				--me-muted: #8c9cb5;
				--me-card-bg: #14181f;
				--me-card-bg-soft:
					radial-gradient(circle at top right, rgba(106, 163, 245, 0.08), transparent 18rem),
					linear-gradient(135deg, #181d26 0%, #1a1f29 58%, #1c222c 100%);
				--me-card-shadow: 0 1.25rem 3rem rgba(0, 0, 0, 0.35);
				--me-card-shadow-lg: 0 1.5rem 3.5rem rgba(0, 0, 0, 0.4);
				--me-editor-bg: #0f1319;
				--me-toolbar-bg: #181d26;
				--me-preview-bg: #12161d;
				--me-chip-current-text: #0a0d12;
				--me-crumb-sep: #54627a;
				--me-gutter-text: #54627a;
				--me-hr-muted: #54627a;

				--me-cm-header: #6aa3f5;
				--me-cm-strong: #e2eaf5;
				--me-cm-em: #ecb86a;
				--me-cm-strike: #5c6579;
				--me-cm-link: #4ec9a9;
				--me-cm-url: #7ab5ff;
				--me-cm-comment: #7a8696;
				--me-cm-quote: #b4c0d4;
				--me-cm-tag: #8892a6;
				--me-cm-string: #e08ea7;
				--me-cm-keyword: #6aa3f5;
				--me-cm-variable: #a8c9ff;
				--me-cm-toolbar-btn: #b4c0d4;

				--me-h2-border: #6aa3f5;
				--me-h3: #b4c0d4;
				--me-inline-code-bg: rgba(106, 163, 245, 0.13);
				--me-inline-code-text: #b8d0ff;
				--me-blockquote-bg: rgba(106, 163, 245, 0.08);
				--me-blockquote-border: rgba(106, 163, 245, 0.5);
				--me-blockquote-text: #b4c0d4;
				--me-hr: rgba(255, 255, 255, 0.12);
				--me-table-header-bg: rgba(106, 163, 245, 0.09);
				--me-a-underline: rgba(106, 163, 245, 0.35);
				--me-a-underline-hover: rgba(168, 201, 255, 0.6);
			}

			/* Shell */
			.me-shell {
				position: relative;
				display: flex;
				flex-direction: column;
				background: var(--me-card-bg);
				border: 1px solid var(--me-border);
				border-radius: 1.4rem;
				box-shadow: var(--me-card-shadow-lg);
				overflow: hidden;
			}

			.me-shell > header.major {
				display: none;
			}

			/* Intro / Breadcrumb */
			.me-intro {
				padding: 0.75rem 1.5rem;
				border-bottom: 1px solid var(--me-border);
				background: var(--me-card-bg-soft);
			}
			.me-intro .crumbs { margin-bottom: 0; }

			.me-shell > :last-child { border-bottom: 0 !important; }

			.me-breadcrumb {
				display: flex;
				flex-wrap: wrap;
				gap: 0.45rem;
				align-items: center;
			}

			.me-chip {
				display: inline-flex;
				align-items: center;
				padding: 0.38rem 0.8rem;
				border-radius: 999px;
				font-size: 0.86rem;
				font-weight: 700;
				text-decoration: none;
				border-bottom: 0 !important;
				background: var(--me-blue-bg);
				box-shadow: inset 0 0 0 1.5px var(--me-blue-border);
				color: var(--me-blue) !important;
				transition: background 0.2s ease, transform 0.2s ease;
			}

			.me-chip:hover {
				background: var(--me-blue-bg-strong);
				transform: translateY(-1px);
				color: var(--me-blue-hover) !important;
			}

			.me-chip-current {
				background: var(--me-blue);
				box-shadow: none;
				color: var(--me-chip-current-text) !important;
				cursor: default;
			}

			.me-chip-current:hover {
				background: var(--me-blue);
				transform: none;
				color: var(--me-chip-current-text) !important;
			}

			.me-sep {
				font-size: 1.18rem;
				font-weight: 700;
				color: var(--me-crumb-sep);
				user-select: none;
				line-height: 1;
			}

			/* ── Editor card ───────────────────────────── */
			.me-editor-card {
				position: relative;
				display: flex;
				background: var(--me-card-bg);
				overflow: hidden;
				padding: 0;
			}

			/* Mobile layout (toggled by JS via .me-mobile class so the layout
			 * also flips when a desktop window is resized below 736px, not
			 * just on touch devices): single column, hide the side-by-side
			 * preview and outline rail, drop the row-flex so the toolbar
			 * can fill width and wrap naturally. */
			.me-editor-card.me-mobile { display: block !important; }
			.me-editor-card.me-mobile .EasyMDEContainer {
				width: 100% !important;
				max-width: 100% !important;
				flex-basis: auto !important;
			}
			.me-editor-card.me-mobile .me-outline-panel,
			.me-editor-card.me-mobile .me-pane-gutter,
			.me-editor-card.me-mobile .editor-preview-active-side {
				display: none !important;
			}
			.me-editor-card.me-mobile .CodeMirror,
			.me-editor-card.me-mobile .CodeMirror.CodeMirror-sided {
				width: 100% !important;
				max-width: 100% !important;
				height: 55vh !important;
				min-height: 300px !important;
			}

			/* ── EasyMDE theme overrides ───────────────── */

			/* Container — flex column so toolbar/CM/statusbar stack and CM
			 * can flex-fill remaining height (works the same in fullscreen). */
			.me-editor-card .EasyMDEContainer {
				margin: 0;
				position: relative;
				display: flex;
				flex-direction: column;
				flex: 1 1 auto;
				flex-basis: 100%;
				max-width: 100%;
				min-width: 0;
				min-height: 0;
				transition: flex-basis 0.22s ease, max-width 0.22s ease;
			}

			/* When CM is in EasyMDE's "fullscreen" state, take over the WHOLE
			 * editor card (overlay viewport) — but reset CM/toolbar/preview
			 * to normal flow so the existing flex layout keeps working. */
			body:has(.CodeMirror-fullscreen) {
				overflow: hidden;
			}
			body:has(.CodeMirror-fullscreen) .me-editor-card {
				position: fixed !important;
				inset: 0 !important;
				z-index: 9999 !important;
				max-width: none !important;
				width: 100% !important;
				margin: 0 !important;
				border-radius: 0 !important;
				border: 0 !important;
			}
			.me-editor-card .CodeMirror.CodeMirror-fullscreen,
			.me-editor-card .editor-toolbar.fullscreen {
				position: relative !important;
				top: auto !important;
				left: auto !important;
				right: auto !important;
				bottom: auto !important;
				width: auto !important;
				height: auto !important;
				z-index: auto !important;
			}

			.me-editor-card .editor-toolbar {
				border-top: none;
				border-left: none;
				border-right: none;
				border-bottom: 1px solid var(--me-border-soft);
				background: var(--me-toolbar-bg);
				padding: 6px 10px;
				border-radius: 0;
				opacity: 1;
				display: flex !important;
				align-items: center !important;
				flex-wrap: wrap;
				gap: 1px;
			}

			.me-editor-card .editor-toolbar:not(.fullscreen) {
				position: relative;
				z-index: 3;
			}

			.me-editor-card .editor-toolbar::before,
			.me-editor-card .editor-toolbar::after {
				display: none;
			}

			.me-editor-card .editor-toolbar button {
				-webkit-appearance: none !important;
				-moz-appearance: none !important;
				appearance: none !important;
				display: inline-flex !important;
				align-items: center !important;
				justify-content: center !important;
				width: 30px !important;
				height: 30px !important;
				min-height: 0 !important;
				padding: 0 !important;
				margin: 1px 2px !important;
				border: 1px solid transparent !important;
				border-radius: 4px !important;
				background: transparent !important;
				color: var(--me-cm-toolbar-btn) !important;
				text-align: center !important;
				cursor: pointer !important;
				box-shadow: none !important;
				text-decoration: none !important;
				text-transform: none !important;
				letter-spacing: 0 !important;
				font-weight: normal !important;
				font-size: 1rem !important;
				transition: background 0.15s, border-color 0.15s !important;
			}

			.me-editor-card .editor-toolbar button:hover {
				background: var(--me-blue-bg) !important;
				border-color: var(--me-blue-border) !important;
				color: var(--me-blue) !important;
				transform: none !important;
			}

			.me-editor-card .editor-toolbar button.active,
			.me-editor-card .editor-toolbar button.active:hover {
				background: var(--me-blue-bg-strong) !important;
				border-color: var(--me-blue-border) !important;
				color: var(--me-blue) !important;
			}

			.me-editor-card .editor-toolbar button.me-export-btn {
				background: var(--me-blue-bg) !important;
				border-color: var(--me-blue-border) !important;
				color: var(--me-blue) !important;
				width: auto !important;
				padding: 0 10px !important;
				font-size: 0.78rem !important;
				font-weight: 700 !important;
				font-family: 'Source Sans Pro', -apple-system, sans-serif !important;
			}

			.me-editor-card .editor-toolbar button.me-export-btn:hover {
				background: var(--me-blue) !important;
				color: var(--me-chip-current-text) !important;
			}

			/* Normalize heading button sizes */
			.me-editor-card .editor-toolbar button.heading-1,
			.me-editor-card .editor-toolbar button.heading-2,
			.me-editor-card .editor-toolbar button.heading-3 {
				font-size: 1rem !important;
			}

			.me-editor-card .editor-toolbar i.separator {
				border-left: 1px solid var(--me-border) !important;
				border-right: none !important;
				margin: 0 4px !important;
				align-self: center !important;
				height: 20px !important;
			}

			/* ── CodeMirror — light theme ──────────────── */
			.me-editor-card .CodeMirror {
				border: none;
				border-bottom-left-radius: 0;
				border-bottom-right-radius: 0;
				/* Normal mode: explicit height so CM's internal scrollbars handle
				 * long documents and the page itself doesn't grow forever.
				 * --me-editor-h is set by JS to fill the viewport. */
				height: var(--me-editor-h) !important;
				min-height: 380px !important;
				font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
				font-size: 0.9rem;
				line-height: 1.65;
				padding: 12px 16px;
				color: var(--me-ink);
				background: var(--me-editor-bg);
			}

			/* Fullscreen: card overlay = 100vh; let CM flex-fill the remaining
			 * height inside EasyMDEContainer (toolbar at top, statusbar at
			 * bottom, CM in between). Preview also stretches via top+bottom. */
			body:has(.CodeMirror-fullscreen) .me-editor-card .CodeMirror {
				flex: 1 1 auto;
				height: auto !important;
				min-height: 0 !important;
			}
			body:has(.CodeMirror-fullscreen) .me-editor-card .editor-preview-side {
				height: auto !important;
				min-height: 0 !important;
			}

			.me-editor-card .CodeMirror-cursor {
				border-left-color: var(--me-ink);
			}

			.me-editor-card .CodeMirror-selected {
				background: var(--me-blue-bg) !important;
			}

			.me-editor-card .CodeMirror-focused .CodeMirror-selected {
				background: var(--me-blue-bg-strong) !important;
			}

			/* Light syntax tokens */
			.me-editor-card .cm-header      { color: var(--me-cm-header); font-weight: 700; }
			.me-editor-card .cm-header-1     { font-size: 1.4em; }
			.me-editor-card .cm-header-2     { font-size: 1.2em; }
			.me-editor-card .cm-header-3     { font-size: 1.08em; }
			.me-editor-card .cm-strong       { color: var(--me-cm-strong); font-weight: 700; }
			.me-editor-card .cm-em           { color: var(--me-cm-em); font-style: italic; }
			.me-editor-card .cm-strikethrough { color: var(--me-cm-strike); text-decoration: line-through; }
			.me-editor-card .cm-link         { color: var(--me-cm-link); text-decoration: none; }
			.me-editor-card .cm-url          { color: var(--me-cm-url); text-decoration: underline; }
			.me-editor-card .cm-comment      { color: var(--me-cm-comment); }
			.me-editor-card .cm-quote        { color: var(--me-cm-quote); font-style: italic; }
			.me-editor-card .cm-tag          { color: var(--me-cm-tag); }
			.me-editor-card .cm-string       { color: var(--me-cm-string); }
			.me-editor-card .cm-keyword      { color: var(--me-cm-keyword); }
			.me-editor-card .cm-variable-2   { color: var(--me-cm-variable); }
			.me-editor-card .cm-hr           { color: var(--me-gutter-text); }
			.me-editor-card .cm-formatting   { color: var(--me-gutter-text); }

			/* Gutters */
			.me-editor-card .CodeMirror-gutters {
				background: var(--me-toolbar-bg);
				border-right: 1px solid var(--me-border-soft);
			}

			.me-editor-card .CodeMirror-linenumber {
				color: var(--me-gutter-text);
			}

			/* ── Drafts (snapshots) modal ──────────────────────── */
			.me-drafts-overlay {
				position: fixed;
				inset: 0;
				background: rgba(0, 0, 0, 0.42);
				display: flex;
				align-items: flex-start;
				justify-content: center;
				padding-top: 12vh;
				z-index: 99999;
			}
			.me-drafts-overlay[hidden] { display: none !important; }
			.me-drafts-modal {
				width: min(560px, 92vw);
				background: var(--me-card-bg);
				border: 1px solid var(--me-border);
				border-radius: 0.7rem;
				box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
				overflow: hidden;
				color: var(--me-ink);
				display: flex;
				flex-direction: column;
				max-height: 75vh;
			}
			.me-drafts-head {
				padding: 0.85rem 1rem 0.6rem;
				border-bottom: 1px solid var(--me-border);
				display: flex;
				align-items: center;
				gap: 0.6rem;
			}
			.me-drafts-head h3 {
				font: 700 0.98rem/1.3 "Inter", sans-serif;
				color: var(--me-blue);
				margin: 0;
				flex: 1 1 auto;
			}
			/* Shared sizing for the two action buttons in the drafts modal head
			 * so they line up at the same pixel height regardless of border /
			 * background variant (filled vs outline). */
			.me-drafts-head-btn {
				display: inline-flex;
				align-items: center;
				gap: 0.35rem;
				height: 30px;
				padding: 0 0.7rem;
				border-radius: 0.4rem;
				font: 600 0.78rem/1 "Inter", sans-serif;
				cursor: pointer;
				border: 1px solid transparent;
				background: transparent;
				color: inherit;
				transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
				box-sizing: border-box;
			}
			.me-drafts-head-btn svg {
				width: 14px;
				height: 14px;
				flex-shrink: 0;
			}
			.me-drafts-snap-btn {
				border-color: var(--me-blue);
				background: var(--me-blue);
				color: var(--me-chip-current-text);
			}
			.me-drafts-snap-btn:hover {
				background: var(--me-blue-hover);
				border-color: var(--me-blue-hover);
			}
			.me-drafts-clear-btn {
				border-color: var(--me-border);
				color: var(--me-muted);
			}
			.me-drafts-clear-btn:hover {
				background: rgba(220, 60, 60, 0.12);
				border-color: rgba(220, 60, 60, 0.35);
				color: rgb(196, 47, 47);
			}
			html[data-theme="dark"] .me-drafts-clear-btn:hover {
				background: rgba(255, 105, 105, 0.16);
				color: rgb(255, 142, 142);
			}
			.me-drafts-clear-btn:disabled {
				opacity: 0.4;
				cursor: not-allowed;
			}
			.me-drafts-clear-btn:disabled:hover {
				background: transparent;
				color: var(--me-muted);
				border-color: var(--me-border);
			}
			.me-drafts-list {
				overflow-y: auto;
				padding: 0.4rem 0.4rem 0.7rem;
			}
			.me-drafts-empty {
				padding: 1.5rem 1rem;
				text-align: center;
				color: var(--me-muted);
				font-style: italic;
				font-size: 0.86rem;
			}
			.me-draft-row {
				display: flex;
				align-items: center;
				gap: 0.6rem;
				padding: 0.55rem 0.7rem;
				border-radius: 0.4rem;
				cursor: pointer;
				transition: background 0.15s ease;
			}
			.me-draft-row:hover { background: var(--me-blue-bg); }
			.me-draft-info { flex: 1 1 auto; min-width: 0; }
			.me-draft-title {
				font: 600 0.88rem/1.3 "Inter", "PingFang SC", sans-serif;
				color: var(--me-ink);
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}
			.me-draft-meta {
				font: 500 0.75rem/1.3 "Inter", sans-serif;
				color: var(--me-muted);
				margin-top: 0.1rem;
			}
			.me-draft-del {
				flex-shrink: 0;
				border: 1px solid var(--me-border);
				background: transparent;
				color: var(--me-muted);
				border-radius: 0.35rem;
				padding: 0.28rem 0.55rem;
				font: 600 0.74rem/1 "Inter", sans-serif;
				cursor: pointer;

			/* ── Find & Replace bar (custom, uses cm.getSearchCursor) ── */
			.me-search-bar {

				background: var(--me-card-bg);

			.me-search-bar[hidden] { display: none !important; }

			.me-search-row {
				display: flex;
				align-items: center;
				gap: 0.3rem;
			}

			.me-search-row[hidden] { display: none !important; }

			.me-search-input,
			.me-replace-input {
				flex: 1 1 auto;
				min-width: 0;
				background: var(--me-card-bg-soft);
				border: 1px solid var(--me-border);
				border-radius: 0.35rem;
				color: var(--me-ink);
				padding: 0.32rem 0.5rem;
				font: 500 0.84rem/1 "Menlo", "Consolas", monospace;

			.me-search-input:focus,

			.me-search-bar button {
				background: transparent;
				border: 1px solid transparent;
				border-radius: 0.3rem;
				color: var(--me-muted);
				width: 26px;
				height: 26px;
				display: inline-flex;
				align-items: center;
				justify-content: center;
				cursor: pointer;
				font: 600 0.76rem/1 inherit;
				flex-shrink: 0;
				transition: background 0.15s ease, color 0.15s ease;
			}

			.me-search-bar button:hover {
				background: var(--me-blue-bg);
				color: var(--me-blue);
			}

			.me-search-bar button.me-search-action {
				width: auto;
				padding: 0 0.55rem;
				color: var(--me-blue);
				background: var(--me-blue-bg);
				border-color: var(--me-blue-border);
			}

			.me-search-bar button.me-search-action:hover {
				background: var(--me-blue-bg-strong);
			}

			.me-search-bar button svg {
				width: 14px;
				height: 14px;
				stroke: currentColor;
				fill: none;
				stroke-width: 2;
				stroke-linecap: round;
				stroke-linejoin: round;
			}

			.me-search-mark {
				background: rgba(245, 200, 60, 0.32);
				border-radius: 2px;
			}

			.me-search-mark-current {
				background: rgba(245, 160, 30, 0.55);
				outline: 1px solid rgba(245, 160, 30, 0.85);
				border-radius: 2px;
			}

			html[data-theme="dark"] .me-search-mark { background: rgba(245, 200, 60, 0.24); }
			html[data-theme="dark"] .me-search-mark-current {
				background: rgba(255, 180, 50, 0.40);
				outline-color: rgba(255, 180, 50, 0.85);
			}

			/* ── Side-by-side / Preview pane ───────────── */
			.me-editor-card .editor-preview-side,
			.me-editor-card .editor-preview {
				background: var(--me-preview-bg);
				border: none;
				border-left: 1px solid var(--me-border-soft);
				/* Top padding matches CodeMirror's 12px so the first heading
				 * lines up with the editor's first source line. */
				padding: 12px 2rem 1.5rem;
				color: var(--me-ink);
				font-family: 'Source Sans Pro', -apple-system, BlinkMacSystemFont, sans-serif;
				font-size: 1rem;
				line-height: 1.7;
			}

			.me-editor-card .editor-preview-active-side {
				display: block;
			}

			/* Constrain preview height to match editor, enable independent scroll.
			 * Stop above the statusbar so it doesn't sit on top of "Draft saved…". */
			.me-editor-card .editor-preview-side {
				/* Anchor preview to EasyMDEContainer (not viewport) so the
				 * outline panel can claim its own column without overlap. */
				position: absolute !important;
				top: var(--me-toolbar-h, 50px) !important;
				right: 0 !important;
				bottom: var(--me-statusbar-h, 30px) !important;
				width: 50% !important;
				height: var(--me-editor-h) !important;
				min-height: 380px !important;
				overflow-y: auto !important;
			}

			/* Outline open: explicitly cap EasyMDEContainer width so flex
			 * shrinkage is deterministic. Preview width is now driven by
			 * --me-split below, no fixed override. */
			.me-editor-card:has(.me-outline-panel:not(.collapsed)) .EasyMDEContainer {
				flex-basis: calc(100% - 240px);
				max-width: calc(100% - 240px);
			}

			/* Side-by-side: CM occupies the left fraction defined by --me-split;
			 * preview takes the rest. A draggable gutter sits at the seam. */
			.me-editor-card { --me-split: 50%; }
			.me-editor-card .CodeMirror.CodeMirror-sided {
				width: var(--me-split) !important;
				max-width: var(--me-split) !important;
				box-sizing: border-box !important;
			}
			.me-editor-card .editor-preview-active-side {
				width: calc(100% - var(--me-split)) !important;
			}
			/* Fullscreen no longer needs special CM/preview/gutter width rules:
			 * the editor card itself becomes position:fixed inset:0, and the
			 * regular flex/percentage layout above just scales to viewport. */

			/* Draggable gutter at the split seam. Only shown when side-by-side
			 * is active (CM has the .CodeMirror-sided class). */
			.me-pane-gutter {
				display: none;
				position: absolute;
				top: var(--me-toolbar-h, 50px);
				bottom: var(--me-statusbar-h, 30px);
				left: var(--me-split);
				width: 12px;
				margin-left: -6px;
				cursor: col-resize;
				z-index: 11;
				background: transparent;
				transition: background 0.15s ease;
			}
			.me-pane-gutter::before {
				content: "";
				position: absolute;
				top: 0; bottom: 0;
				left: 50%;
				width: 1px;
				background: var(--me-border);
				transform: translateX(-0.5px);
				transition: background 0.15s ease, width 0.15s ease;
			}
			.me-pane-gutter:hover::before,
			.me-pane-gutter.dragging::before {
				background: var(--me-blue);
				width: 2px;
			}
			.me-editor-card:has(.CodeMirror-sided) .me-pane-gutter { display: block; }
			body.me-pane-dragging,
			body.me-pane-dragging * { user-select: none !important; cursor: col-resize !important; }

			/* ── Preview content (match md-viewer) ─────── */

			.me-editor-card .editor-preview h1,
			.me-editor-card .editor-preview-side h1 {
				font-size: 1.75em;
				padding-bottom: 0.5rem;
				border-bottom: 3px solid var(--me-border);
				font-weight: 700;
				line-height: 1.28;
				margin: 1.4rem 0 0.5rem;
				color: var(--me-ink);
			}

			.me-editor-card .editor-preview h1:first-child,
			.me-editor-card .editor-preview-side h1:first-child { margin-top: 0; }

			.me-editor-card .editor-preview h2,
			.me-editor-card .editor-preview-side h2 {
				font-size: 1.4em;
				padding-left: 0.8rem;
				border-left: 4px solid var(--me-h2-border);
				font-weight: 700;
				line-height: 1.28;
				margin: 1.4rem 0 0.5rem;
				color: var(--me-ink);
			}

			.me-editor-card .editor-preview h3,
			.me-editor-card .editor-preview-side h3 {
				font-size: 1.18em;
				font-weight: 700;
				line-height: 1.28;
				margin: 1.4rem 0 0.5rem;
				color: var(--me-h3);
			}

			.me-editor-card .editor-preview h4,
			.me-editor-card .editor-preview-side h4 {
				font-size: 1.05em;
				font-weight: 700;
				margin: 1.2rem 0 0.4rem;
				color: var(--me-ink);
			}

			.me-editor-card .editor-preview p,
			.me-editor-card .editor-preview-side p { margin: 0 0 0.65rem; }

			.me-editor-card .editor-preview strong,
			.me-editor-card .editor-preview-side strong {
				color: var(--me-ink);
				font-weight: 700;
			}

			.me-editor-card .editor-preview a,
			.me-editor-card .editor-preview-side a {
				color: var(--me-blue);
				text-decoration: underline;
				text-decoration-color: var(--me-a-underline);
				text-decoration-thickness: 0.08em;
				text-underline-offset: 0.16em;
				border-bottom: none;

			.me-editor-card .editor-preview a:hover,
			.me-editor-card .editor-preview-side a:hover {
				color: var(--me-blue-hover);
				text-decoration-color: var(--me-a-underline-hover);
			}

			.me-editor-card .editor-preview code,
			.me-editor-card .editor-preview-side code {
				padding: 0.12rem 0.4rem;
				border-radius: 0.35rem;
				background: var(--me-inline-code-bg);
				color: var(--me-inline-code-text);
				font: 0.92em/1.4 "Fira Code", "Cascadia Code", "Menlo", monospace;
			}

			.me-editor-card .editor-preview pre,
			.me-editor-card .editor-preview-side pre {
				padding: 1rem 1.15rem;
				border-radius: 1rem;
				overflow-x: auto;
				background: #1e1e1e;
				color: #d4d4d4;
				border: 1px solid rgba(255, 255, 255, 0.08);
				font: 0.88em/1.6 "Consolas", "Cascadia Code", "Fira Code", "Menlo", monospace;
				margin: 0 0 0.65rem;
			}

			.me-editor-card .editor-preview pre code,
			.me-editor-card .editor-preview-side pre code {
				display: block;
				padding: 0;
				background: transparent;
				color: inherit;
				border-radius: 0;
				font-size: inherit;
				line-height: inherit;
			}

.me-editor-card .editor-preview blockquote,
			.me-editor-card .editor-preview-side blockquote {
				padding: 0.9rem 1rem;
				background: var(--me-blockquote-bg);
				border-left: 4px solid var(--me-blockquote-border);
				border-radius: 0 0.9rem 0.9rem 0;
				color: var(--me-blockquote-text);
				margin: 0 0 0.65rem;
			}

			.me-editor-card .editor-preview blockquote p:last-child,
			.me-editor-card .editor-preview-side blockquote p:last-child { margin-bottom: 0; }

			.me-editor-card .editor-preview ul,
			.me-editor-card .editor-preview ol,
			.me-editor-card .editor-preview-side ul,
			.me-editor-card .editor-preview-side ol {
				padding-left: 1.5rem;
				margin: 0 0 0.65rem;
			}

			.me-editor-card .editor-preview li + li,
			.me-editor-card .editor-preview-side li + li { margin-top: 0.18rem; }

			.me-editor-card .editor-preview hr,
			.me-editor-card .editor-preview-side hr {
				border: 0;
				border-top: 1px solid var(--me-hr);
				margin: 1.2rem 0;
			}

			.me-editor-card .editor-preview table,
			.me-editor-card .editor-preview-side table {
				width: 100%;
				border-collapse: collapse;
				border: 1px solid var(--me-hr);
				margin: 0 0 0.65rem;
				font-size: 0.95em;
			}

			.me-editor-card .editor-preview th,
			.me-editor-card .editor-preview td,
			.me-editor-card .editor-preview-side th,
			.me-editor-card .editor-preview-side td {
				padding: 0.75rem 0.85rem !important;
				border: 1px solid var(--me-hr) !important;
				text-align: left !important;
				vertical-align: top !important;
				color: var(--me-ink) !important;
				background: transparent !important;
			}

			.me-editor-card .editor-preview th,
			.me-editor-card .editor-preview-side th {
				background: var(--me-table-header-bg) !important;
				font-weight: 700 !important;
				color: var(--me-ink) !important;
			}

			.me-editor-card .editor-preview tr:nth-child(even) td,
			.me-editor-card .editor-preview-side tr:nth-child(even) td {
				background: var(--me-blue-bg) !important;
			}

			.me-editor-card .editor-preview img,
			.me-editor-card .editor-preview-side img { max-width: 100%; border-radius: .5rem; }

			/* Math (KaTeX) */
			.math-block {
				overflow-x: hidden;
				text-align: center;
				margin: 1rem 0;
			}

			.math-block .katex-display { margin: 0; }

			.math-block .katex-display > .katex {
				max-width: 100%;
				overflow-x: auto;
				overflow-y: hidden;
				padding: 2px 0;
			}

			/* Status bar */
			.me-editor-card .editor-statusbar {
				border-top: 1px solid var(--me-border-soft);
				padding: 6px 14px;
				color: var(--me-muted);
				font-size: 0.8rem;
				background: var(--me-toolbar-bg);
				text-align: left !important;
			}
			.me-editor-card .editor-statusbar .autosave {
				font-size: 0.8rem;
			}

			.me-editor-card .editor-statusbar .me-reading-time,
			.me-editor-card .editor-statusbar .me-word-goal {
				display: inline-flex;
				align-items: center;
				gap: 0.4rem;
				font-size: 0.8rem;
				padding: 0 0.2rem;
			}
			.me-editor-card .editor-statusbar .me-word-goal:hover .me-goal-empty,
			.me-editor-card .editor-statusbar .me-word-goal:hover .me-goal-text {
				color: var(--me-blue);
			}
			.me-editor-card .editor-statusbar .me-goal-empty {
				font-style: italic;
				opacity: 0.7;
			}
			.me-editor-card .editor-statusbar .me-goal-bar {
				display: inline-block;
				width: 56px;
				height: 6px;
				background: var(--me-border);
				border-radius: 3px;
				overflow: hidden;
				vertical-align: middle;
			}
			.me-editor-card .editor-statusbar .me-goal-fill {
				display: block;
				height: 100%;
				background: var(--me-blue);
				transition: width 0.18s ease;
			}

			/* ── Fullscreen fix (z-index above header + preview full height) */
			.me-editor-card .editor-toolbar.fullscreen {
				z-index: 10010 !important;
			}

			/* (Old fullscreen z-index hacks removed — no longer needed since
			 * CM/preview are reset to normal flow in fullscreen-overlay mode) */

			/* ── Mobile ────────────────────────────────── */
			@media screen and (max-width: 736px) {
				#main > * > .inner {
					width: 100% !important;
					max-width: 100vw !important;
					box-sizing: border-box !important;
					padding: 0.75rem 0 1rem 0 !important;
				}

				.me-shell {
					border-radius: 0;
					border-left: none;
					border-right: none;
				}

				.me-shell > header.major {
					padding: 0 1rem;
					margin-bottom: 0;
				}

				.me-intro { padding: 0.5rem 1rem; }

				/* (Mobile-specific overrides also live in the .me-mobile rules
				 * below — JS toggles that class so the layout changes even if
				 * a desktop window is dragged narrow.) */

				.me-editor-card .editor-preview-side,
				.me-editor-card .editor-preview {
					padding: 1rem;
				}

				.me-editor-card .editor-preview-side {
					height: 55vh !important;
					min-height: 300px !important;
				}

				.me-editor-card .editor-toolbar {
					padding: 4px 6px;
				}

				.me-editor-card .editor-toolbar button {
					width: 26px !important;
					height: 26px !important;
					line-height: 26px !important;
					font-size: 0.85rem !important;
				}
			}

			/* ── Outline panel (right-side, toggleable column) ──
			 * Cap height so a long heading list scrolls inside the panel
			 * instead of stretching the editor card (and the page) downward.
			 * In fullscreen the cap is lifted (see body:has rule below). */
			.me-outline-panel {
				flex: 0 0 240px;
				align-self: flex-start;
				height: calc(var(--me-toolbar-h, 50px) + max(380px, var(--me-editor-h)) + var(--me-statusbar-h, 30px));
				max-height: calc(var(--me-toolbar-h, 50px) + max(380px, var(--me-editor-h)) + var(--me-statusbar-h, 30px));
				min-height: 0;
				background: var(--me-toolbar-bg);
				border-left: 1px solid var(--me-border);
				overflow-y: auto;
				overscroll-behavior: contain;
				padding: 0.7rem 0.45rem 0.7rem 0.5rem;
				box-sizing: border-box;
				transition: flex-basis 0.22s ease, padding 0.22s ease, opacity 0.18s ease, border-left-color 0.22s ease;
			}
			.me-outline-panel.collapsed {
				flex-basis: 0;
				padding-left: 0;
				padding-right: 0;
				opacity: 0;
				border-left-color: transparent;
				overflow: hidden;
				pointer-events: none;
			}

			/* In fullscreen, the editor card is position:fixed inset:0 — let
			 * the outline fill its full height instead of being capped. */
			body:has(.CodeMirror-fullscreen) .me-outline-panel {
				align-self: stretch;
				height: auto;
				max-height: none;
			}
			/* Outline panel has no internal header anymore — toolbar's
			 * panel-right (toggle) and search-list (goto-heading) own those
			 * actions, so the outline pane just shows the heading list. */
			.me-outline-list { display: flex; flex-direction: column; gap: 1px; }
			.me-outline-item {
				cursor: pointer;
				padding: 0.32rem 0.55rem;
				border-radius: 0.3rem;
				font: 500 0.82rem/1.4 "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
				color: var(--me-muted);
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
				/* Match md-viewer's 0.2s ease and include border-left-color so
				 * the left indicator bar transitions in sync with the
				 * background/text instead of snapping. */
				transition: background 0.2s ease, color 0.2s ease, border-left-color 0.2s ease;
				border-left: 2px solid transparent;
			}
			.me-outline-item:hover { background: var(--me-blue-bg); color: var(--me-ink); }
			.me-outline-item.active {
				background: var(--me-blue-bg-strong);
				color: var(--me-blue);
				border-left-color: var(--me-blue);
				font-weight: 700;
			}
			.me-outline-item.h2 { padding-left: 1.1rem; font-size: 0.8rem; }
			.me-outline-item.h3 { padding-left: 1.7rem; font-size: 0.76rem; opacity: 0.86; }
			.me-outline-item.h4 { padding-left: 2.3rem; font-size: 0.74rem; opacity: 0.78; }
			.me-outline-empty {
				color: var(--me-muted);
				font-size: 0.78rem;
				padding: 0.4rem 0.55rem;
				font-style: italic;
			}

			@media screen and (max-width: 768px) {
				.me-outline-panel { display: none !important; }
			}

			/* (Outline panel in fullscreen now uses the same flex layout as
			 * non-fullscreen — the card itself is position:fixed inset:0, so
			 * the regular flex-row layout (EasyMDEContainer + outline) just
			 * scales to viewport. No special positioning needed.) */

			/* ── Goto-symbol command palette (Cmd/Ctrl+Shift+O) ── */
			.me-palette-overlay {
				position: fixed !important;
				inset: 0 !important;
				background: rgba(0, 0, 0, 0.42);

				justify-content: center;
				padding-top: 12vh;
				z-index: 99999 !important;
			}
			.me-palette-overlay[hidden] { display: none !important; }
			.me-palette {

				border: 1px solid var(--me-border);
				border-radius: 0.7rem;

			.me-palette-input {

				box-sizing: border-box;
			}
			.me-palette-list {

				overflow-y: auto;

			}
			.me-palette-item {
				padding: 0.5rem 0.7rem;
				border-radius: 0.4rem;
				cursor: pointer;
				color: var(--me-ink);
				font: 500 0.86rem/1.4 "Inter", "PingFang SC", sans-serif;
				display: flex;
				align-items: center;
				gap: 0.5rem;
				white-space: nowrap;
				overflow: hidden;
			}
			.me-palette-item .me-palette-badge {
				font: 600 0.66rem/1 "Menlo", "Consolas", monospace;
				color: var(--me-muted);
				background: var(--me-blue-bg);
				padding: 0.18rem 0.4rem;
				border-radius: 0.25rem;
				flex-shrink: 0;
			}
			.me-palette-item .me-palette-text {
				overflow: hidden;
				text-overflow: ellipsis;
				flex: 1 1 auto;
			}

			var shikiModulePromise = null;

			function normalizeCodeLanguage(language) {
				var raw = (language || '').trim().toLowerCase();
				if (!raw) return '';
				var aliases = {
					'c++': 'cpp',
					cc: 'cpp',
					cxx: 'cpp',
					hpp: 'cpp',
					'h++': 'cpp',
					hxx: 'cpp',
					py: 'python',
					sh: 'bash',
					shell: 'bash',
					zsh: 'bash',
					js: 'javascript',
					mjs: 'javascript',
					cjs: 'javascript',
					ts: 'typescript',
					mts: 'typescript',
					cts: 'typescript',
					yml: 'yaml',
					md: 'markdown',
					plain: 'text',
					plaintext: 'text',
					txt: 'text'
				};
				return aliases[raw] || raw;
			}

			function getCodeBlockLanguage(codeElement) {
				var pre = codeElement.parentElement;
				// chat-widget.js installs a global marked renderer that emits
				// <pre class="cw-code" data-lang="X"> instead of the default
				// <code class="language-X">, so check both attribute names.
				var raw = (pre && pre.dataset && (pre.dataset.language || pre.dataset.lang)) || '';
				if (!raw) {
					var match = (codeElement.className || '').match(/(?:^|\s)language-([A-Za-z0-9_+#.-]+)/);
					raw = match ? match[1] : '';
				}
				return normalizeCodeLanguage(raw);
			}

			async function getShikiCodeToHtml() {
				if (!shikiModulePromise) {
					shikiModulePromise = import(SHIKI_IMPORT_URL).catch(function(error) {
						shikiModulePromise = null;
						throw error;
					});
				}
				var shiki = await shikiModulePromise;
				return shiki.codeToHtml;
			}

			async function applySyntaxHighlighting(container) {
				var codeBlocks = Array.from(container.querySelectorAll('pre > code'));
				var highlightableBlocks = codeBlocks.filter(function(codeElement) {
					var lang = getCodeBlockLanguage(codeElement);
					return lang && lang !== 'text';
				});
				if (!highlightableBlocks.length) return;

				var codeToHtml;
				try {
					codeToHtml = await getShikiCodeToHtml();
				} catch (error) {
					console.warn('Shiki failed to initialize. Falling back to plain code blocks.', error);
					return;
				}

				for (var i = 0; i < highlightableBlocks.length; i++) {
					var codeElement = highlightableBlocks[i];
					var originalPre = codeElement.parentElement;
					var lang = getCodeBlockLanguage(codeElement);
					try {
						var highlightedHtml = await codeToHtml(codeElement.textContent || '', {
							lang: lang,
							theme: SHIKI_THEME
						});
						var template = document.createElement('template');
						template.innerHTML = highlightedHtml.trim();
						var highlightedPre = template.content.firstElementChild;
						if (!highlightedPre) continue;
						highlightedPre.dataset.language = lang;
						originalPre.replaceWith(highlightedPre);
					} catch (error) {
						console.warn('Shiki failed to highlight a code block.', error);
					}
				}
			}

			function renderPreview(plainText, preview) {
				// Pre-process: wrap block math $$...$$ in div to survive marked parsing
				var src = plainText.replace(/\$\$([\s\S]+?)\$\$/g, function(match) {
					return '\n<div class="math-block">\n\n' + match + '\n\n</div>\n';
				});

				var html = marked.parse(src, { breaks: false, gfm: true });
				preview.innerHTML = html;
				addHeadingIds(preview);

				// Handle anchor clicks within preview pane
				preview.querySelectorAll('a[href^="#"]').forEach(function(a) {
					a.addEventListener('click', function(e) {
						var id = decodeURIComponent(a.getAttribute('href').slice(1));
						var target = preview.querySelector('#' + CSS.escape(id));
						if (target) {
							e.preventDefault();
							var containerRect = preview.getBoundingClientRect();
							var targetRect = target.getBoundingClientRect();
							preview.scrollTo({
								top: preview.scrollTop + targetRect.top - containerRect.top,
								behavior: 'smooth'
							});
						}
					});
				});

				// KaTeX auto-render (handles both $...$ and $$...$$)
				applyMathRendering(preview);
				// Live preview keeps code blocks plain — Shiki highlighting is
				// only applied at export time (Download PDF / standalone HTML).

	return null; // we set innerHTML ourselves
			}

			/* ── Custom toolbar actions ────────────────── */

			function actionInlineCode(editor) {
				var cm = editor.codemirror;
				var sel = cm.getSelection();
				cm.replaceSelection('`' + (sel || 'code') + '`');
				if (!sel) { var cur = cm.getCursor(); cm.setSelection({ line: cur.line, ch: cur.ch - 5 }, { line: cur.line, ch: cur.ch - 1 }); }
				cm.focus();
			}

			function actionMath(editor) {
				var cm = editor.codemirror;
				var sel = cm.getSelection();
				cm.replaceSelection('$' + (sel || 'formula') + '$');
				if (!sel) { var cur = cm.getCursor(); cm.setSelection({ line: cur.line, ch: cur.ch - 8 }, { line: cur.line, ch: cur.ch - 1 }); }
				cm.focus();
			}

			function actionToc(editor) {
				var cm = editor.codemirror;
				var lines = cm.getValue().split('\n');
				var toc = [];
				var inCode = false;
				for (var i = 0; i < lines.length; i++) {
					var line = lines[i];
					if (/^```/.test(line)) { inCode = !inCode; continue; }
					if (inCode) continue;
					var m = line.match(/^(#{1,6})\s+(.+)/);
					if (!m) continue;
					var level = m[1].length;
					var text = m[2].replace(/[*_`\[\]]/g, '').trim();
					var anchor = text.toLowerCase().replace(/[^\w\u4e00-\u9fff]+/g, '-').replace(/^-|-$/g, '');
					var indent = '  '.repeat(level - 1);
					toc.push(indent + '1. [' + text + '](#' + anchor + ')');
				}
				if (!toc.length) return;
				var result = '## Table of Contents\n\n' + toc.join('\n') + '\n\n';
				cm.replaceSelection(result);
				cm.focus();
			}

			function actionUpload(editor) {
				var input = document.getElementById('me-file-input');
				input.value = '';
				input.onchange = function() {
					var file = input.files[0];
					if (!file) return;
					if (file.size > 5 * 1024 * 1024) {
						alert('File too large (max 5 MB)');
						return;
					}
					var reader = new FileReader();
					reader.onload = function() {
						editor.value(reader.result);
						resetLoadedDocumentState(editor);
						editor.codemirror.focus();
					};
					reader.readAsText(file);
				};
				input.click();
			}

			// ── Statusbar widgets: reading time & word goal ──
			// Word counter: split CJK ideographs as individual "words", everything
			// else by whitespace. Mirrors how md-viewer / chat widget approximate
			// length so the count matches the user's mental model.
			function countWordsAndChars(text) {
				if (!text) return { words: 0, cjk: 0 };
				var cjkChars = (text.match(/[一-鿿぀-ヿ]/g) || []).length;
				var noCjk = text.replace(/[一-鿿぀-ヿ]/g, ' ');
				var nonCjkWords = (noCjk.match(/[A-Za-z0-9]+(?:['’-][A-Za-z0-9]+)*/g) || []).length;
				return { words: nonCjkWords + cjkChars, cjk: cjkChars };
			}

			function renderReadingTime(el, text) {
				var c = countWordsAndChars(text);
				if (!c.words) { el.textContent = ''; return; }
				// English ~200 wpm, Chinese ~300 cpm. Treat each as separate
				// "speed lane" then sum the seconds.
				var enWords = c.words - c.cjk;
				var seconds = (enWords / 200 + c.cjk / 300) * 60;
				var minutes = Math.max(1, Math.round(seconds / 60));
				el.textContent = '⏱ ' + minutes + ' min read';
			}

			function getWordGoal() {
				try {
					var raw = localStorage.getItem('me-editor-word-goal');
					if (!raw) return 0;
					var n = parseInt(raw, 10);
					return n > 0 ? n : 0;
				} catch (e) { return 0; }
			}

			function setWordGoal(n) {
				try {
					if (n > 0) localStorage.setItem('me-editor-word-goal', String(n));
					else localStorage.removeItem('me-editor-word-goal');
				} catch (e) {}
			}

			function renderWordGoal(el, text) {
				var goal = getWordGoal();
				if (!goal) {
					el.innerHTML = '<span class="me-goal-empty">Set goal…</span>';
					return;
				}
				var current = countWordsAndChars(text).words;
				var pct = Math.min(100, Math.round((current / goal) * 100));
				el.innerHTML =
					'<span class="me-goal-text">' + current + ' / ' + goal + '</span>' +
					'<span class="me-goal-bar"><span class="me-goal-fill" style="width:' + pct + '%"></span></span>';
			}

			function promptWordGoal() {
				var current = getWordGoal();
				var input = window.prompt('Word goal (0 to clear):', current ? String(current) : '500');
				if (input === null) return;
				var n = parseInt(input, 10);
				setWordGoal(n);
				// Trigger a refresh by poking the cursorActivity event
				if (typeof easyMDE !== 'undefined') {
					var sb = document.querySelector('.editor-statusbar .me-word-goal');
					if (sb) renderWordGoal(sb, easyMDE.value());
				}
			}

			function actionDownload(editor) {
				var src = editor.value();
				var blob = new Blob([src], { type: 'text/markdown;charset=utf-8' });
				var a = document.createElement('a');
				a.href = URL.createObjectURL(blob);
				a.download = 'document.md';
				a.click();
				URL.revokeObjectURL(a.href);
			}

	function actionOpenInViewer(editor) {

				window.open('../md-viewer/', '_blank');

			// ── Draft snapshots (manual history) ──
			// Stored as a JSON array under `me-editor-snapshots`. Each entry:
			// { id, content, savedAt, title }. Capped at 8 (FIFO eviction).
			var SNAPSHOT_KEY = 'me-editor-snapshots';
			var SNAPSHOT_MAX = 8;

			function loadSnapshots() {
				try {
					var raw = localStorage.getItem(SNAPSHOT_KEY);
					if (!raw) return [];
					var arr = JSON.parse(raw);
					return Array.isArray(arr) ? arr : [];
				} catch (e) { return []; }
			}

			function saveSnapshots(arr) {
				try { localStorage.setItem(SNAPSHOT_KEY, JSON.stringify(arr)); } catch (e) {}
			}

			function snapshotTitle(content) {
				// Find first heading
				var m = content.match(/^#{1,6}\s+(.+?)\s*$/m);
				if (m) return m[1].replace(/[*_`]/g, '').trim().slice(0, 80);
				// First non-blank line
				var lines = content.split('\n');
				for (var i = 0; i < lines.length; i++) {
					var t = lines[i].trim();
					if (t) return t.slice(0, 80);
				}
				return 'Untitled';
			}

			function pushSnapshot(content) {
				if (!content || !content.trim()) return null;
				var arr = loadSnapshots();
				var entry = {
					id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
					content: content,
					savedAt: Date.now(),
					title: snapshotTitle(content)
				};
				arr.unshift(entry);
				while (arr.length > SNAPSHOT_MAX) arr.pop();
				saveSnapshots(arr);
				return entry;
			}

			function deleteSnapshot(id) {
				saveSnapshots(loadSnapshots().filter(function(e) { return e.id !== id; }));
			}

			function relativeTime(ts) {
				var diff = Math.round((Date.now() - ts) / 60000);
				if (diff < 1) return 'just now';
				if (diff < 60) return diff + ' min ago';
				if (diff < 60 * 24) return Math.round(diff / 60) + ' h ago';
				return Math.round(diff / (60 * 24)) + ' d ago';
			}

			function actionDrafts(editor) {
				var existing = document.getElementById('me-drafts-overlay');
				if (existing) { existing.hidden = false; renderDrafts(); return; }
				var overlay = document.createElement('div');
				overlay.id = 'me-drafts-overlay';
				overlay.className = 'me-drafts-overlay';
				var iconTrash = wrapLucide('<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>');
				var iconSave = wrapLucide('<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>');
				overlay.innerHTML =
					'<div class="me-drafts-modal" role="dialog" aria-label="Drafts">' +
						'<div class="me-drafts-head">' +
							'<h3>Drafts</h3>' +
							'<button class="me-drafts-head-btn me-drafts-clear-btn" id="me-drafts-clear">' + iconTrash + '<span>Delete all</span></button>' +
							'<button class="me-drafts-head-btn me-drafts-snap-btn" id="me-drafts-snap">' + iconSave + '<span>Save current</span></button>' +
						'</div>' +
						'<div class="me-drafts-list" id="me-drafts-list"></div>' +
					'</div>';
				document.body.appendChild(overlay);

				overlay.addEventListener('click', function(e) {
					if (e.target === overlay) overlay.hidden = true;
				});
				document.addEventListener('keydown', function(e) {
					if (e.key === 'Escape' && !overlay.hidden) overlay.hidden = true;
				});
				overlay.querySelector('#me-drafts-snap').addEventListener('click', function() {
					var entry = pushSnapshot(editor.value());
					if (entry) renderDrafts();
				});
				overlay.querySelector('#me-drafts-clear').addEventListener('click', function() {
					if (!loadSnapshots().length) return;
					if (!window.confirm('Delete ALL saved drafts? This cannot be undone.')) return;
					saveSnapshots([]);
					renderDrafts();
				});

				renderDrafts();

				function renderDrafts() {
					var list = overlay.querySelector('#me-drafts-list');
					var snaps = loadSnapshots();
					var clearBtn = overlay.querySelector('#me-drafts-clear');
					if (clearBtn) clearBtn.disabled = !snaps.length;
					if (!snaps.length) {
						list.innerHTML = '<div class="me-drafts-empty">No saved drafts yet. Click "Save current" to snapshot the current document.</div>';
						return;
					}
					list.innerHTML = snaps.map(function(s) {
						var c = countWordsAndChars(s.content);
						return '<div class="me-draft-row" data-id="' + s.id + '">' +
							'<div class="me-draft-info">' +
								'<div class="me-draft-title">' + s.title.replace(/[<>&"']/g, function(ch) { return ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'})[ch]; }) + '</div>' +
								'<div class="me-draft-meta">' + c.words + ' words · ' + relativeTime(s.savedAt) + '</div>' +
							'</div>' +
							'<button class="me-draft-del" data-act="del">Delete</button>' +
						'</div>';
					}).join('');
					list.querySelectorAll('.me-draft-row').forEach(function(row) {
						var id = row.dataset.id;
						row.addEventListener('click', function(e) {
							if (e.target.closest('[data-act="del"]')) return;
							var entry = loadSnapshots().find(function(s) { return s.id === id; });
							if (!entry) return;
							var current = editor.value();
							if (current.trim() && !window.confirm('Replace current content with this draft?')) return;
							editor.value(entry.content);
							resetLoadedDocumentState(editor);
							overlay.hidden = true;
							editor.codemirror.focus();
						});
						row.querySelector('[data-act="del"]').addEventListener('click', function(e) {
							e.stopPropagation();
							if (!window.confirm('Delete this snapshot?')) return;
							deleteSnapshot(id);
							renderDrafts();
						});
					});
				}
			}

			function wrapLucide(paths) {
				return '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + paths + '</svg>';

				var classes = icon.className.split(/\s+/);
				var key = null;
				// Heading variants carry `header-1` / `header-2` / `header-3` alongside `fa-header`
				for (var i = 0; i < classes.length; i++) {
					if (/^header-[1-3]$/.test(classes[i])) { key = classes[i]; break; }
				}
				// Otherwise pick the first fa-* class we have in our map
				if (!key) {
					for (var j = 0; j < classes.length; j++) {
						if (classes[j].indexOf('fa-') === 0 && lucideIcons[classes[j]]) { key = classes[j]; break; }
					}
				}
				if (!key) return;
				var span = document.createElement('span');
				span.innerHTML = wrapLucide(lucideIcons[key]);
				span.style.cssText = 'display:inline-flex;align-items:center;';
				icon.replaceWith(span);
			});

			// ── Export dropdown menu (Download HTML / Download PDF) ──
			(function setupExportMenu() {
				var btn = document.querySelector('.editor-toolbar .me-export-toolbar-btn')

					|| document.querySelector('.editor-toolbar button.export');
				if (!btn) return;

				// Menu attaches to body + position:fixed so .me-editor-card's
				// overflow:hidden doesn't clip the dropdown in non-fullscreen mode.
				var menu = document.createElement('div');
				menu.className = 'me-export-menu';

				menu.innerHTML =
					'<div class="me-export-item" data-action="download-md">'
						+ '<span class="me-export-icon"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="m9 18 3-3-3-3"/><path d="M5 15h7"/></svg></span>'
						+ '<div class="me-export-body"><span class="me-export-label">Download .md</span><span class="me-export-desc">Source markdown · lossless, re-editable</span></div>'
					+ '</div>'
					+ '<div class="me-export-divider"></div>'
					+ '<div class="me-export-item" data-action="download-html">'
						+ '<span class="me-export-icon"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></span>'
						+ '<div class="me-export-body"><span class="me-export-label">Download HTML</span><span class="me-export-desc">Standalone .html with KaTeX and highlighted code</span></div>'
					+ '</div>'
					+ '<div class="me-export-item" data-action="download-pdf">'
						+ '<span class="me-export-icon"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13v5"/><path d="M9 13h2a1.5 1.5 0 1 1 0 3H9"/></svg></span>'
						+ '<div class="me-export-body"><span class="me-export-label">Download PDF</span><span class="me-export-desc">One-click .pdf · always rendered in light theme</span></div>'
					+ '</div>';
				document.body.appendChild(menu);

				function position() {
					var btnRect = btn.getBoundingClientRect();
					// Anchor under the *toolbar's* bottom edge, not the button's,
					// so the menu doesn't stick into the toolbar area when buttons
					// are smaller than the toolbar height.
					var toolbar = btn.closest('.editor-toolbar');
					var topAnchor = toolbar ? toolbar.getBoundingClientRect().bottom + 6 : btnRect.bottom + 6;
					menu.style.top = topAnchor + 'px';
					menu.style.bottom = 'auto';
					// On mobile the menu's min-width (290px) often exceeds the
					// space available on the right of the button — span the
					// full viewport width with small margins instead.
					var isMobile = window.matchMedia('(max-width: 736px)').matches;
					if (isMobile) {
						menu.style.left = '8px';
						menu.style.right = '8px';
					} else {
						menu.style.left = 'auto';
						menu.style.right = Math.max(8, window.innerWidth - btnRect.right) + 'px';
					}
				}
				function open() {
					position();
					menu.hidden = false;
					btn.classList.add('active');
				}
				function close() { menu.hidden = true; btn.classList.remove('active'); }
				function toggle() { if (menu.hidden) open(); else close(); }

				// Take over the click on the toolbar button. Capture-phase + stopImmediate
				// guarantees we run before EasyMDE's bubble-phase action handler and
				// before the click bubbles up to our doc-level "close on outside click"
				// listener (preventing accidental immediate close).
				btn.addEventListener('click', function(e) {
					e.preventDefault();
					e.stopImmediatePropagation();
					toggle();
				}, true);

				// Close on outside click. Since the button click was stopped above,
				// this listener only sees clicks elsewhere.
				document.addEventListener('click', function(e) {
					if (menu.hidden) return;
					if (menu.contains(e.target)) return;
					close();
				});
				document.addEventListener('keydown', function(e) {
					if (e.key === 'Escape' && !menu.hidden) close();
				});
				window.addEventListener('resize', function() { if (!menu.hidden) position(); });
				window.addEventListener('scroll', function() { if (!menu.hidden) position(); }, true);
				menu.addEventListener('click', function(e) {
					var item = e.target.closest('.me-export-item');
					if (!item) return;
					close();
					var act = item.dataset.action;
					if (exportActions[act]) exportActions[act]();
				});

				window._meToggleExportMenu = toggle;
			})();

			// Toast helper (small bottom-right notice)
			function showToast(msg) {
				var el = document.getElementById('me-toast');
				if (!el) {
					el = document.createElement('div');
					el.id = 'me-toast';
					el.style.cssText = 'position:fixed;bottom:1.5rem;right:1.5rem;background:#1e293b;color:#fff;padding:0.65rem 0.95rem;border-radius:0.45rem;font:500 0.86rem/1.4 "Inter",sans-serif;box-shadow:0 12px 28px rgba(0,0,0,0.3);z-index:200;opacity:0;transform:translateY(20px);transition:opacity 0.2s ease, transform 0.2s ease;pointer-events:none;max-width:340px';
					document.body.appendChild(el);
				}
				el.textContent = msg;
				requestAnimationFrame(function() {
					el.style.opacity = '1';
					el.style.transform = 'translateY(0)';
				});
				clearTimeout(el._t);
				el._t = setTimeout(function() {
					el.style.opacity = '0';
					el.style.transform = 'translateY(20px)';
				}, 3500);
			}

			function getDocumentTitle(rawMd) {
				return ((rawMd || '').match(/^#\s+(.+)$/m) || [])[1] || 'document';
			}

			function exportFilename(title, ext) {
				var base = (title || 'document').trim().slice(0, 60).replace(/[^\w\u4e00-\u9fff -]/g, '').trim();
				return (base || 'document') + ext;
			}

			function markdownToExportHtml(rawMd) {
				var src = (rawMd || '').replace(/\$\$([\s\S]+?)\$\$/g, function(match) {
					return '\n<div class="math-block">\n\n' + match + '\n\n</div>\n';
				});
				return marked.parse(src, { breaks: false, gfm: true });
			}

			async function renderExportContent(rawMd) {
				var container = document.createElement('div');
				container.innerHTML = markdownToExportHtml(rawMd);
				addHeadingIds(container);

				if (/\$/.test(container.textContent) || container.querySelector('.math-block')) {
					await loadKatex();
					await renderKatexIn(container);
				}

				await applySyntaxHighlighting(container);
				return container;
			}

			// Standalone HTML document string (used by Download HTML)
			function getStandaloneHtml(bodyHtml, title) {
				var katexCss = '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">';
				var styles = '<style>'
					+ 'body{font:400 14pt/1.7 "Source Sans Pro",-apple-system,sans-serif;color:#1d2939;background:#fff;margin:0}'
					+ '.markdown-body{max-width:820px;margin:2rem auto;padding:0 1.5rem}'
					+ '.markdown-body h1,.markdown-body h2,.markdown-body h3,.markdown-body h4{color:#244f8f;font-weight:700}'
					+ '.markdown-body h1{font-size:1.75em;padding-bottom:0.4rem;border-bottom:3px solid rgba(42,79,133,0.16);margin:1.4rem 0 0.6rem}'
					+ '.markdown-body h1:first-child{margin-top:0}'
					+ '.markdown-body h2{font-size:1.4em;padding-left:0.7rem;border-left:4px solid #244f8f;line-height:1.4;margin:1.3rem 0 0.5rem}'
					+ '.markdown-body h3{font-size:1.18em;margin:1.1rem 0 0.45rem}'
					+ '.markdown-body p{margin:0 0 0.8rem}'
					+ '.markdown-body :not(pre)>code{background:rgba(36,79,143,0.10);color:#244f8f;padding:0.1rem 0.35rem;border-radius:0.25rem;font:500 0.86em/1 "Menlo","Consolas",monospace}'
					+ '.markdown-body pre{background:#1e1e1e;color:#d4d4d4;padding:1rem;border-radius:0.5rem;overflow-x:auto;font:400 0.86em/1.55 "Menlo",monospace}'
					+ '.markdown-body pre code{background:transparent;color:inherit;padding:0}'
					+ '.markdown-body pre.shiki code .line{display:block;min-height:1.55em}'
					+ '.markdown-body blockquote{border-left:4px solid #244f8f;background:rgba(36,79,143,0.08);padding:0.6rem 1rem;margin:0.9rem 0;border-radius:0 0.4rem 0.4rem 0;color:#516074}'
					+ '.markdown-body table{width:100%;border-collapse:collapse;margin:0.8rem 0}'
					+ '.markdown-body th,.markdown-body td{border:1px solid rgba(42,79,133,0.16);padding:0.45rem 0.7rem;text-align:left}'
					+ '.markdown-body th{background:rgba(36,79,143,0.07);font-weight:700}'
					+ '.markdown-body a{color:#244f8f}'
					+ '.math-block{overflow-x:hidden;text-align:center;margin:1rem 0}.math-block .katex-display{margin:0}.math-block .katex-display>.katex{max-width:100%;overflow-x:auto;overflow-y:hidden;padding:2px 0}'
					+ '</style>';

			}

			// html2pdf.js lazy loader
			var html2pdfReady = null;
			function loadHtml2Pdf() {
				if (html2pdfReady) return html2pdfReady;
				html2pdfReady = new Promise(function(resolve, reject) {
					if (window.html2pdf) return resolve();
					var s = document.createElement('script');
					s.src = 'https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js';
					s.onload = resolve;
					s.onerror = function() { html2pdfReady = null; reject(); };
					document.head.appendChild(s);
				});
				return html2pdfReady;
			}

			// KaTeX auto-render for export DOM
			function renderKatexIn(el) {
				if (!window.renderMathInElement) return Promise.resolve();
				try {
					window.renderMathInElement(el, {
						delimiters: [
							{ left: '$$', right: '$$', display: true },
							{ left: '$', right: '$', display: false }
						],
						throwOnError: false
					});
				} catch (e) {}
				return Promise.resolve();
			}

			var exportActions = {
				'download-md': function() { actionDownload(easyMDE); },
				'download-html': async function() {
					var src = easyMDE.value();
					var title = getDocumentTitle(src);
					showToast('Rendering HTML...');
					try {
						var rendered = await renderExportContent(src);
						var html = getStandaloneHtml(rendered.innerHTML, title);
						var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
						var url = URL.createObjectURL(blob);
						var a = document.createElement('a');
						a.href = url;
						a.download = exportFilename(title, '.html');
						document.body.appendChild(a); a.click(); document.body.removeChild(a);
						URL.revokeObjectURL(url);
						showToast('✓ HTML downloaded');
					} catch (err) {
						showToast('✗ HTML export failed');
						console.warn(err);
					}
				},

				'download-pdf': async function() {
					var src = easyMDE.value();
					var title = getDocumentTitle(src);
					var fname = exportFilename(title, '.pdf');
					var stage = null;

					try {
						showToast('Rendering PDF...');
						var rendered = await renderExportContent(src);
						stage = document.createElement('div');
						stage.className = 'me-pdf-stage';

						var container = rendered;
						container.className = 'me-pdf-render';
						container.setAttribute('data-theme', 'light');
						stage.appendChild(container);
						document.body.appendChild(stage);

						await new Promise(function(resolve) {
							requestAnimationFrame(function() { requestAnimationFrame(resolve); });
						});

						showToast('Loading PDF generator...');
						await loadHtml2Pdf();
						showToast('Generating PDF...');

						var opts = {
							margin: [10, 16, 12, 16],
							filename: fname,
							image: { type: 'jpeg', quality: 0.96 },
							html2canvas: {
								scale: 2,
								useCORS: true,
								backgroundColor: '#ffffff',
								scrollX: 0,
								scrollY: 0,
								x: 0,
								y: 0,
								width: container.offsetWidth,
								height: container.scrollHeight,
								windowWidth: container.offsetWidth,
								windowHeight: container.scrollHeight
							},
							jsPDF: { unit: 'mm', format: 'letter', orientation: 'portrait' },
							pagebreak: { mode: ['css', 'legacy'] }
						};

						await window.html2pdf().from(container).set(opts).save();
						showToast('✓ ' + fname + ' downloaded');
					} catch (err) {
						showToast('✗ PDF generation failed');
						console.warn(err);
					} finally {
						if (stage) stage.remove();
					}
				}
			};

			// Sync the actual toolbar height into a CSS var so the preview-side
			// (absolute-positioned in non-fullscreen) anchors to the bottom of
			// the toolbar exactly, keeping editor + preview tops aligned.
			// Force lineWrapping on. EasyMDE's option doesn't always pass cleanly
			// to the underlying CodeMirror, so set it explicitly after init.
			easyMDE.codemirror.setOption('lineWrapping', true);
			easyMDE.codemirror.getWrapperElement().classList.add('CodeMirror-wrap');
			easyMDE.codemirror.refresh();

			// ── Draggable split gutter (between editor + preview in side-by-side) ──
			(function setupSplitGutter() {
				var card = document.querySelector('.me-editor-card');
				var container = card && card.querySelector('.EasyMDEContainer');
				if (!card || !container) return;
				var cm = easyMDE.codemirror;

				var gutter = document.createElement('div');
				gutter.className = 'me-pane-gutter';
				gutter.setAttribute('role', 'separator');
				gutter.setAttribute('aria-orientation', 'vertical');
				gutter.setAttribute('aria-label', 'Resize editor / preview');
				container.appendChild(gutter);

				// Restore split from localStorage
				var STORAGE_KEY = 'me-split-pct';
				try {
					var saved = parseFloat(localStorage.getItem(STORAGE_KEY));
					if (saved && saved >= 15 && saved <= 85) {
						applySplit(saved);
					}
				} catch (e) {}

				function applySplit(pct) {
					card.style.setProperty('--me-split', pct + '%');
					card.style.setProperty('--me-split-num', (pct / 100).toString());
				}

				var rafId = null;
				function refreshSoon() {
					if (rafId) cancelAnimationFrame(rafId);
					rafId = requestAnimationFrame(function() { cm.refresh(); rafId = null; });
				}

				gutter.addEventListener('pointerdown', function(e) {
					e.preventDefault();
					gutter.setPointerCapture(e.pointerId);
					gutter.classList.add('dragging');
					document.body.classList.add('me-pane-dragging');

			// Compute --me-editor-h dynamically: the editor (and side-by-side

					// value is independent of current scroll position.

			(function setupSmartPaste() {

				var inputField = cm.getInputField();
				if (!inputField) return;

				function tsvToTable(text) {
					var lines = text.replace(/\r\n?/g, '\n').split('\n');
					// Strip trailing empty lines
					while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
					if (lines.length < 2) return null;
					var rows = lines.map(function(l) { return l.split('\t'); });
					var cols = Math.max.apply(null, rows.map(function(r) { return r.length; }));
					if (cols < 2) return null;
					// Pad rows to same column count, escape pipes
					rows = rows.map(function(r) {
						while (r.length < cols) r.push('');
						return r.map(function(cell) {
							return cell.replace(/\|/g, '\\|').trim();
						});
					});
					var header = '| ' + rows[0].join(' | ') + ' |';
					var sep = '| ' + rows[0].map(function() { return '---'; }).join(' | ') + ' |';
					var body = rows.slice(1).map(function(r) {
						return '| ' + r.join(' | ') + ' |';
					}).join('\n');
					return header + '\n' + sep + '\n' + body;
				}

					if (!e.clipboardData) return;
					var text = e.clipboardData.getData('text/plain');
					if (!text) return;
					var trimmed = text.trim();

					// 1) Pure URL paste with non-empty selection → make a link
					if (/^https?:\/\/\S+$/.test(trimmed) && !/\s/.test(trimmed)) {

						if (sel) {

						return;
					}

					// 2) TSV → Markdown table. Strict heuristics to avoid eating
					//    tab-indented code: every non-empty line must have the
					//    same tab count (≥1), and no line may start with a tab
					//    (which is the giveaway for indented code).
					if (text.indexOf('\t') >= 0) {
						var lines = text.replace(/\r\n?/g, '\n').split('\n').filter(function(l) { return l.length > 0; });
						if (lines.length >= 2) {
							var tabCounts = lines.map(function(l) { return (l.match(/\t/g) || []).length; });
							var firstTabs = tabCounts[0];
							var consistent = firstTabs >= 1 && tabCounts.every(function(c) { return c === firstTabs; });

					// exclude from the rebuild signature so the panel doesn't

					{ hint: wrapLucide(ic.ol),      label: 'Numbered List', aliases: 'list ol ordered numbered',   apply: function(cm) { cm.replaceSelection('1. '); } },
					{ hint: wrapLucide(ic.todo),    label: 'Todo List',     aliases: 'todo task checkbox check',   apply: function(cm) { cm.replaceSelection('- [ ] '); } },
					{ hint: wrapLucide(ic.quote),   label: 'Quote',         aliases: 'quote blockquote',           apply: function(cm) { cm.replaceSelection('> '); } },
					{ hint: wrapLucide(ic.divider), label: 'Divider',       aliases: 'divider hr horizontal rule separator', apply: function(cm) { cm.replaceSelection('---\n'); } },

							+ '</div>';
					}).join('');
					var active = listEl.querySelector('.me-slash-item.active');
					if (active) active.scrollIntoView({ block: 'nearest' });
				}

				function position() {
					var coords = cm.cursorCoords(true, 'window');
					var maxLeft = window.innerWidth - 260;
					var left = Math.min(coords.left, maxLeft);
					var top = coords.bottom + 4;
					// Flip above if not enough room below
					if (top + 320 > window.innerHeight && coords.top > 320) {
						top = coords.top - 4;
						menu.style.transform = 'translateY(-100%)';
					} else {
						menu.style.transform = '';
					}
					menu.style.left = left + 'px';
					menu.style.top = top + 'px';
				}

				function open(startPos) {
					state = { startPos: startPos, query: '', activeIdx: 0, filtered: items.slice() };
					render();
					menu.hidden = false;
					position();
				}

				function close() {
					state = null;
					menu.hidden = true;
				}

				function applySelection() {
					if (!state || !state.filtered.length) return;
					var item = state.filtered[state.activeIdx];
					var endPos = cm.getCursor();
					var startPos = state.startPos;
					close();
					// Remove the typed "/query"
					cm.replaceRange('', startPos, endPos);
					cm.setCursor(startPos);
					item.apply(cm);
					cm.focus();
				}

				cm.on('inputRead', function(cm, change) {
					if (state) return;
					if (change.text.length !== 1 || change.text[0] !== '/') return;
					var cursor = cm.getCursor();
					var line = cm.getLine(cursor.line);
					var before = line.substring(0, cursor.ch - 1);
					if (!/^\s*$/.test(before)) return;
					open({ line: cursor.line, ch: cursor.ch - 1 });
				});

				cm.on('cursorActivity', function() {
					if (!state) return;
					var cursor = cm.getCursor();
					if (cursor.line !== state.startPos.line || cursor.ch <= state.startPos.ch) {
						close();
						return;
					}
					var line = cm.getLine(cursor.line);
					// If the "/" character was deleted, close
					if (line.charAt(state.startPos.ch) !== '/') {
						close();
						return;
					}
					var newQuery = line.substring(state.startPos.ch + 1, cursor.ch);
					// Space dismisses (matches Notion behavior)
					if (/\s/.test(newQuery)) { close(); return; }
					state.query = newQuery;
					render();
					position();
				});

				cm.on('keydown', function(cm, e) {
					if (!state) return;
					if (e.key === 'Escape') {
						e.preventDefault();
						close();
					} else if (e.key === 'ArrowDown') {
						e.preventDefault();
						state.activeIdx = Math.min(state.activeIdx + 1, state.filtered.length - 1);
						render();
					} else if (e.key === 'ArrowUp') {
						e.preventDefault();
						state.activeIdx = Math.max(state.activeIdx - 1, 0);
						render();
					} else if (e.key === 'Enter' || e.key === 'Tab') {
						if (state.filtered.length) {
							e.preventDefault();
							applySelection();
						}
					}
				});

				listEl.addEventListener('mousedown', function(e) {
					var el = e.target.closest('.me-slash-item');
					if (!el) return;
					e.preventDefault();
					state.activeIdx = parseInt(el.dataset.idx, 10);
					applySelection();
				});

				document.addEventListener('mousedown', function(e) {
					if (!state) return;
					if (menu.contains(e.target)) return;
					if (cm.getWrapperElement().contains(e.target)) return;
					close();
				});

				cm.on('blur', function() {
					// Brief delay so item-click mousedown can run first
					setTimeout(function() { if (state && !document.activeElement.closest('.me-slash-menu')) close(); }, 80);
				});
			})();

		})();
		</script>

	</body>
</html>
