<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Markdown Editor | Kazuha Mo — UC Irvine</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="../../favicon.ico" type="image/x-icon" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="../../assets/css/bento.css" />
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde@2/dist/easymde.min.css" />
		<script>
			(function () {
				try {
					var saved = localStorage.getItem("kzh-theme");
					var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
					document.documentElement.setAttribute("data-theme", saved || (prefersDark ? "dark" : "light"));
				} catch (e) {}
			})();
		</script>
		<style>
			#main > * > .inner { max-width: none; width: calc(100% - 8em); }

			:root {
				--me-blue: #244f8f;
				--me-blue-bg: rgba(36, 79, 143, 0.10);
				--me-blue-border: rgba(36, 79, 143, 0.22);
				--me-blue-bg-strong: rgba(36, 79, 143, 0.17);
				--me-blue-hover: #183b73;
				--me-border: rgba(42, 79, 133, 0.16);
				--me-border-soft: rgba(42, 79, 133, 0.12);
				--me-ink: #23324a;
				--me-muted: #516074;
				--me-card-bg: rgba(255, 255, 255, 0.98);
				--me-card-bg-soft:
					radial-gradient(circle at top right, rgba(36, 79, 143, 0.08), transparent 18rem),
					linear-gradient(135deg, rgba(255,255,255,0.98) 0%, rgba(246,249,255,0.99) 58%, rgba(250,252,255,0.98) 100%);
				--me-card-shadow: 0 1.25rem 3rem rgba(23, 43, 77, 0.08);
				--me-card-shadow-lg: 0 1.5rem 3.5rem rgba(23, 43, 77, 0.08);
				--me-editor-bg: #ffffff;
				--me-toolbar-bg: #f8f9fb;
				--me-preview-bg: #fafbfd;
				--me-chip-current-text: #ffffff;
				--me-crumb-sep: #97a7bb;
				--me-gutter-text: #aab3c0;
				--me-hr-muted: #aab3c0;
				--me-code-dark-bg: #1e1e1e;

				/* CodeMirror syntax tokens (light) */
				--me-cm-header: #244f8f;
				--me-cm-strong: #1a1a2e;
				--me-cm-em: #8b5a18;
				--me-cm-strike: #999;
				--me-cm-link: #0c8a5f;
				--me-cm-url: #2d5b95;
				--me-cm-comment: #6a737d;
				--me-cm-quote: #42526b;
				--me-cm-tag: #808080;
				--me-cm-string: #c7254e;
				--me-cm-keyword: #244f8f;
				--me-cm-variable: #2d5b95;
				--me-cm-toolbar-btn: #555;

				/* Preview (mirrors md-viewer styling) */
				--me-h2-border: #2d5b95;
				--me-h3: #334155;
				--me-inline-code-bg: rgba(33, 82, 164, 0.08);
				--me-inline-code-text: #293e6a;
				--me-blockquote-bg: rgba(33, 82, 164, 0.05);
				--me-blockquote-border: rgba(33, 82, 164, 0.45);
				--me-blockquote-text: #42526b;
				--me-hr: rgba(144, 163, 191, 0.35);
				--me-table-header-bg: rgba(33, 82, 164, 0.06);
				--me-a-underline: rgba(36, 79, 143, 0.28);
				--me-a-underline-hover: rgba(24, 59, 115, 0.52);
			}

			html[data-theme="dark"] {
				--me-blue: #6aa3f5;
				--me-blue-bg: rgba(106, 163, 245, 0.15);
				--me-blue-border: rgba(106, 163, 245, 0.32);
				--me-blue-bg-strong: rgba(106, 163, 245, 0.24);
				--me-blue-hover: #a8c9ff;
				--me-border: rgba(255, 255, 255, 0.1);
				--me-border-soft: rgba(255, 255, 255, 0.07);
				--me-ink: #dde4f0;
				--me-muted: #8c9cb5;
				--me-card-bg: #14181f;
				--me-card-bg-soft:
					radial-gradient(circle at top right, rgba(106, 163, 245, 0.08), transparent 18rem),
					linear-gradient(135deg, #181d26 0%, #1a1f29 58%, #1c222c 100%);
				--me-card-shadow: 0 1.25rem 3rem rgba(0, 0, 0, 0.35);
				--me-card-shadow-lg: 0 1.5rem 3.5rem rgba(0, 0, 0, 0.4);
				--me-editor-bg: #0f1319;
				--me-toolbar-bg: #181d26;
				--me-preview-bg: #12161d;
				--me-chip-current-text: #0a0d12;
				--me-crumb-sep: #54627a;
				--me-gutter-text: #54627a;
				--me-hr-muted: #54627a;

				--me-cm-header: #6aa3f5;
				--me-cm-strong: #e2eaf5;
				--me-cm-em: #ecb86a;
				--me-cm-strike: #5c6579;
				--me-cm-link: #4ec9a9;
				--me-cm-url: #7ab5ff;
				--me-cm-comment: #7a8696;
				--me-cm-quote: #b4c0d4;
				--me-cm-tag: #8892a6;
				--me-cm-string: #e08ea7;
				--me-cm-keyword: #6aa3f5;
				--me-cm-variable: #a8c9ff;
				--me-cm-toolbar-btn: #b4c0d4;

				--me-h2-border: #6aa3f5;
				--me-h3: #b4c0d4;
				--me-inline-code-bg: rgba(106, 163, 245, 0.13);
				--me-inline-code-text: #b8d0ff;
				--me-blockquote-bg: rgba(106, 163, 245, 0.08);
				--me-blockquote-border: rgba(106, 163, 245, 0.5);
				--me-blockquote-text: #b4c0d4;
				--me-hr: rgba(255, 255, 255, 0.12);
				--me-table-header-bg: rgba(106, 163, 245, 0.09);
				--me-a-underline: rgba(106, 163, 245, 0.35);
				--me-a-underline-hover: rgba(168, 201, 255, 0.6);
			}

			/* Shell */
			.me-shell {
				position: relative;
				display: flex;
				flex-direction: column;
				background: var(--me-card-bg);
				border: 1px solid var(--me-border);
				border-radius: 1.4rem;
				box-shadow: var(--me-card-shadow-lg);
				overflow: hidden;
			}

			.me-shell > header.major {
				display: none;
			}

			/* Intro / Breadcrumb */
			.me-intro {
				padding: 0.75rem 1.5rem;
				border-bottom: 1px solid var(--me-border);
				background: var(--me-card-bg-soft);
			}
			.me-intro .crumbs { margin-bottom: 0; }

			.me-shell > :last-child { border-bottom: 0 !important; }

			.me-breadcrumb {
				display: flex;
				flex-wrap: wrap;
				gap: 0.45rem;
				align-items: center;
			}

			.me-chip {
				display: inline-flex;
				align-items: center;
				padding: 0.38rem 0.8rem;
				border-radius: 999px;
				font-size: 0.86rem;
				font-weight: 700;
				text-decoration: none;
				border-bottom: 0 !important;
				background: var(--me-blue-bg);
				box-shadow: inset 0 0 0 1.5px var(--me-blue-border);
				color: var(--me-blue) !important;
				transition: background 0.2s ease, transform 0.2s ease;
			}

			.me-chip:hover {
				background: var(--me-blue-bg-strong);
				transform: translateY(-1px);
				color: var(--me-blue-hover) !important;
			}

			.me-chip-current {
				background: var(--me-blue);
				box-shadow: none;
				color: var(--me-chip-current-text) !important;
				cursor: default;
			}

			.me-chip-current:hover {
				background: var(--me-blue);
				transform: none;
				color: var(--me-chip-current-text) !important;
			}

			.me-sep {
				font-size: 1.18rem;
				font-weight: 700;
				color: var(--me-crumb-sep);
				user-select: none;
				line-height: 1;
			}

			/* ── Editor card ───────────────────────────── */
			.me-editor-card {
				position: relative;
				display: flex;
				background: var(--me-card-bg);
				overflow: hidden;
				padding: 0;
			}

			/* ── EasyMDE theme overrides ───────────────── */

			/* Container */
			.me-editor-card .EasyMDEContainer {
				margin: 0;
				position: relative;
				flex: 1 1 auto;
				min-width: 0;
			}

			.me-editor-card .editor-toolbar {
				border-top: none;
				border-left: none;
				border-right: none;
				border-bottom: 1px solid var(--me-border-soft);
				background: var(--me-toolbar-bg);
				padding: 6px 10px;
				border-radius: 0;
				opacity: 1;
				display: flex !important;
				align-items: center !important;
				flex-wrap: wrap;
				gap: 1px;
			}

			.me-editor-card .editor-toolbar:not(.fullscreen) {
				position: relative;
				z-index: 3;
			}

			.me-editor-card .editor-toolbar::before,
			.me-editor-card .editor-toolbar::after {
				display: none;
			}

			.me-editor-card .editor-toolbar button {
				-webkit-appearance: none !important;
				-moz-appearance: none !important;
				appearance: none !important;
				display: inline-flex !important;
				align-items: center !important;
				justify-content: center !important;
				width: 30px !important;
				height: 30px !important;
				min-height: 0 !important;
				padding: 0 !important;
				margin: 1px 2px !important;
				border: 1px solid transparent !important;
				border-radius: 4px !important;
				background: transparent !important;
				color: var(--me-cm-toolbar-btn) !important;
				text-align: center !important;
				cursor: pointer !important;
				box-shadow: none !important;
				text-decoration: none !important;
				text-transform: none !important;
				letter-spacing: 0 !important;
				font-weight: normal !important;
				font-size: 1rem !important;
				transition: background 0.15s, border-color 0.15s !important;
			}

			.me-editor-card .editor-toolbar button:hover {
				background: var(--me-blue-bg) !important;
				border-color: var(--me-blue-border) !important;
				color: var(--me-blue) !important;
				transform: none !important;
			}

			.me-editor-card .editor-toolbar button.active,
			.me-editor-card .editor-toolbar button.active:hover {
				background: var(--me-blue-bg-strong) !important;
				border-color: var(--me-blue-border) !important;
				color: var(--me-blue) !important;
			}

			.me-editor-card .editor-toolbar button.me-export-btn {
				background: var(--me-blue-bg) !important;
				border-color: var(--me-blue-border) !important;
				color: var(--me-blue) !important;
				width: auto !important;
				padding: 0 10px !important;
				font-size: 0.78rem !important;
				font-weight: 700 !important;
				font-family: 'Source Sans Pro', -apple-system, sans-serif !important;
			}

			.me-editor-card .editor-toolbar button.me-export-btn:hover {
				background: var(--me-blue) !important;
				color: var(--me-chip-current-text) !important;
			}

			/* Normalize heading button sizes */
			.me-editor-card .editor-toolbar button.heading-1,
			.me-editor-card .editor-toolbar button.heading-2,
			.me-editor-card .editor-toolbar button.heading-3 {
				font-size: 1rem !important;
			}

			.me-editor-card .editor-toolbar i.separator {
				border-left: 1px solid var(--me-border) !important;
				border-right: none !important;
				margin: 0 4px !important;
				align-self: center !important;
				height: 20px !important;
			}

			/* ── CodeMirror — light theme ──────────────── */
			.me-editor-card .CodeMirror {
				border: none;
				border-bottom-left-radius: 0;
				border-bottom-right-radius: 0;
				height: calc(100vh - 20rem) !important;
				min-height: 400px !important;
				font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
				font-size: 0.9rem;
				line-height: 1.65;
				padding: 12px 16px;
				color: var(--me-ink);
				background: var(--me-editor-bg);
			}

			.me-editor-card .CodeMirror-cursor {
				border-left-color: var(--me-ink);
			}

			.me-editor-card .CodeMirror-selected {
				background: var(--me-blue-bg) !important;
			}

			.me-editor-card .CodeMirror-focused .CodeMirror-selected {
				background: var(--me-blue-bg-strong) !important;
			}

			/* Light syntax tokens */
			.me-editor-card .cm-header      { color: var(--me-cm-header); font-weight: 700; }
			.me-editor-card .cm-header-1     { font-size: 1.4em; }
			.me-editor-card .cm-header-2     { font-size: 1.2em; }
			.me-editor-card .cm-header-3     { font-size: 1.08em; }
			.me-editor-card .cm-strong       { color: var(--me-cm-strong); font-weight: 700; }
			.me-editor-card .cm-em           { color: var(--me-cm-em); font-style: italic; }
			.me-editor-card .cm-strikethrough { color: var(--me-cm-strike); text-decoration: line-through; }
			.me-editor-card .cm-link         { color: var(--me-cm-link); text-decoration: none; }
			.me-editor-card .cm-url          { color: var(--me-cm-url); text-decoration: underline; }
			.me-editor-card .cm-comment      { color: var(--me-cm-comment); }
			.me-editor-card .cm-quote        { color: var(--me-cm-quote); font-style: italic; }
			.me-editor-card .cm-tag          { color: var(--me-cm-tag); }
			.me-editor-card .cm-string       { color: var(--me-cm-string); }
			.me-editor-card .cm-keyword      { color: var(--me-cm-keyword); }
			.me-editor-card .cm-variable-2   { color: var(--me-cm-variable); }
			.me-editor-card .cm-hr           { color: var(--me-gutter-text); }
			.me-editor-card .cm-formatting   { color: var(--me-gutter-text); }

			/* Gutters */
			.me-editor-card .CodeMirror-gutters {
				background: var(--me-toolbar-bg);
				border-right: 1px solid var(--me-border-soft);
			}

			.me-editor-card .CodeMirror-linenumber {
				color: var(--me-gutter-text);
			}

			/* ── Find & Replace bar (custom, uses cm.getSearchCursor) ── */
			.me-search-bar {
				position: absolute;
				top: 8px;
				right: 8px;
				z-index: 12;
				background: var(--me-card-bg);
				border: 1px solid var(--me-border);
				border-radius: 0.55rem;
				box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
				padding: 0.4rem 0.5rem;
				display: flex;
				flex-direction: column;
				gap: 0.35rem;
				min-width: 320px;
				font: 500 0.86rem/1.4 "Inter", sans-serif;
				color: var(--me-ink);
			}

			.me-search-bar[hidden] { display: none !important; }

			.me-search-row {
				display: flex;
				align-items: center;
				gap: 0.3rem;
			}

			.me-search-row[hidden] { display: none !important; }

			.me-search-input,
			.me-replace-input {
				flex: 1 1 auto;
				min-width: 0;
				background: var(--me-card-bg-soft);
				border: 1px solid var(--me-border);
				border-radius: 0.35rem;
				color: var(--me-ink);
				padding: 0.32rem 0.5rem;
				font: 500 0.84rem/1 "Menlo", "Consolas", monospace;
				outline: none;
				transition: border-color 0.15s ease;
			}

			.me-search-input:focus,
			.me-replace-input:focus { border-color: var(--me-blue); }

			.me-search-count {
				font-size: 0.76rem;
				color: var(--me-muted);
				min-width: 64px;
				text-align: right;
				white-space: nowrap;
			}

			.me-search-bar button {
				background: transparent;
				border: 1px solid transparent;
				border-radius: 0.3rem;
				color: var(--me-muted);
				width: 26px;
				height: 26px;
				display: inline-flex;
				align-items: center;
				justify-content: center;
				cursor: pointer;
				font: 600 0.76rem/1 inherit;
				flex-shrink: 0;
				transition: background 0.15s ease, color 0.15s ease;
			}

			.me-search-bar button:hover {
				background: var(--me-blue-bg);
				color: var(--me-blue);
			}

			.me-search-bar button.me-search-action {
				width: auto;
				padding: 0 0.55rem;
				color: var(--me-blue);
				background: var(--me-blue-bg);
				border-color: var(--me-blue-border);
			}

			.me-search-bar button.me-search-action:hover {
				background: var(--me-blue-bg-strong);
			}

			.me-search-bar button svg {
				width: 14px;
				height: 14px;
				stroke: currentColor;
				fill: none;
				stroke-width: 2;
				stroke-linecap: round;
				stroke-linejoin: round;
			}

			.me-search-mark {
				background: rgba(245, 200, 60, 0.32);
				border-radius: 2px;
			}

			.me-search-mark-current {
				background: rgba(245, 160, 30, 0.55);
				outline: 1px solid rgba(245, 160, 30, 0.85);
				border-radius: 2px;
			}

			html[data-theme="dark"] .me-search-mark { background: rgba(245, 200, 60, 0.24); }
			html[data-theme="dark"] .me-search-mark-current {
				background: rgba(255, 180, 50, 0.40);
				outline-color: rgba(255, 180, 50, 0.85);
			}

			/* ── Side-by-side / Preview pane ───────────── */
			.me-editor-card .editor-preview-side,
			.me-editor-card .editor-preview {
				background: var(--me-preview-bg);
				border: none;
				border-left: 1px solid var(--me-border-soft);
				/* Top padding matches CodeMirror's 12px so the first heading
				 * lines up with the editor's first source line. */
				padding: 12px 2rem 1.5rem;
				color: var(--me-ink);
				font-family: 'Source Sans Pro', -apple-system, BlinkMacSystemFont, sans-serif;
				font-size: 1rem;
				line-height: 1.7;
			}

			.me-editor-card .editor-preview-active-side {
				display: block;
			}

			/* Constrain preview height to match editor, enable independent scroll */
			.me-editor-card .editor-preview-side {
				/* Anchor preview to EasyMDEContainer (not viewport) so the
				 * outline panel can claim its own column without overlap. */
				position: absolute !important;
				top: var(--me-toolbar-h, 50px) !important;
				right: 0 !important;
				bottom: 0 !important;
				width: 50% !important;
				height: calc(100vh - 20rem) !important;
				min-height: 400px !important;
				overflow-y: auto !important;
			}

			/* When EasyMDE is in fullscreen, restore native viewport positioning
			 * so editor + preview overlay the screen correctly. */
			.me-editor-card .CodeMirror.CodeMirror-fullscreen {
				height: auto !important;
				min-height: 0 !important;
				transition: right 0.22s ease;
			}
			body:has(.CodeMirror-fullscreen) .me-editor-card .editor-preview-side {
				position: fixed !important;
				top: 50px !important;
				right: 0 !important;
				bottom: 0 !important;
				width: 50% !important;
				height: auto !important;
				min-height: 0 !important;
				z-index: 9;
				transition: right 0.22s ease, width 0.22s ease;
			}

			/* ── Preview content (match md-viewer) ─────── */

			.me-editor-card .editor-preview h1,
			.me-editor-card .editor-preview-side h1 {
				font-size: 1.75em;
				padding-bottom: 0.5rem;
				border-bottom: 3px solid var(--me-border);
				font-weight: 700;
				line-height: 1.28;
				margin: 1.4rem 0 0.5rem;
				color: var(--me-ink);
			}

			.me-editor-card .editor-preview h1:first-child,
			.me-editor-card .editor-preview-side h1:first-child { margin-top: 0; }

			.me-editor-card .editor-preview h2,
			.me-editor-card .editor-preview-side h2 {
				font-size: 1.4em;
				padding-left: 0.8rem;
				border-left: 4px solid var(--me-h2-border);
				font-weight: 700;
				line-height: 1.28;
				margin: 1.4rem 0 0.5rem;
				color: var(--me-ink);
			}

			.me-editor-card .editor-preview h3,
			.me-editor-card .editor-preview-side h3 {
				font-size: 1.18em;
				font-weight: 700;
				line-height: 1.28;
				margin: 1.4rem 0 0.5rem;
				color: var(--me-h3);
			}

			.me-editor-card .editor-preview h4,
			.me-editor-card .editor-preview-side h4 {
				font-size: 1.05em;
				font-weight: 700;
				margin: 1.2rem 0 0.4rem;
				color: var(--me-ink);
			}

			.me-editor-card .editor-preview p,
			.me-editor-card .editor-preview-side p { margin: 0 0 0.65rem; }

			.me-editor-card .editor-preview strong,
			.me-editor-card .editor-preview-side strong {
				color: var(--me-ink);
				font-weight: 700;
			}

			.me-editor-card .editor-preview a,
			.me-editor-card .editor-preview-side a {
				color: var(--me-blue);
				text-decoration: underline;
				text-decoration-color: var(--me-a-underline);
				text-decoration-thickness: 0.08em;
				text-underline-offset: 0.16em;
				border-bottom: none;
			}

			.me-editor-card .editor-preview a:hover,
			.me-editor-card .editor-preview-side a:hover {
				color: var(--me-blue-hover);
				text-decoration-color: var(--me-a-underline-hover);
			}

			var katexReady = null;

			var KATEX_CSS = "https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css";
			var KATEX_JS  = "https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js";
			var KATEX_AR  = "https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js";

			function loadKatex() {
				if (!katexReady) {
					katexReady = new Promise(function(resolve) {
						var link = document.createElement('link');
						link.rel = 'stylesheet';
						link.href = KATEX_CSS;
						document.head.appendChild(link);

						var s1 = document.createElement('script');
						s1.src = KATEX_JS;
						s1.crossOrigin = 'anonymous';
						s1.onload = function() {
							var s2 = document.createElement('script');
							s2.src = KATEX_AR;
							s2.crossOrigin = 'anonymous';
							s2.onload = resolve;
							document.head.appendChild(s2);
						};
						document.head.appendChild(s1);
					});
				}
				return katexReady;
			}

			function applyMathRendering(container) {
				if (!/\$/.test(container.textContent) && !container.querySelector('.math-block')) return;
				loadKatex().then(function() {
					if (window.renderMathInElement) {
						renderMathInElement(container, {
							delimiters: [
								{ left: "$$", right: "$$", display: true },
								{ left: "$",  right: "$",  display: false }
							],
							throwOnError: false
						});
					}
				});
			}

			/* ── Preview render pipeline ───────────────── */

			function addHeadingIds(container) {
				container.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach(function(el) {
					var text = el.textContent.trim();
					el.id = text.toLowerCase().replace(/[^\w\u4e00-\u9fff]+/g, '-').replace(/^-|-$/g, '');
				});
			}

			function renderPreview(plainText, preview) {
				// Pre-process: wrap block math $$...$$ in div to survive marked parsing
				var src = plainText.replace(/\$\$([\s\S]+?)\$\$/g, function(match) {
					return '\n<div class="math-block">\n\n' + match + '\n\n</div>\n';
				});

				var html = marked.parse(src, { breaks: false, gfm: true });
				preview.innerHTML = html;
				addHeadingIds(preview);

				// Handle anchor clicks within preview pane
				preview.querySelectorAll('a[href^="#"]').forEach(function(a) {
					a.addEventListener('click', function(e) {
						var id = decodeURIComponent(a.getAttribute('href').slice(1));
						var target = preview.querySelector('#' + CSS.escape(id));
						if (target) {
							e.preventDefault();
							var containerRect = preview.getBoundingClientRect();
							var targetRect = target.getBoundingClientRect();
							preview.scrollTo({
								top: preview.scrollTop + targetRect.top - containerRect.top,
								behavior: 'smooth'
							});
						}
					});
				});

				// KaTeX auto-render (handles both $...$ and $$...$$)
				applyMathRendering(preview);

	return null; // we set innerHTML ourselves
			}

			/* ── Custom toolbar actions ────────────────── */

			function actionInlineCode(editor) {
				var cm = editor.codemirror;
				var sel = cm.getSelection();
				cm.replaceSelection('`' + (sel || 'code') + '`');
				if (!sel) { var cur = cm.getCursor(); cm.setSelection({ line: cur.line, ch: cur.ch - 5 }, { line: cur.line, ch: cur.ch - 1 }); }
				cm.focus();
			}

			function actionMath(editor) {
				var cm = editor.codemirror;
				var sel = cm.getSelection();
				cm.replaceSelection('$' + (sel || 'formula') + '$');
				if (!sel) { var cur = cm.getCursor(); cm.setSelection({ line: cur.line, ch: cur.ch - 8 }, { line: cur.line, ch: cur.ch - 1 }); }
				cm.focus();
			}

			function actionToc(editor) {
				var cm = editor.codemirror;
				var lines = cm.getValue().split('\n');
				var toc = [];
				var inCode = false;
				for (var i = 0; i < lines.length; i++) {
					var line = lines[i];
					if (/^```/.test(line)) { inCode = !inCode; continue; }
					if (inCode) continue;
					var m = line.match(/^(#{1,6})\s+(.+)/);
					if (!m) continue;
					var level = m[1].length;
					var text = m[2].replace(/[*_`\[\]]/g, '').trim();
					var anchor = text.toLowerCase().replace(/[^\w\u4e00-\u9fff]+/g, '-').replace(/^-|-$/g, '');
					var indent = '  '.repeat(level - 1);
					toc.push(indent + '1. [' + text + '](#' + anchor + ')');
				}
				if (!toc.length) return;
				var result = '## Table of Contents\n\n' + toc.join('\n') + '\n\n';
				cm.replaceSelection(result);
				cm.focus();
			}

			function actionUpload(editor) {

				input.value = '';

					var file = input.files[0];
					if (!file) return;
					if (file.size > 5 * 1024 * 1024) {
						alert('File too large (max 5 MB)');
						return;

					var reader = new FileReader();
					reader.onload = function() {
						editor.value(reader.result);
						editor.codemirror.focus();
					};
					reader.readAsText(file);
				};
				input.click();
			}

			function actionDownload(editor) {
				var src = editor.value();
				var blob = new Blob([src], { type: 'text/markdown;charset=utf-8' });
				var a = document.createElement('a');
				a.href = URL.createObjectURL(blob);
				a.download = 'document.md';
				a.click();
				URL.revokeObjectURL(a.href);
			}

			function wrapLucide(paths) {
				return '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + paths + '</svg>';

			document.querySelectorAll('.editor-toolbar button').forEach(function(btn) {
				var icon = btn.querySelector('i');
				if (!icon) return;
				var classes = icon.className.split(/\s+/);
				var key = null;
				// Heading variants carry `header-1` / `header-2` / `header-3` alongside `fa-header`
				for (var i = 0; i < classes.length; i++) {
					if (/^header-[1-3]$/.test(classes[i])) { key = classes[i]; break; }
				}
				// Otherwise pick the first fa-* class we have in our map
				if (!key) {
					for (var j = 0; j < classes.length; j++) {
						if (classes[j].indexOf('fa-') === 0 && lucideIcons[classes[j]]) { key = classes[j]; break; }
					}
				}
				if (!key) return;
				var span = document.createElement('span');
				span.innerHTML = wrapLucide(lucideIcons[key]);
				span.style.cssText = 'display:inline-flex;align-items:center;';
				icon.replaceWith(span);
			});

			(function syncToolbarHeight() {

				function update() {

				var mod = isMac ? '⌘' : 'Ctrl';

				function k(s) { return '<kbd class="me-kbd">' + s + '</kbd>'; }

				overlay.className = 'me-help-overlay';

				overlay.innerHTML = '<div class="me-help-card" role="dialog" aria-label="Help">'
					+ '<div class="me-help-header">'
						+ '<h3>Keyboard Shortcuts &amp; Tips</h3>'
						+ '<button class="me-help-close" aria-label="Close">'

						+ '</button>'
					+ '</div>'
					+ '<div class="me-help-body">'
						+ '<div class="me-help-section"><h4>Navigation</h4><table class="me-help-table">'
							+ row(k(mod) + '+' + k(shift) + '+' + k('O'), 'Open <em>Go to heading</em> command palette')
							+ row('Toolbar <svg style="vertical-align:-3px;display:inline-block" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="15" y1="3" x2="15" y2="21"/></svg>', 'Toggle Outline panel (right side)')
							+ row(k('Esc'), 'Close any open dialog')
						+ '</table></div>'
						+ '<div class="me-help-section"><h4>Find &amp; Replace</h4><table class="me-help-table">'
							+ row(k(mod) + '+' + k('F'), 'Find')
							+ row(isMac ? k(mod) + '+' + k(alt) + '+' + k('F') : k(mod) + '+' + k('H'), 'Replace')
							+ row(isMac ? k(mod) + '+' + k('G') : k('F3'), 'Find next')
							+ row(isMac ? k(mod) + '+' + k(shift) + '+' + k('G') : k(shift) + '+' + k('F3'), 'Find previous')
							+ row(k(mod) + '+' + k(alt) + '+' + k('Enter'), 'Replace all (when in Replace box)')
							+ row(k('Enter') + ' / ' + k(shift) + '+' + k('Enter'), 'Next / Prev (when in Find box)')
						+ '</table></div>'
						+ '<div class="me-help-section"><h4>Formatting</h4><table class="me-help-table">'
							+ row(k(mod) + '+' + k('B'), 'Bold')
							+ row(k(mod) + '+' + k('I'), 'Italic')
							+ row(k(mod) + '+' + k(alt) + '+' + k('1'), 'Heading 1')
							+ row(k(mod) + '+' + k(alt) + '+' + k('2'), 'Heading 2')
							+ row(k(mod) + '+' + k(alt) + '+' + k('3'), 'Heading 3')
							+ row(k(mod) + '+' + k('K'), 'Insert link')
							+ row(k(mod) + '+' + k('\''), 'Blockquote')
							+ row(k(mod) + '+' + k(alt) + '+' + k('C'), 'Code block')
							+ row(k(mod) + '+' + k('L'), 'Unordered list')
							+ row(k(mod) + '+' + k(alt) + '+' + k('L'), 'Ordered list')
						+ '</table></div>'
						+ '<div class="me-help-section"><h4>View</h4><table class="me-help-table">'
							+ row('Toolbar buttons', 'Side-by-side preview, Fullscreen, Outline')
							+ row(k('F11') + ' or ⛶ button', 'Toggle fullscreen mode')
						+ '</table></div>'
						+ '<div class="me-help-section"><h4>Tips</h4>'
							+ '<p class="me-help-tip">Drafts auto-save to browser localStorage every second. Refreshing won\'t lose work.</p>'
							+ '<p class="me-help-tip">Math: <code>$...$</code> for inline, <code>$$...$$</code> for block (KaTeX).</p>'
							+ '<p class="me-help-tip">Code blocks: <code>```language</code> enables Shiki syntax highlighting (Dark+ theme).</p>'
							+ '<p class="me-help-tip">Click <strong>Open in Viewer</strong> to render the current draft as a polished note in a new tab.</p>'
							+ '<p class="me-help-tip">The Outline panel parses headings live — start typing <code>#</code> headings and they\'ll appear instantly.</p>'
						+ '</div>'
					+ '</div>'
					+ '</div>';
				document.body.appendChild(overlay);

				function close() { overlay.hidden = true; }
				overlay.querySelector('.me-help-close').addEventListener('click', close);
				overlay.addEventListener('click', function(e) {
					if (e.target === overlay) close();
				});
				document.addEventListener('keydown', function escHandler(e) {
					if (e.key === 'Escape' && !overlay.hidden) {
						close();
						document.removeEventListener('keydown', escHandler);
					}
				});
			}

			// Custom Find & Replace bar (uses cm.getSearchCursor — already
			// bundled inside EasyMDE's CodeMirror; no external addons needed)
			(function setupSearch() {
				var cm = easyMDE.codemirror;
				if (typeof cm.getSearchCursor !== 'function') {
					console.warn('cm.getSearchCursor missing; search disabled');
					return;
				}
				var card = document.querySelector('.me-editor-card .EasyMDEContainer') || document.querySelector('.me-editor-card');
				var bar = document.createElement('div');
				bar.className = 'me-search-bar';
				bar.hidden = true;
				bar.innerHTML =
					'<div class="me-search-row">'
					+ '<input type="text" class="me-search-input" placeholder="Find" autocomplete="off" spellcheck="false" />'
					+ '<span class="me-search-count">0 / 0</span>'
					+ '<button type="button" class="me-search-prev" title="Previous (Shift+Enter)"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>'
					+ '<button type="button" class="me-search-next" title="Next (Enter)"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>'
					+ '<button type="button" class="me-search-toggle-replace" title="Toggle replace (Ctrl/Cmd+H)"><svg viewBox="0 0 24 24"><path d="M3 7h13"/><polyline points="13 3 17 7 13 11"/><path d="M21 17H8"/><polyline points="11 21 7 17 11 13"/></svg></button>'
					+ '<button type="button" class="me-search-close" title="Close (Esc)"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>'
					+ '</div>'
					+ '<div class="me-search-row me-replace-row" hidden>'
					+ '<input type="text" class="me-replace-input" placeholder="Replace with" autocomplete="off" spellcheck="false" />'
					+ '<button type="button" class="me-search-action me-replace-one">Replace</button>'
					+ '<button type="button" class="me-search-action me-replace-all">All</button>'
					+ '</div>';
				card.appendChild(bar);

				var input = bar.querySelector('.me-search-input');
				var replaceInput = bar.querySelector('.me-replace-input');
				var replaceRow = bar.querySelector('.me-replace-row');
				var counterEl = bar.querySelector('.me-search-count');
				var matches = []; // [{from, to}]
				var marks = [];   // CodeMirror text marks
				var current = -1;

				function clearMarks() {
					marks.forEach(function(m) { m.clear(); });
					marks = [];
				}

				function highlight() {
					clearMarks();
					matches.forEach(function(m, i) {
						marks.push(cm.markText(m.from, m.to, {
							className: i === current ? 'me-search-mark-current' : 'me-search-mark'
						}));
					});
				}

				function updateCounter() {
					counterEl.textContent = matches.length === 0
						? (input.value ? 'No results' : '0 / 0')
						: (current + 1) + ' / ' + matches.length;
				}

				function findAll() {
					matches = [];
					var q = input.value;
					if (!q) { current = -1; clearMarks(); updateCounter(); return; }
					try {
						var cursor = cm.getSearchCursor(q, { line: 0, ch: 0 }, { caseFold: true });
						while (cursor.findNext()) {
							matches.push({ from: cursor.from(), to: cursor.to() });
						}
					} catch (err) { matches = []; }
					if (matches.length === 0) {
						current = -1;
					} else {
						// Pick first match at or after current cursor
						var cursorPos = cm.getCursor();
						current = 0;
						for (var i = 0; i < matches.length; i++) {
							var m = matches[i];
							if (m.from.line > cursorPos.line ||
								(m.from.line === cursorPos.line && m.from.ch >= cursorPos.ch)) {
								current = i; break;
							}
						}
					}
					highlight();
					if (current >= 0) cm.scrollIntoView({ from: matches[current].from, to: matches[current].to }, 60);
					updateCounter();
				}

				function jumpTo(idx) {
					if (matches.length === 0) return;
					current = ((idx % matches.length) + matches.length) % matches.length;
					highlight();
					cm.scrollIntoView({ from: matches[current].from, to: matches[current].to }, 60);
					updateCounter();
				}

				function next() { jumpTo(current + 1); }
				function prev() { jumpTo(current - 1); }

				function open(replaceMode) {
					replaceRow.hidden = !replaceMode;
					bar.hidden = false;
					var sel = cm.getSelection();
					if (sel) input.value = sel;
					findAll();
					setTimeout(function() { input.focus(); input.select(); }, 0);
				}

				function close() {
					bar.hidden = true;
					replaceRow.hidden = true;
					clearMarks();
					matches = []; current = -1;
					cm.focus();
				}

				function replaceOne() {
					if (current < 0 || !matches[current]) return;
					var m = matches[current];
					cm.replaceRange(replaceInput.value, m.from, m.to);
					setTimeout(findAll, 0);
				}

				function replaceAll() {
					if (matches.length === 0) return;
					cm.operation(function() {
						// Replace from end backwards so ranges remain valid
						for (var i = matches.length - 1; i >= 0; i--) {
							var m = matches[i];
							cm.replaceRange(replaceInput.value, m.from, m.to);
						}
					});
					setTimeout(findAll, 0);
				}

				function showReplaceRow() {
					replaceRow.hidden = false;
					setTimeout(function() { replaceInput.focus(); }, 0);
				}

				// VS Code-style shortcuts shared across all listeners.
				// Returns true if handled.
				function handleVSCodeShortcuts(e) {
					var lkey = (e.key || '').toLowerCase();
					// F3 / Shift+F3 — Find Next / Prev (Win/Linux)
					if (e.key === 'F3') {
						e.preventDefault(); e.stopImmediatePropagation();
						if (matches.length === 0) open(false);
						else if (e.shiftKey) prev(); else next();
						return true;
					}
					// Cmd+G / Cmd+Shift+G — Find Next / Prev (Mac)
					if (e.metaKey && !e.ctrlKey && !e.altKey && lkey === 'g') {
						e.preventDefault(); e.stopImmediatePropagation();
						if (matches.length === 0) open(false);
						else if (e.shiftKey) prev(); else next();
						return true;
					}
					// Ctrl+H — Replace (Win/Linux)
					if (e.ctrlKey && !e.metaKey && !e.altKey && !e.shiftKey && lkey === 'h') {
						e.preventDefault(); e.stopImmediatePropagation();
						if (bar.hidden) open(true);
						else showReplaceRow();
						return true;
					}
					// Cmd+Alt+F — Replace (Mac)
					if (e.metaKey && e.altKey && !e.shiftKey && !e.ctrlKey && lkey === 'f') {
						e.preventDefault(); e.stopImmediatePropagation();
						if (bar.hidden) open(true);
						else showReplaceRow();
						return true;
					}
					return false;
				}

				input.addEventListener('input', findAll);
				input.addEventListener('keydown', function(e) {
					if (handleVSCodeShortcuts(e)) return;
					if (e.key === 'Enter') {
						e.preventDefault();
						if (e.shiftKey) prev(); else next();
					} else if (e.key === 'Escape') {
						e.preventDefault(); close();
					}
				});
				replaceInput.addEventListener('keydown', function(e) {
					if (handleVSCodeShortcuts(e)) return;
					// Ctrl+Alt+Enter / Cmd+Alt+Enter — Replace All
					if ((e.ctrlKey || e.metaKey) && e.altKey && e.key === 'Enter') {
						e.preventDefault(); replaceAll(); return;
					}
					if (e.key === 'Enter') { e.preventDefault(); replaceOne(); }
					else if (e.key === 'Escape') { e.preventDefault(); close(); }
				});
				bar.querySelector('.me-search-next').addEventListener('click', next);
				bar.querySelector('.me-search-prev').addEventListener('click', prev);
				bar.querySelector('.me-search-close').addEventListener('click', close);
				bar.querySelector('.me-search-toggle-replace').addEventListener('click', function() {
					replaceRow.hidden = !replaceRow.hidden;
					if (!replaceRow.hidden) replaceInput.focus();
				});
				bar.querySelector('.me-replace-one').addEventListener('click', replaceOne);
				bar.querySelector('.me-replace-all').addEventListener('click', replaceAll);

				var wrapper = cm.getWrapperElement();
				wrapper.addEventListener('keydown', function(e) {
					// Ctrl+F / Cmd+F — open Find (handled here, not in helper, since
					// it should only intercept when the editor has focus)
					if ((e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey) {
						var lkey = (e.key || '').toLowerCase();
						if (lkey === 'f' && !(e.metaKey && e.altKey)) {
							e.preventDefault(); e.stopImmediatePropagation(); open(false); return;
						}
					}
					if (handleVSCodeShortcuts(e)) return;
				}, true);
				// Also catch Esc when bar is focused (doesn't fire on wrapper)
				bar.addEventListener('keydown', function(e) {
					if (e.key === 'Escape') { e.preventDefault(); close(); }
				});
			})();

			// Scroll sync: editor → preview (proportional)
			easyMDE.codemirror.on('scroll', function() {
				var preview = document.querySelector('.editor-preview-active-side');
				if (!preview) return;
				var info = easyMDE.codemirror.getScrollInfo();
				var maxEditor = info.height - info.clientHeight;
				if (maxEditor <= 0) return;
				var ratio = info.top / maxEditor;
				var maxPreview = preview.scrollHeight - preview.clientHeight;
				preview.scrollTop = ratio * maxPreview;
			});

			// Load transferred content from md-viewer
			var transferred = localStorage.getItem('me-transfer');
			if (transferred) {
				localStorage.removeItem('me-transfer');
				easyMDE.value(transferred);
			}

			// Enable side-by-side by default on desktop
			if (window.innerWidth > 736) {
				easyMDE.toggleSideBySide();
			}

			// Pre-load KaTeX if initial content has $
			if (/\$/.test(easyMDE.value())) loadKatex();

			// ── Outline panel + Goto-symbol palette ─────
			(function setupOutline() {
				var cm = easyMDE.codemirror;
				var card = document.querySelector('.me-editor-card');
				var headings = [];
				var rebuildTimer = null;
				var clickJumping = false;
				var clickJumpTimer = null;

				// Build DOM: outline panel (right column) + palette overlay (body level)
				var panel = document.createElement('aside');
				panel.className = 'me-outline-panel';
				panel.id = 'me-outline-panel';
				panel.innerHTML = '<div class="me-outline-header">'
					+ '<span class="me-outline-title">Outline</span>'
					+ '<button type="button" class="me-outline-goto" title="Go to heading… (Ctrl/Cmd+Shift+O)" aria-label="Go to heading">'
					+ '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
					+ '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>'
					+ '</svg>'
					+ '<span>Find</span>'
					+ '</button>'
					+ '</div>'
					+ '<div class="me-outline-list" id="me-outline-list"></div>';
				card.appendChild(panel);
				var listEl = panel.querySelector('.me-outline-list');

				var overlay = document.createElement('div');
				overlay.className = 'me-palette-overlay';
				overlay.hidden = true;
				overlay.innerHTML = '<div class="me-palette" role="dialog" aria-label="Goto symbol">'
					+ '<input type="text" class="me-palette-input" placeholder="@ Type to filter headings…" autocomplete="off" />'
					+ '<div class="me-palette-list"></div>'
					+ '</div>';
				document.body.appendChild(overlay);
				var paletteInput = overlay.querySelector('.me-palette-input');
				var paletteList = overlay.querySelector('.me-palette-list');

				// Restore collapse state from localStorage (default: open)
				var STORAGE_KEY = 'me-outline-collapsed';
				var collapsed = false;
				try { collapsed = localStorage.getItem(STORAGE_KEY) === '1'; } catch (e) {}
				if (collapsed) panel.classList.add('collapsed');

				function escHtml(s) {
					return s.replace(/[&<>"']/g, function(c) {
						return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
					});
				}

				function parseHeadings(text) {
					var lines = text.split('\n');
					var heads = [];
					var inFence = false;
					for (var i = 0; i < lines.length; i++) {
						var line = lines[i];
						if (/^\s{0,3}(```|~~~)/.test(line)) { inFence = !inFence; continue; }
						if (inFence) continue;
						var m = /^(#{1,4})\s+(.+?)\s*#*\s*$/.exec(line);
						if (!m) continue;
						heads.push({
							level: m[1].length,
							text: m[2].replace(/[*_`]/g, '').trim(),
							line: i
						});
					}
					return heads;
				}

				function buildOutline() {
					headings = parseHeadings(cm.getValue());
					if (headings.length === 0) {
						listEl.innerHTML = '<div class="me-outline-empty">No headings yet</div>';
						return;
					}
					listEl.innerHTML = headings.map(function(h, i) {
						return '<div class="me-outline-item h' + h.level + '" data-idx="' + i + '">'
							+ escHtml(h.text) + '</div>';
					}).join('');
				}

				function activeIdx() {
					var info = cm.getScrollInfo();
					var topLine = cm.lineAtHeight(info.top + 30, 'local');
					var idx = 0;
					for (var i = 0; i < headings.length; i++) {
						if (headings[i].line <= topLine) idx = i;
						else break;
					}
					return idx;
				}

				function updateActive() {
					if (!headings.length) return;
					var idx = activeIdx();
					var items = listEl.querySelectorAll('.me-outline-item');
					items.forEach(function(el, i) { el.classList.toggle('active', i === idx); });
					if (clickJumping) return;
					var activeItem = items[idx];
					if (activeItem) {
						var elTop = activeItem.offsetTop;
						var elH = activeItem.offsetHeight;
						var pH = panel.clientHeight;
						var pScroll = panel.scrollTop;
						if (elTop < pScroll || elTop + elH > pScroll + pH) {
							panel.scrollTop = elTop - pH / 2 + elH / 2;
						}
					}
				}

				function jumpToLine(line) {
					clickJumping = true;
					if (clickJumpTimer) clearTimeout(clickJumpTimer);
					clickJumpTimer = setTimeout(function() { clickJumping = false; }, 800);
					cm.setCursor({ line: line, ch: 0 });
					var coords = cm.charCoords({ line: line, ch: 0 }, 'local');
					cm.scrollTo(null, coords.top - 30);
					cm.focus();
				}

				listEl.addEventListener('click', function(e) {
					var item = e.target.closest('.me-outline-item');
					if (!item) return;
					var idx = parseInt(item.dataset.idx, 10);
					if (headings[idx]) jumpToLine(headings[idx].line);
				});

				panel.querySelector('.me-outline-goto').addEventListener('click', function() {
					openPalette();
				});

				cm.on('scroll', updateActive);
				cm.on('change', function() {
					if (rebuildTimer) clearTimeout(rebuildTimer);
					rebuildTimer = setTimeout(function() {
						buildOutline();
						updateActive();
					}, 300);
				});

				// Toggle from toolbar button (exposed via window._meToggleOutline)
				window._meToggleOutline = function() {
					panel.classList.toggle('collapsed');
					var nowCollapsed = panel.classList.contains('collapsed');
					try { localStorage.setItem(STORAGE_KEY, nowCollapsed ? '1' : '0'); } catch (e) {}
					var btn = document.querySelector('.editor-toolbar .me-outline-btn');
					if (btn) btn.classList.toggle('active', !nowCollapsed);
				};

				// Mark the toolbar button as active reflecting initial state
				setTimeout(function() {
					var btn = document.querySelector('.editor-toolbar .me-outline-btn');
					if (btn) btn.classList.toggle('active', !panel.classList.contains('collapsed'));
				}, 0);

				// ── Command palette ──
				var paletteIdx = 0;
				var filtered = [];

				function renderPalette() {
					var q = paletteInput.value.toLowerCase().trim();
					filtered = headings.map(function(h, i) { return { h: h, i: i }; }).filter(function(item) {
						if (!q) return true;
						return item.h.text.toLowerCase().indexOf(q) >= 0;
					});
					if (filtered.length === 0) {
						paletteList.innerHTML = '<div class="me-palette-empty">No matching headings</div>';
						return;
					}
					paletteIdx = 0;
					paletteList.innerHTML = filtered.map(function(item, i) {
						return '<div class="me-palette-item h' + item.h.level + (i === 0 ? ' active' : '') + '" data-idx="' + item.i + '">'
							+ '<span class="me-palette-badge">H' + item.h.level + '</span>'
							+ '<span class="me-palette-text">' + escHtml(item.h.text) + '</span>'
							+ '</div>';
					}).join('');
				}

				function openPalette() {
					// Always rebuild before opening so list reflects latest content
					buildOutline();
					paletteInput.value = '';
					renderPalette();
					overlay.hidden = false;
					setTimeout(function() { paletteInput.focus(); }, 0);
				}
				window._meOpenPalette = openPalette;

				function closePalette() { overlay.hidden = true; }

				function jumpFromPalette(idx) {
					if (headings[idx]) jumpToLine(headings[idx].line);
					closePalette();
				}

				paletteInput.addEventListener('input', renderPalette);
				paletteInput.addEventListener('keydown', function(e) {
					if (e.key === 'Escape') { e.preventDefault(); closePalette(); return; }
					if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
						e.preventDefault();
						var items = paletteList.querySelectorAll('.me-palette-item');
						if (items.length === 0) return;
						items[paletteIdx] && items[paletteIdx].classList.remove('active');
						paletteIdx = (paletteIdx + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
						items[paletteIdx].classList.add('active');
						items[paletteIdx].scrollIntoView({ block: 'nearest' });
						return;
					}
					if (e.key === 'Enter') {
						e.preventDefault();
						if (filtered[paletteIdx]) jumpFromPalette(filtered[paletteIdx].i);
					}
				});
				paletteList.addEventListener('click', function(e) {
					var item = e.target.closest('.me-palette-item');
					if (item) jumpFromPalette(parseInt(item.dataset.idx, 10));
				});
				overlay.addEventListener('click', function(e) {
					if (e.target === overlay) closePalette();
				});

				// Global Ctrl/Cmd+Shift+O — open palette
				document.addEventListener('keydown', function(e) {
					if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'o' || e.key === 'O')) {
						e.preventDefault();
						e.stopPropagation();
						openPalette();
					}
				}, true);

				buildOutline();
				updateActive();
			})();

		})();
		</script>
