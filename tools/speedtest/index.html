<!DOCTYPE HTML>
<html>
	<head>
		<title>Speed Test | Kazuha Mo - UC Irvine</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="icon" href="../../favicon.ico" type="image/x-icon" />
		<link rel="stylesheet" href="../../assets/css/main.css" />
		<noscript><link rel="stylesheet" href="../../assets/css/noscript.css" /></noscript>
		<style>
			:root {
				--st-blue: #244f8f;
				--st-blue-bg: rgba(36, 79, 143, 0.10);
				--st-blue-border: rgba(36, 79, 143, 0.22);
				--st-border: rgba(42, 79, 133, 0.16);
			}

			.st-shell {
				display: grid;
				gap: 1.5rem;
			}

			.st-shell > header.major > h1 {
				margin-bottom: 0;
				width: calc(100% + 0.5em);
			}

			.st-shell > header.major > h1:after {
				content: "";
				background-color: #ffffff;
				display: block;
				height: 2px;
				margin: 0.325em 0 0.5em 0;
				width: 100%;
			}

			.st-intro {
				padding: 1.1rem 1.75rem;
				border: 1px solid var(--st-border);
				border-radius: 1.2rem;
				background:
					radial-gradient(circle at top right, rgba(36, 79, 143, 0.08), transparent 18rem),
					linear-gradient(135deg, rgba(255,255,255,0.98) 0%, rgba(246,249,255,0.99) 58%, rgba(250,252,255,0.98) 100%);
				box-shadow: 0 1.25rem 3rem rgba(23, 43, 77, 0.08);
			}

			.st-breadcrumb {
				display: flex;
				flex-wrap: wrap;
				gap: 0.45rem;
				align-items: center;
			}

			.st-chip {
				display: inline-flex;
				align-items: center;
				padding: 0.38rem 0.8rem;
				border-radius: 999px;
				font-size: 0.86rem;
				font-weight: 700;
				text-decoration: none;
				border-bottom: 0 !important;
				background: var(--st-blue-bg);
				box-shadow: inset 0 0 0 1.5px var(--st-blue-border);
				color: var(--st-blue) !important;
				transition: background 0.2s ease, transform 0.2s ease;
			}

			.st-chip:hover {
				background: rgba(36, 79, 143, 0.17);
				transform: translateY(-1px);
				color: #183b73 !important;
			}

			.st-chip-current {
				background: var(--st-blue);
				box-shadow: none;
				color: #ffffff !important;
				cursor: default;
			}

			.st-chip-current:hover {
				background: var(--st-blue);
				transform: none;
				color: #ffffff !important;
			}

			.st-sep {
				font-size: 1.18rem;
				font-weight: 700;
				color: #97a7bb;
				user-select: none;
				line-height: 1;
			}

			.st-frame-card {
				border: 1px solid rgba(42, 79, 133, 0.14);
				border-radius: 1.4rem;
				background: rgba(255, 255, 255, 0.98);
				box-shadow: 0 1.5rem 3.5rem rgba(23, 43, 77, 0.08);
				overflow: hidden;
			}

			.st-frame-card iframe {
				display: block;
				width: 100%;
				height: 600px;
				border: none;
			}

			@media screen and (max-width: 736px) {
				#main > * > .inner {
					width: 100% !important;
					max-width: 100vw !important;
					box-sizing: border-box !important;
					padding: 0.75rem 0 1rem 0 !important;
				}

				.st-shell {
					gap: 0.6rem;
				}

				.st-shell > header.major {
					padding: 0 1rem;
					margin-bottom: 0;
				}

				.st-intro {
					border-radius: 0;
					border-left: none;
					border-right: none;
					padding: 0.8rem 1rem;
					box-shadow: none;
				}

				.st-frame-card {
					border-radius: 0;
					border-left: none;
					border-right: none;
					box-shadow: none;
				}

				.st-frame-card iframe {
					height: 520px;
				}
			}
		</style>
	</head>

				</ul>
			</nav>

			<div id="main" class="alt">
				<section id="one">
					<div class="inner st-shell">
						<header class="major">

						</header>

						<div class="st-intro">
							<div class="st-breadcrumb">
								<a href="../../tools/" class="st-chip">Tools</a>

								<span class="st-chip st-chip-current">Speed Test</span>
							</div>
						</div>

						</div>
					</div>
				</section>
