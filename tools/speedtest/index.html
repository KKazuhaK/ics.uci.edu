		<script>
			(function () {
				try {
					var saved = localStorage.getItem("kzh-theme");
					var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
					var theme = saved || (prefersDark ? "dark" : "light");
					document.documentElement.setAttribute("data-theme", theme);
					// Preset OpenSpeedTest's cookie so its darkmode.js applies the right skin on iframe load
					document.cookie = "mode=" + theme + "; path=/; SameSite=Lax";
				} catch (e) {}
			})();
		</script>

				--st-blue-border: rgba(36, 79, 143, 0.22);
				--st-border: rgba(42, 79, 133, 0.16);

			.st-shell {
				display: grid;

			}

			.st-shell > header.major > h1 {

			.st-shell > header.major > h1:after {

				height: 2px;

				width: 100%;

				padding: 1.1rem 1.75rem;

			}

			.st-breadcrumb {
				display: flex;
				flex-wrap: wrap;
				gap: 0.45rem;
				align-items: center;
			}

			.st-chip {
				display: inline-flex;
				align-items: center;
				padding: 0.38rem 0.8rem;
				border-radius: 999px;
				font-size: 0.86rem;
				font-weight: 700;
				text-decoration: none;
				border-bottom: 0 !important;
				background: var(--st-blue-bg);
				box-shadow: inset 0 0 0 1.5px var(--st-blue-border);
				color: var(--st-blue) !important;
				transition: background 0.2s ease, transform 0.2s ease;
			}

			.st-chip:hover {
				background: rgba(36, 79, 143, 0.17);
				transform: translateY(-1px);
				color: #183b73 !important;
			}

			.st-chip-current {
				background: var(--st-blue);
				box-shadow: none;
				color: #ffffff !important;
				cursor: default;
			}

			.st-chip-current:hover {
				background: var(--st-blue);
				transform: none;
				color: #ffffff !important;
			}

			.st-sep {
				font-size: 1.18rem;
				font-weight: 700;
				color: #97a7bb;
				user-select: none;
				line-height: 1;
			}

			.st-frame-card {
				border: 1px solid rgba(42, 79, 133, 0.14);
				border-radius: 1.4rem;
				background: rgba(255, 255, 255, 0.98);
				box-shadow: 0 1.5rem 3.5rem rgba(23, 43, 77, 0.08);
				overflow: hidden;
			}

			.st-frame-card iframe {
				display: block;
				width: 100%;
				height: 600px;
				border: none;
			}

			@media screen and (max-width: 736px) {
				#main > * > .inner {
					width: 100% !important;
					max-width: 100vw !important;
					box-sizing: border-box !important;
					padding: 0.75rem 0 1rem 0 !important;
				}

				.st-shell {
					gap: 0.6rem;
				}

				.st-shell > header.major {
					padding: 0 1rem;
					margin-bottom: 0;
				}

				.st-intro {
					border-radius: 0;
					border-left: none;
					border-right: none;
					padding: 0.8rem 1rem;
					box-shadow: none;
				}

				.st-frame-card {
					border-radius: 0;
					border-left: none;
					border-right: none;
					box-shadow: none;
				}

				.st-frame-card iframe {
					height: 520px;
				}
			}

		<script>
			(function () {
				var iframe = document.querySelector('main.page iframe');
				if (!iframe) return;
				var root = document.documentElement;

				function currentTheme() {
					return root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
				}

				function syncFrame(theme) {
					document.cookie = "mode=" + theme + "; path=/; SameSite=Lax";
					try {
						var w = iframe.contentWindow;
						if (w && typeof w.setSkin === 'function') w.setSkin(theme);
					} catch (e) {}
				}

				function hideBuiltInSkinToggle() {
					try {
						var fd = iframe.contentDocument;
						if (!fd) return;
						// app.js swaps the <object> for inlined SVG on window.onload, so target
						// the iframe document itself (same-origin) rather than an <object>.
						if (!fd.getElementById('kzh-hide-skin-toggle')) {
							var style = fd.createElement('style');
							style.id = 'kzh-hide-skin-toggle';
							style.textContent = '.darkmode, #daymode, #nightmode, #daymode-Mob, #nightmode-Mob { display: none !important; visibility: hidden !important; }';
							(fd.head || fd.documentElement).appendChild(style);
						}
					} catch (e) {}
				}

				iframe.addEventListener('load', function () {
					syncFrame(currentTheme());
					hideBuiltInSkinToggle();
				});

				new MutationObserver(function () { syncFrame(currentTheme()); })
					.observe(root, { attributes: true, attributeFilter: ['data-theme'] });
			})();
		</script>
