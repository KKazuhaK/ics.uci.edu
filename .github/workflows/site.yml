# Check and build every push. Targets live in deploy/targets.json:
#   kind "branch" -> on main, each build is force-pushed to its branch; a server
#                    pulls it with ./update_site.sh (ICS: `deploy`, run by hand)
#   kind "pages"  -> on main, the `pages` job deploys it to GitHub Pages
name: site

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: note "last edited" dates come from git log.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22.22"
          cache: npm

      - run: npm ci
      - name: Type and content check
        run: npx astro check
      - name: Renderer matches the legacy md-viewer on every note
        run: npx tsx scripts/migrate/parity.ts
      # Every "branch" target in deploy/targets.json (the ICS server: `deploy`).
      # Building is also where viz configs and note links are validated.
      - name: Build each server target
        env:
          TZ: America/Los_Angeles
        run: |
          # A failure inside $(…) would not stop the loop, so list first and require targets.
          targets="$(scripts/build-targets.sh list branch)"
          [ -n "$targets" ] || { echo "no branch targets in deploy/targets.json"; exit 1; }
          for t in $targets; do
            scripts/build-targets.sh build "$t" "out/$t"
          done

      - name: Publish each server target to its branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          # A failure inside $(…) would not stop the loop, so list first and require targets.
          targets="$(scripts/build-targets.sh list branch)"
          [ -n "$targets" ] || { echo "no branch targets in deploy/targets.json"; exit 1; }
          for t in $targets; do
            scripts/build-targets.sh push "$t" "out/$t"
          done

  # GitHub Pages mirror (`pages` target). Runs only after `build` passed, and
  # never touches any server branch, so the servers are unaffected either way.
  pages:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22.22"
          cache: npm

      - run: npm ci
      - name: Build the `pages` target from deploy/targets.json
        run: scripts/build-targets.sh build pages dist
        env:
          TZ: America/Los_Angeles

      # Deployment-local config (read by bento.js), from the repo variable
      # PAGES_SITE_LOCAL_JSON; skipped when the variable is unset.
      - name: Write assets/config/site.local.json
        if: vars.PAGES_SITE_LOCAL_JSON != ''
        env:
          JSON: ${{ vars.PAGES_SITE_LOCAL_JSON }}
        run: node -e 'JSON.parse(process.env.JSON); require("fs").writeFileSync("dist/assets/config/site.local.json", process.env.JSON)'

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
