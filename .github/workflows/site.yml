# Check and build every push. Targets live in deploy/targets.json:
#   kind "branch" -> on main, each build is force-pushed to its branch; a server
#                    pulls it with ./update_site.sh (ICS: `deploy`, run by hand)
#   kind "cloudflare" -> on main, the `cloudflare` jobs build it and push it to its
#                    branch (cf-deploy); Cloudflare Workers Builds deploys that branch
name: site

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: note "last edited" dates come from git log.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22.22"
          cache: npm

      - run: npm ci
      - name: Type and content check
        run: npx astro check
      - name: Renderer matches the legacy md-viewer on every note
        run: npx tsx scripts/migrate/parity.ts
      # Every "branch" target in deploy/targets.json (the ICS server: `deploy`).
      # Building is also where viz configs and note links are validated.
      - name: Build each server target
        env:
          TZ: America/Los_Angeles
        run: |
          # A failure inside $(…) would not stop the loop, so list first and require targets.
          targets="$(scripts/build-targets.sh list branch)"
          [ -n "$targets" ] || { echo "no branch targets in deploy/targets.json"; exit 1; }
          for t in $targets; do
            scripts/build-targets.sh build "$t" "out/$t"
          done

      - name: Publish each server target to its branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          # A failure inside $(…) would not stop the loop, so list first and require targets.
          targets="$(scripts/build-targets.sh list branch)"
          [ -n "$targets" ] || { echo "no branch targets in deploy/targets.json"; exit 1; }
          for t in $targets; do
            scripts/build-targets.sh push "$t" "out/$t"
          done

  # uci.kazuha.me (`cloudflare` target): build here, push the result to its branch
  # (cf-deploy); Cloudflare Workers Builds watches that branch and only runs
  # `wrangler deploy`. Runs only after `build` passed and never touches any
  # server branch, so the servers are unaffected either way.
  cloudflare:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Runs third-party code (npm ci, astro build): read-only token.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22.22"
          cache: npm

      - run: npm ci
      - name: Build the `cloudflare` target from deploy/targets.json
        run: scripts/build-targets.sh build cloudflare out/cloudflare
        env:
          TZ: America/Los_Angeles

      # Deployment-local config (read by bento.js), from the repo variable
      # PAGES_SITE_LOCAL_JSON; skipped when the variable is unset.
      - name: Write assets/config/site.local.json
        if: vars.PAGES_SITE_LOCAL_JSON != ''
        env:
          JSON: ${{ vars.PAGES_SITE_LOCAL_JSON }}
        run: node -e 'JSON.parse(process.env.JSON); require("fs").writeFileSync("out/cloudflare/assets/config/site.local.json", process.env.JSON)'

      - name: Add wrangler.jsonc, _headers and .assetsignore
        run: scripts/build-targets.sh wrap cloudflare out/cloudflare

      - uses: actions/upload-artifact@v7
        with:
          name: cloudflare
          path: out/cloudflare
          include-hidden-files: true
          retention-days: 1

  # Only this job can write to the repo, and it installs and runs nothing from npm.
  cloudflare-publish:
    needs: cloudflare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: cloudflare-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: cloudflare
          path: ${{ runner.temp }}/cloudflare

      - name: Push the build to its branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MSG: ${{ github.event.head_commit.message }}
        run: scripts/build-targets.sh push cloudflare "$RUNNER_TEMP/cloudflare"
