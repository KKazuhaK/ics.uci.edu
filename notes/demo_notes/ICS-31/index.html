  <script>
    // To hide a week: add hidden: true (e.g. { week: 3, ..., hidden: true })
    var weekCatalog = [
      { week: 2,
        title: "基础类型、运算符与模块 | 表达式和字符串",
        summary: "数字类型、算术表达式、除法与取模、字符串基础、切片、格式化、f-string 以及相关实验。",
        labs: 4, file: "week-2.html" },
      { week: 3,
        title: "循环、列表和字符串操作",
        summary: "for 循环、if/elif 分支、用 append() 构建列表、字符串方法 split()，以及计数类模式。",
        labs: 4, file: "week-3.html" },
      { week: 5,
        title: "while 循环",
        summary: "哨兵控制的 while 循环、整数除法 // 与取模 %、元组解包，以及 Lab 5.18 和 Lab 5.19。",
        labs: 2, file: "week-5.html" }
    ];

    (function () {
      var grid = document.getElementById("demos-grid");
      var html = "";
      for (var i = 0; i < weekCatalog.length; i++) {
        var w = weekCatalog[i];
        if (w.hidden) continue;
        html +=
          '<a href="' + w.file + '" class="card interactive week-card">' +
            '<span class="week-badge">第 ' + w.week + ' 周</span>' +
            '<h3>' + w.title + '</h3>' +
            '<p class="week-summary">' + w.summary + '</p>' +
            '<div class="week-meta-row">' +
              '<span class="note-state ready">' + w.labs + ' 个演示</span>' +
              '<span class="btn-open">打开本周 →</span>' +
            '</div>' +
          '</a>';
      }
      grid.innerHTML = html;
    })();
  </script>
