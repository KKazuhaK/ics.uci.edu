  <script>
    const pageCopy = {
      "en-US": {
        heroPrimary: "ICS 45C is UCI's C++ programming course, focused on how programs are designed, built, debugged, and reasoned about in a lower-level language.",
        heroSecondary: "This page collects week-by-week notes for classmates who want a structured review of course concepts such as C++ syntax, program structure, testing, and problem solving."
      },
      "zh-CN": {
        heroPrimary: "ICS 45C 是 UCI 的 C++ 课程,重点在于用更贴近底层的语言学习程序如何被设计、实现、调试与分析。",
        heroSecondary: "这个页面汇总按周整理的课程笔记,方便同学回顾 C++ 语法、程序结构、测试方法和解题思路等核心内容。"
      }
    };

    const notesCatalog = [
      { week: "Week 1",
        title:   { "en-US": "Reading Notes", "zh-CN": "阅读笔记" },
        summary: { "en-US": "Runestone + LearnCpp + GoogleTest primer notes, organized into one structured reading guide.",
                   "zh-CN": "整合 Runestone、LearnCpp 和 GoogleTest primer 的阅读笔记,整理成一份结构化导读。" },
        availability: { "en-US": { note: "ICS45C_Week1_Notes_en-US.md" },
                        "zh-CN": { note: "ICS45C_Week1_Notes_zh-CN.md" } } },
      { week: "Week 2",
        title:   { "en-US": "Reading Notes", "zh-CN": "阅读笔记" },
        summary: { "en-US": "References, OOP fundamentals, classes, constructors, C arrays, and more — integrated reading notes for Week 2.",
                   "zh-CN": "涵盖引用、面向对象编程、类与构造函数、C 数组等核心概念的整合阅读笔记。" },
        availability: { "en-US": { note: "ICS45C_Week2_Notes_en-US.md" },
                        "zh-CN": { note: "ICS45C_Week2_Notes_zh-CN.md" } } },
      { week: "Week 3",
        title:   { "en-US": "Reading Notes", "zh-CN": "阅读笔记" },
        summary: { "en-US": "std::string, return by reference, C-style arrays and pointer arithmetic, operator overloading, file I/O, and error handling.",
                   "zh-CN": "涵盖 std::string、引用返回、C 风格数组与指针运算、运算符重载、文件 I/O 和错误处理等主题。" },
        availability: { "en-US": { note: "ICS45C_Week3_Notes_en-US.md" },
                        "zh-CN": { note: "ICS45C_Week3_Notes_zh-CN.md" } } },
      { week: "Week 4",
        title:   { "en-US": "Reading Notes", "zh-CN": "阅读笔记" },
        summary: { "en-US": "Literals, constexpr, dynamic memory (new/delete), copy/move constructors, Rule of Three/Five, and the IntList example.",
                   "zh-CN": "涵盖字面量、constexpr、动态内存(new/delete)、拷贝/移动构造与赋值、Rule of Three/Five 以及 IntList 示例。" },
        availability: { "en-US": { note: "ICS45C_Week4_Notes_en-US.md" },
                        "zh-CN": { note: "ICS45C_Week4_Notes_zh-CN.md" } } },
      { week: "Week 5",
        title:   { "en-US": "Reading Notes", "zh-CN": "阅读笔记" },
        summary: { "en-US": "Linked lists (Node, UnorderedList, CharList), namespace list helpers, RAII for linked structures, and the Three Laws of Recursion (Tower of Hanoi, maze, Sierpinski).",
                   "zh-CN": "链表(Node、UnorderedList、CharList)、namespace list 设计模式、链式结构的 RAII,以及递归三大法则(汉诺塔、走迷宫、Sierpinski)。" },
        availability: { "en-US": { note: "ICS45C_Week5_Notes_en-US.md" },
                        "zh-CN": { note: "ICS45C_Week5_Notes_zh-CN.md" } } },
      { week: "Week 6",
        title:   { "en-US": "Reading Notes", "zh-CN": "阅读笔记" },
        summary: { "en-US": "Inheritance and polymorphism: is-a, derived constructors, public/protected/private inheritance, virtual functions, pure virtual & abstract classes, dynamic_cast, and printing inherited classes via operator<<.",
                   "zh-CN": "继承与多态:is-a 关系、派生类构造、public/protected/private 继承、虚函数、纯虚函数与抽象类、dynamic_cast,以及用 operator<< 打印继承类对象。" },
        availability: { "en-US": { note: "ICS45C_Week6_Notes_en-US.md" },
                        "zh-CN": { note: "ICS45C_Week6_Notes_zh-CN.md" } } },
      { week: "Week 7",
        title:   { "en-US": "Reading Notes", "zh-CN": "阅读笔记" },
        summary: { "en-US": "Templates (function & class), non-type template parameters, lambdas and captures, exceptions (throw/try/catch, stack unwinding, exception classes, noexcept), friend non-member functions, stringstreams, and multiple inheritance with virtual base classes.",
                   "zh-CN": "模板(函数模板与类模板)、非类型模板参数、lambda 与捕获、异常机制(throw/try/catch、栈展开、异常类、noexcept)、friend 非成员函数、stringstream,以及多重继承与虚基类。" },
        availability: { "en-US": { note: "ICS45C_Week7_Notes_en-US.md" },
                        "zh-CN": { note: "ICS45C_Week7_Notes_zh-CN.md" } } },
      { week: "Week 8",
        title:   { "en-US": "Reading Notes", "zh-CN": "阅读笔记" },
        summary: { "en-US": "The C++ Standard Library and STL — containers (sequence, associative, adapter), iterators and iterator categories, algorithms (sort/find/transform/accumulate…), iterator adapters (back_inserter, stream iterators, reverse iterators), function objects, C++20 ranges, and the iostream library (istream/ostream, manipulators, formatting flags).",
                   "zh-CN": "C++ 标准库与 STL — 容器(顺序、关联、适配器)、迭代器与迭代器类别、算法(sort/find/transform/accumulate 等)、迭代器适配器(back_inserter、流迭代器、reverse 迭代器)、函数对象、C++20 ranges,以及 iostream 库(istream/ostream、操纵子、格式化标志)。" },
        availability: { "en-US": { note: "ICS45C_Week8_Notes_en-US.md" },
                        "zh-CN": { note: "ICS45C_Week8_Notes_zh-CN.md" } } },
      { week: "Week 9",
        title:   { "en-US": "Reading Notes", "zh-CN": "阅读笔记" },
        summary: { "en-US": "Designing container classes (IntArray full build-up), std::initializer_list and brace-vs-paren initialization, assert / static_assert / NDEBUG, iterators in depth (begin/end, invalidation, the erase idiom), std::iterator_traits and iterator category tags, smart pointers and move semantics (unique_ptr, shared_ptr, make_unique/make_shared), C++20 ranges and views, and HW9 SetList + MapArray with their forward / random-access iterators.",
                   "zh-CN": "设计容器类(IntArray 从零完整搭建)、std::initializer_list 与花括号 vs 圆括号初始化、assert / static_assert / NDEBUG、深入迭代器(begin/end、失效、erase 习惯用法)、std::iterator_traits 与迭代器类别 tag、智能指针与移动语义(unique_ptr、shared_ptr、make_unique/make_shared)、C++20 ranges 与 views,以及 HW9 SetList + MapArray 及其前向 / 随机访问迭代器。" },
        availability: { "en-US": { note: "ICS45C_Week9_Notes_en-US.md" },
                        "zh-CN": { note: "ICS45C_Week9_Notes_zh-CN.md" } } },
      { week: "Final Review",
        title:   { "en-US": "Final Review Notes", "zh-CN": "期末复习笔记" },
        summary: { "en-US": "Exam-ready review built from the 109-question study guide and every lecture deck — all 13 topic groups (C++ programs, variables & expressions, memory/lifetime/scope, arrays/strings/linked lists, functions & parameters, classes & objects, inheritance & polymorphism, templates, lambdas, exceptions, namespaces, I/O streams, STL containers/iterators/algorithms), plus quick comparison tables, a code-review appendix, and the 12 most important things to walk in knowing.",
                   "zh-CN": "依据 109 题 Study Guide 和全部课堂讲义整理的期末复习版,覆盖全部 13 个主题板块(C++ 程序、变量与表达式、内存/生命周期/作用域、数组/字符串/链表、函数与参数、类与对象、继承与多态、模板、lambda、异常、命名空间、I/O 流、STL 容器/迭代器/算法),并附速查对照表、Code Review 附录,以及考前必须记住的 12 个要点。" },
        availability: { "en-US": { note: "ICS45C_Final_Review_Notes_en-US.md" },
                        "zh-CN": { note: "ICS45C_Final_Review_Notes_zh-CN.md" } } }
    ];

    let activeLanguage = "en-US";

    function formatDate(dateStr, lang) {
      var d = new Date(dateStr);
      if (isNaN(d)) return "";
      if (lang === "zh-CN") return "最后编辑于 " + d.getFullYear() + " 年 " + (d.getMonth()+1) + " 月 " + d.getDate() + " 日";
      return "Last edited " + d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
    }

    function createNoteUrl(noteFile, language) {
      return "../../../tools/md-viewer/?kind=course_notes&course=ICS-45C&lang=" + encodeURIComponent(language) + "&note=" + encodeURIComponent(noteFile);
    }

    function getFallbackLanguage(entry) {
      if (activeLanguage === "en-US" && entry.availability["zh-CN"]) return "zh-CN";
      if (activeLanguage === "zh-CN" && entry.availability["en-US"]) return "en-US";
      return null;
    }

    function updateHero() {
      const copy = pageCopy[activeLanguage];
      document.getElementById("hero-copy-primary").textContent = copy.heroPrimary;
      document.getElementById("hero-copy-secondary").textContent = copy.heroSecondary;
    }

    function renderNotes() {
      const grid = document.getElementById("notes-grid");
      document.querySelectorAll("[data-language]").forEach(function (btn) {
        btn.classList.toggle("active", btn.dataset.language === activeLanguage);
      });
      updateHero();

      grid.innerHTML = notesCatalog.map(function (entry) {
        const currentVersion = entry.availability[activeLanguage];
        const fallbackLanguage = getFallbackLanguage(entry);
        const fallbackVersion = fallbackLanguage ? entry.availability[fallbackLanguage] : null;
        const primaryVersion = currentVersion || fallbackVersion;
        const noteLanguage = currentVersion ? activeLanguage : fallbackLanguage;
        const hasVersion = Boolean(primaryVersion);
        const stateText = currentVersion
          ? (activeLanguage === "zh-CN" ? "已就绪" : "Available")
          : fallbackVersion
            ? (activeLanguage === "zh-CN" ? "仅另一语言可用" : "Other language only")
            : (activeLanguage === "zh-CN" ? "稍后补充" : "Coming soon");
        const stateClass = currentVersion ? "note-state ready" : "note-state";
        const btnClass = hasVersion ? "btn-open" : "btn-open disabled";
        const href = hasVersion ? createNoteUrl(primaryVersion.note, noteLanguage) : "#";
        const btnText = currentVersion
          ? (activeLanguage === "zh-CN" ? "打开 →" : "Open →")
          : fallbackVersion
            ? (activeLanguage === "zh-CN" ? "打开现有版本 →" : "Open other lang →")
            : (activeLanguage === "zh-CN" ? "未就绪" : "Not ready");
        const noteFile = primaryVersion ? primaryVersion.note : "";
        return '<article class="card week-card">' +
          '<span class="week-badge">' + entry.week + '</span>' +
          '<h3>' + entry.title[activeLanguage] + '</h3>' +
          '<p class="week-summary">' + entry.summary[activeLanguage] + '</p>' +
          '<p class="week-date" data-note="' + noteFile + '"></p>' +
          '<div class="week-meta-row">' +
            '<span class="' + stateClass + '">' + stateText + '</span>' +
            '<a href="' + href + '" class="' + btnClass + '">' + btnText + '</a>' +
          '</div>' +
        '</article>';
      }).join("");

      document.querySelectorAll(".week-date[data-note]").forEach(function (el) {
        var note = el.dataset.note;
        if (!note) return;
        fetch("./" + note + "?v=" + Date.now(), { method: "HEAD", cache: "no-store" }).then(function (res) {
          var lm = res.headers.get("Last-Modified");
          if (lm) el.textContent = formatDate(lm, activeLanguage);
        }).catch(function () {});
      });
    }

    document.querySelectorAll("[data-language]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        activeLanguage = btn.dataset.language;
        renderNotes();
      });
    });

    renderNotes();
  </script>
  <script src="../../../assets/js/bento.js" defer></script>
  <script src="../../../assets/js/chat-widget.js" defer></script>
</body>
</html>
