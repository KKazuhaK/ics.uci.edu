  <script>
    const pageCopy = {
      "en-US": {
        heroPrimary: "ICS 46 is UCI's data structures course, focused on implementing classic data structures in C++ and analyzing their running time and memory use.",
        heroSecondary: "This page collects lecture-by-lecture notes for classmates who want a structured review of templates, pointers and ownership, algorithm analysis, and data structures such as lists, stacks, and queues."
      },
      "zh-CN": {
        heroPrimary: "ICS 46 是 UCI 的数据结构课程,重点在于用 C++ 实现经典数据结构,并分析它们的运行时间与内存开销。",
        heroSecondary: "这个页面汇总按讲整理的课程笔记,方便同学回顾模板、指针与所有权、算法分析,以及链表、栈、队列等数据结构。"
      }
    };

    const notesCatalog = [
      { week: "Lecture 0",
        title:   { "en-US": "Course Intro, Unit Tests & Templates", "zh-CN": "课程介绍、单元测试与模板" },
        summary: { "en-US": "What ICS 46 is about, C++ unit testing with Google Test, why templates exist, function templates and compile-time instantiation, .hpp/.tpp layout, implicit type constraints, and class templates (the Box example).",
                   "zh-CN": "ICS 46 课程概览、用 Google Test 写 C++ 单元测试、为什么需要模板、函数模板与编译期实例化、.hpp/.tpp 文件组织、类型参数的隐式约束，以及类模板（Box 示例）。" },
        availability: { "en-US": { note: "ICS46_Lec00_Notes_en-US.md" },
                        "zh-CN": { note: "ICS46_Lec00_Notes_zh-CN.md" } } },
      { week: "Lecture 1",
        title:   { "en-US": "Randomness, References & Pointers", "zh-CN": "随机数、引用与指针" },
        summary: { "en-US": "Random number generation in C++, references, raw pointers, and an introduction to smart pointers and ownership.",
                   "zh-CN": "C++ 随机数生成、引用、裸指针，以及智能指针与所有权（ownership）入门。" },
        availability: { "en-US": { note: "ICS46_Lec01_Notes_en-US.md" },
                        "zh-CN": { note: "ICS46_Lec01_Notes_zh-CN.md" } } },
      { week: "Lecture 2",
        title:   { "en-US": "Smart Pointers, Arrays & Empirical Analysis", "zh-CN": "智能指针、多维数组与经验分析" },
        summary: { "en-US": "Finishing smart-pointer ownership, 1D array review, multidimensional arrays, why we analyze algorithms, empirical timing of running time, and mathematical cost models.",
                   "zh-CN": "智能指针所有权收尾、一维数组复习、多维数组、为什么要分析算法、运行时间的经验测量，以及运行时间的数学模型。" },
        availability: { "en-US": { note: "ICS46_Lec02_Notes_en-US.md" },
                        "zh-CN": { note: "ICS46_Lec02_Notes_zh-CN.md" } } },
      { week: "Lecture 3",
        title:   { "en-US": "Algorithm Analysis & ArrayList", "zh-CN": "算法分析与 ArrayList" },
        summary: { "en-US": "Counting operations in 2-Sum, Big-O / Big-Ω / Big-Θ, common orders of growth, space complexity, and building an ArrayList (dynamic array) with resizing and amortized analysis.",
                   "zh-CN": "2-Sum 问题的操作计数、Big-O / Big-Ω / Big-Θ、常见增长阶、空间复杂度，以及实现 ArrayList（动态数组）的扩容与均摊分析。" },
        availability: { "en-US": { note: "ICS46_Lec03_Notes_en-US.md" },
                        "zh-CN": { note: "ICS46_Lec03_Notes_zh-CN.md" } } },
      { week: "Lecture 4",
        title:   { "en-US": "Linked Lists & Stacks", "zh-CN": "链表与栈" },
        summary: { "en-US": "Singly linked list API, implementation and analysis, doubly linked lists, ArrayList vs. linked lists, and the Stack ADT.",
                   "zh-CN": "单向链表的接口、实现与分析，双向链表，ArrayList 与链表的对比，以及栈（Stack）ADT。" },
        availability: { "en-US": { note: "ICS46_Lec04_Notes_en-US.md" },
                        "zh-CN": { note: "ICS46_Lec04_Notes_zh-CN.md" } } },
      { week: "Lecture 5",
        title:   { "en-US": "Queues, Deques & Stack Applications", "zh-CN": "队列、双端队列与栈的应用" },
        summary: { "en-US": "Stacks on linked lists, the Queue ADT and its implementations, expression evaluation with stacks, and queue applications.",
                   "zh-CN": "基于链表的栈、队列（Queue）ADT 及其实现、用栈求值表达式，以及队列的应用。" },
        availability: { "en-US": { note: "ICS46_Lec05_Notes_en-US.md" },
                        "zh-CN": { note: "ICS46_Lec05_Notes_zh-CN.md" } } },
      { week: "Lecture 6",
        title:   { "en-US": "Analysis of Recursion", "zh-CN": "递归的复杂度分析" },
        summary: { "en-US": "ADTs vs. data structures, setting up recurrences, the recursion-tree method, and the Master Theorem.",
                   "zh-CN": "ADT 与数据结构的区别、建立递推式、递归树方法，以及主定理（Master Theorem）。" },
        availability: { "en-US": { note: "ICS46_Lec06_Notes_en-US.md" },
                        "zh-CN": { note: "ICS46_Lec06_Notes_zh-CN.md" } } },
      { week: "Lecture 7",
        title:   { "en-US": "Sorting", "zh-CN": "排序" },
        summary: { "en-US": "Circular array queues and deques, sorting basics (cost model, memory, stability), selection sort vs. insertion sort.",
                   "zh-CN": "循环数组队列与双端队列、排序基础（代价模型、内存、稳定性），以及选择排序与插入排序的对比。" },
        availability: { "en-US": { note: "ICS46_Lec07_Notes_en-US.md" },
                        "zh-CN": { note: "ICS46_Lec07_Notes_zh-CN.md" } } },
      { week: "Lecture 8",
        title:   { "en-US": "Merge Sort, Quick Sort", "zh-CN": "归并排序与快速排序" },
        summary: { "en-US": "Merging sorted halves, top-down merge sort and its N log N analysis, quicksort with random shuffle and partitioning.",
                   "zh-CN": "合并两个有序半段、自顶向下归并排序及其 N log N 分析，以及带随机打乱与划分（partition）的快速排序。" },
        availability: { "en-US": { note: "ICS46_Lec08_Notes_en-US.md" },
                        "zh-CN": { note: "ICS46_Lec08_Notes_zh-CN.md" } } },
      { week: "Lecture 9",
        title:   { "en-US": "Quick Sort", "zh-CN": "快速排序" },
        summary: { "en-US": "Quick sort: Hoare/Sedgewick 2-pointer partitioning, full traces, worst/best/average analysis, stability and in-place properties, comparison of all sorts so far, and pivot/cutoff improvements.",
                   "zh-CN": "快速排序：Hoare/Sedgewick 双指针划分、完整排序过程追踪、最坏/最好/平均情况分析、稳定性与原地性、目前各排序算法对比，以及选主元与小数组截断等改进。" },
        availability: { "en-US": { note: "ICS46_Lec09_Notes_en-US.md" } } }
    ];

    let activeLanguage = "en-US";

    function formatDate(dateStr, lang) {
      var d = new Date(dateStr);
      if (isNaN(d)) return "";
      if (lang === "zh-CN") return "最后编辑于 " + d.getFullYear() + " 年 " + (d.getMonth()+1) + " 月 " + d.getDate() + " 日";
      return "Last edited " + d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
    }

    function createNoteUrl(noteFile, language) {
      return "../../../tools/md-viewer/?kind=course_notes&course=ICS-46&lang=" + encodeURIComponent(language) + "&note=" + encodeURIComponent(noteFile);
    }

    function getFallbackLanguage(entry) {
      if (activeLanguage === "en-US" && entry.availability["zh-CN"]) return "zh-CN";
      if (activeLanguage === "zh-CN" && entry.availability["en-US"]) return "en-US";
      return null;
    }

    function updateHero() {
      const copy = pageCopy[activeLanguage];
      document.getElementById("hero-copy-primary").textContent = copy.heroPrimary;
      document.getElementById("hero-copy-secondary").textContent = copy.heroSecondary;
    }

    function renderNotes() {
      const grid = document.getElementById("notes-grid");
      document.querySelectorAll("[data-language]").forEach(function (btn) {
        btn.classList.toggle("active", btn.dataset.language === activeLanguage);
      });
      updateHero();

      grid.innerHTML = notesCatalog.map(function (entry) {
        const currentVersion = entry.availability[activeLanguage];
        const fallbackLanguage = getFallbackLanguage(entry);
        const fallbackVersion = fallbackLanguage ? entry.availability[fallbackLanguage] : null;
        const primaryVersion = currentVersion || fallbackVersion;
        const noteLanguage = currentVersion ? activeLanguage : fallbackLanguage;
        const hasVersion = Boolean(primaryVersion);
        const stateText = currentVersion
          ? (activeLanguage === "zh-CN" ? "已就绪" : "Available")
          : fallbackVersion
            ? (activeLanguage === "zh-CN" ? "仅另一语言可用" : "Other language only")
            : (activeLanguage === "zh-CN" ? "稍后补充" : "Coming soon");
        const stateClass = currentVersion ? "note-state ready" : "note-state";
        const btnClass = hasVersion ? "btn-open" : "btn-open disabled";
        const href = hasVersion ? createNoteUrl(primaryVersion.note, noteLanguage) : "#";
        const btnText = currentVersion
          ? (activeLanguage === "zh-CN" ? "打开 →" : "Open →")
          : fallbackVersion
            ? (activeLanguage === "zh-CN" ? "打开现有版本 →" : "Open other lang →")
            : (activeLanguage === "zh-CN" ? "未就绪" : "Not ready");
        const noteFile = primaryVersion ? primaryVersion.note : "";
        return '<article class="card week-card">' +
          '<span class="week-badge">' + entry.week + '</span>' +
          '<h3>' + entry.title[activeLanguage] + '</h3>' +
          '<p class="week-summary">' + entry.summary[activeLanguage] + '</p>' +
          '<p class="week-date" data-note="' + noteFile + '"></p>' +
          '<div class="week-meta-row">' +
            '<span class="' + stateClass + '">' + stateText + '</span>' +
            '<a href="' + href + '" class="' + btnClass + '">' + btnText + '</a>' +
          '</div>' +
        '</article>';
      }).join("");

      document.querySelectorAll(".week-date[data-note]").forEach(function (el) {
        var note = el.dataset.note;
        if (!note) return;
        fetch("./" + note + "?v=" + Date.now(), { method: "HEAD", cache: "no-store" }).then(function (res) {
          var lm = res.headers.get("Last-Modified");
          if (lm) el.textContent = formatDate(lm, activeLanguage);
        }).catch(function () {});
      });
    }

    document.querySelectorAll("[data-language]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        activeLanguage = btn.dataset.language;
        renderNotes();
      });
    });

    renderNotes();
  </script>
  <script src="../../../assets/js/bento.js" defer></script>
  <script src="../../../assets/js/chat-widget.js" defer></script>
