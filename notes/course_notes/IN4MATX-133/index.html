  <script>
    const pageCopy = {
      "en-US": {
        heroPrimary: "IN4MATX 133 is UCI's User Interface Software course, focused on building interfaces with web technologies: HTML, CSS, JavaScript, TypeScript, and modern UI frameworks.",
        heroSecondary: "This page collects lecture-by-lecture notes with live, editable HTML/CSS/JS demos, for classmates who want a structured review of markup and accessibility, styling and responsive layout, the DOM, and UI tooling."
      },
      "zh-CN": {
        heroPrimary: "IN4MATX 133 是 UCI 的用户界面软件课程,重点在于用 Web 技术构建界面:HTML、CSS、JavaScript、TypeScript 以及现代 UI 框架。",
        heroSecondary: "这个页面汇总按讲整理的课程笔记(目前为英文版),配有可编辑的 HTML/CSS/JS 实时演示,方便同学回顾标记与无障碍、样式与响应式布局、DOM,以及各类 UI 工具。"
      }
    };

    const notesCatalog = [
      { week: "Lecture 1",
        title:   { "en-US": "Introduction & History", "zh-CN": "课程介绍与计算历史" },
        summary: { "en-US": "Why UI implementation matters, Weiser's three waves of computing (mainframe, personal, ubiquitous), why web tools became the standard, and course goals, assignments, and policies.",
                   "zh-CN": "为什么 UI 实现很重要、Weiser 的三次计算浪潮（大型机、个人计算机、普适计算）、Web 技术为何成为标准，以及课程目标、作业与政策。" },
        availability: { "en-US": { note: "IN4MATX133_Lec01_Notes_en-US.md" }, "zh-CN": { note: "IN4MATX133_Lec01_Notes_zh-CN.md" } } },
      { week: "Lecture 2",
        title:   { "en-US": "HTML & Accessibility", "zh-CN": "HTML 与无障碍" },
        summary: { "en-US": "How the web works, HTML tags, nesting, attributes, document structure and validation, screen readers and semantic elements, alt text and aria-label, and inclusive design.",
                   "zh-CN": "Web 如何运作、HTML 标签、嵌套、属性、文档结构与校验、屏幕阅读器与语义化元素、alt 文本与 aria-label，以及包容性设计。" },
        availability: { "en-US": { note: "IN4MATX133_Lec02_Notes_en-US.md" }, "zh-CN": { note: "IN4MATX133_Lec02_Notes_zh-CN.md" } } },
      { week: "Lecture 3",
        title:   { "en-US": "CSS", "zh-CN": "CSS" },
        summary: { "en-US": "CSS syntax and linking, element/class/ID selectors, the cascade and specificity, block vs. inline and the box model, positioning, units, pseudo-classes, fonts, and debugging tools.",
                   "zh-CN": "CSS 语法与引入方式、元素/类/ID 选择器、层叠与优先级、块级与行内元素及盒模型、定位、单位、伪类、字体，以及调试工具。" },
        availability: { "en-US": { note: "IN4MATX133_Lec03_Notes_en-US.md" }, "zh-CN": { note: "IN4MATX133_Lec03_Notes_zh-CN.md" } } },
      { week: "Lecture 4",
        title:   { "en-US": "Responsive Design & JavaScript 1", "zh-CN": "响应式设计与 JavaScript（一）" },
        summary: { "en-US": "Adaptive vs. responsive design, breakpoints and media queries, fluid grids, mobile-first, the Bootstrap grid and components, then an introduction to JavaScript's role and history.",
                   "zh-CN": "自适应与响应式设计、断点与媒体查询、流式网格、移动优先、Bootstrap 网格与组件，以及 JavaScript 的角色与历史入门。" },
        availability: { "en-US": { note: "IN4MATX133_Lec04_Notes_en-US.md" }, "zh-CN": { note: "IN4MATX133_Lec04_Notes_zh-CN.md" } } },
      { week: "Lecture 5",
        title:   { "en-US": "JavaScript 2", "zh-CN": "JavaScript（二）" },
        summary: { "en-US": "Variables and types, control flow and strings, arrays, objects and JSON, functions as objects, callbacks, forEach/map/filter/reduce, and scope, hoisting, let vs. var.",
                   "zh-CN": "变量与类型、控制流与字符串、数组、对象与 JSON、函数即对象、回调、forEach/map/filter/reduce，以及作用域、提升与 let/var 的区别。" },
        availability: { "en-US": { note: "IN4MATX133_Lec05_Notes_en-US.md" }, "zh-CN": { note: "IN4MATX133_Lec05_Notes_zh-CN.md" } } },
      { week: "Lecture 6",
        title:   { "en-US": "DOM Manipulation & Package Management", "zh-CN": "DOM 操作与包管理" },
        summary: { "en-US": "The Document Object Model, selecting and editing elements, changing the DOM tree, events and listeners, script order, client-side validation, and package managers with npm.",
                   "zh-CN": "文档对象模型（DOM）、选择与修改元素、改变 DOM 树、事件与监听器、脚本加载顺序、客户端校验，以及包管理器与 npm。" },
        availability: { "en-US": { note: "IN4MATX133_Lec06_Notes_en-US.md" }, "zh-CN": { note: "IN4MATX133_Lec06_Notes_zh-CN.md" } } },
      { week: "Lecture 7",
        title:   { "en-US": "TypeScript & Data Visualization Tools", "zh-CN": "TypeScript 与数据可视化工具" },
        summary: { "en-US": "TypeScript types, classes and interfaces, tsconfig and declaration files, evaluating UI tools by threshold and ceiling, declarative visualization, and building charts with Vega-Lite.",
                   "zh-CN": "TypeScript 类型、类与接口、tsconfig 与声明文件、用门槛与上限评估 UI 工具、声明式可视化，以及用 Vega-Lite 构建图表。" },
        availability: { "en-US": { note: "IN4MATX133_Lec07_Notes_en-US.md" }, "zh-CN": { note: "IN4MATX133_Lec07_Notes_zh-CN.md" } } },
      { week: "Lecture 8",
        title: { "en-US": "AJAX, Fetch & Promises", "zh-CN": "AJAX、Fetch 与 Promise" },
        summary: { "en-US": "Web APIs, URIs and HTTP verbs, URL escaping, AJAX with XML vs. JSON, XMLHttpRequest vs. fetch(), asynchronous requests, promises with .then()/.catch(), the same-origin policy, and Promise.all.", "zh-CN": "Web API、URI 与 HTTP 动词、URL 转义、AJAX 中的 XML 与 JSON、XMLHttpRequest 与 fetch()、异步请求、用 .then()/.catch() 处理 Promise、同源策略，以及 Promise.all。" },
        availability: { "en-US": { note: "IN4MATX133_Lec08_Notes_en-US.md" }, "zh-CN": { note: "IN4MATX133_Lec08_Notes_zh-CN.md" } } },
      { week: "Lecture 9",
        title: { "en-US": "Server-Side Development, Authentication & Authorization", "zh-CN": "服务器端开发、身份验证与授权" },
        summary: { "en-US": "Node.js and npm, reading files, Express and its generator, authentication vs. authorization, OAuth 2.0 and its four steps, the same-origin policy, and OpenID Connect.", "zh-CN": "Node.js 与 npm、读取文件、Express 及其生成器、身份验证与授权的区别、OAuth 2.0 及其四个步骤、同源策略，以及 OpenID Connect。" },
        availability: { "en-US": { note: "IN4MATX133_Lec09_Notes_en-US.md" }, "zh-CN": { note: "IN4MATX133_Lec09_Notes_zh-CN.md" } } }
    ];

    let activeLanguage = "en-US";

    function formatDate(dateStr, lang) {
      var d = new Date(dateStr);
      if (isNaN(d)) return "";
      if (lang === "zh-CN") return "最后编辑于 " + d.getFullYear() + " 年 " + (d.getMonth()+1) + " 月 " + d.getDate() + " 日";
      return "Last edited " + d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
    }

    function createNoteUrl(noteFile, language) {
      return "../../../tools/md-viewer/?kind=course_notes&course=IN4MATX-133&lang=" + encodeURIComponent(language) + "&note=" + encodeURIComponent(noteFile);
    }

    function getFallbackLanguage(entry) {
      if (activeLanguage === "en-US" && entry.availability["zh-CN"]) return "zh-CN";
      if (activeLanguage === "zh-CN" && entry.availability["en-US"]) return "en-US";
      return null;
    }

    function updateHero() {
      const copy = pageCopy[activeLanguage];
      document.getElementById("hero-copy-primary").textContent = copy.heroPrimary;
      document.getElementById("hero-copy-secondary").textContent = copy.heroSecondary;
    }

    function renderNotes() {
      const grid = document.getElementById("notes-grid");
      document.querySelectorAll("[data-language]").forEach(function (btn) {
        btn.classList.toggle("active", btn.dataset.language === activeLanguage);
      });
      updateHero();

      grid.innerHTML = notesCatalog.map(function (entry) {
        const currentVersion = entry.availability[activeLanguage];
        const fallbackLanguage = getFallbackLanguage(entry);
        const fallbackVersion = fallbackLanguage ? entry.availability[fallbackLanguage] : null;
        const primaryVersion = currentVersion || fallbackVersion;
        const noteLanguage = currentVersion ? activeLanguage : fallbackLanguage;
        const hasVersion = Boolean(primaryVersion);
        const stateText = currentVersion
          ? (activeLanguage === "zh-CN" ? "已就绪" : "Available")
          : fallbackVersion
            ? (activeLanguage === "zh-CN" ? "仅另一语言可用" : "Other language only")
            : (activeLanguage === "zh-CN" ? "稍后补充" : "Coming soon");
        const stateClass = currentVersion ? "note-state ready" : "note-state";
        const btnClass = hasVersion ? "btn-open" : "btn-open disabled";
        const href = hasVersion ? createNoteUrl(primaryVersion.note, noteLanguage) : "#";
        const btnText = currentVersion
          ? (activeLanguage === "zh-CN" ? "打开 →" : "Open →")
          : fallbackVersion
            ? (activeLanguage === "zh-CN" ? "打开现有版本 →" : "Open other lang →")
            : (activeLanguage === "zh-CN" ? "未就绪" : "Not ready");
        const noteFile = primaryVersion ? primaryVersion.note : "";
        return '<article class="card week-card">' +
          '<span class="week-badge">' + entry.week + '</span>' +
          '<h3>' + entry.title[activeLanguage] + '</h3>' +
          '<p class="week-summary">' + entry.summary[activeLanguage] + '</p>' +
          '<p class="week-date" data-note="' + noteFile + '"></p>' +
          '<div class="week-meta-row">' +
            '<span class="' + stateClass + '">' + stateText + '</span>' +
            '<a href="' + href + '" class="' + btnClass + '">' + btnText + '</a>' +
          '</div>' +
        '</article>';
      }).join("");

      document.querySelectorAll(".week-date[data-note]").forEach(function (el) {
        var note = el.dataset.note;
        if (!note) return;
        fetch("./" + note + "?v=" + Date.now(), { method: "HEAD", cache: "no-store" }).then(function (res) {
          var lm = res.headers.get("Last-Modified");
          if (lm) el.textContent = formatDate(lm, activeLanguage);
        }).catch(function () {});
      });
    }

    document.querySelectorAll("[data-language]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        activeLanguage = btn.dataset.language;
        renderNotes();
      });
    });

    renderNotes();
  </script>
  <script src="../../../assets/js/bento.js" defer></script>
  <script src="../../../assets/js/chat-widget.js" defer></script>
