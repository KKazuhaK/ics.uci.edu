<style>
			:root {
				--chat-blue: #244f8f;
				--chat-blue-bg: rgba(36, 79, 143, 0.10);
				--chat-blue-border: rgba(36, 79, 143, 0.22);
				--chat-blue-bg-strong: rgba(36, 79, 143, 0.17);
				--chat-blue-hover: #183b73;
				--chat-border: rgba(42, 79, 133, 0.16);
				--chat-border-soft: rgba(42, 79, 133, 0.12);
				--chat-ink: #23324a;
				--chat-muted: #516074;
				--chat-card-bg: rgba(255, 255, 255, 0.98);
				--chat-card-bg-soft:
					radial-gradient(circle at top right, rgba(36, 79, 143, 0.08), transparent 18rem),
					linear-gradient(135deg, rgba(255,255,255,0.98) 0%, rgba(246,249,255,0.99) 58%, rgba(250,252,255,0.98) 100%);
				--chat-card-shadow: 0 1.25rem 3rem rgba(23, 43, 77, 0.08);
				--chat-card-shadow-lg: 0 1.5rem 3.5rem rgba(23, 43, 77, 0.08);
				--chat-input-bg: #ffffff;
				--chat-input-border: rgba(42, 79, 133, 0.2);
				--chat-msg-user-bg: var(--chat-blue);
				--chat-msg-user-text: #ffffff;
				--chat-msg-ai-bg: #f7f9fc;
				--chat-msg-ai-text: #23324a;
				--chat-badge-bg: #e67e22;
				--chat-badge-text: #ffffff;
				--chat-crumb-sep: #97a7bb;
				--chat-chip-current-text: #ffffff;
				--chat-red: #c53030;
				--chat-red-bg: rgba(197, 48, 48, 0.08);
				--chat-red-bg-strong: rgba(197, 48, 48, 0.15);
				--chat-red-border: rgba(197, 48, 48, 0.2);
				--chat-shiki-bg: #1e1e1e;
				--chat-shiki-text: #d4d4d4;
			}

			html[data-theme="dark"] {
				--chat-blue: #6aa3f5;
				--chat-blue-bg: rgba(106, 163, 245, 0.15);
				--chat-blue-border: rgba(106, 163, 245, 0.32);
				--chat-blue-bg-strong: rgba(106, 163, 245, 0.24);
				--chat-blue-hover: #a8c9ff;
				--chat-border: rgba(255, 255, 255, 0.1);
				--chat-border-soft: rgba(255, 255, 255, 0.07);
				--chat-ink: #dde4f0;
				--chat-muted: #8c9cb5;
				--chat-card-bg: #14181f;
				--chat-card-bg-soft:
					radial-gradient(circle at top right, rgba(106, 163, 245, 0.08), transparent 18rem),
					linear-gradient(135deg, #181d26 0%, #1a1f29 58%, #1c222c 100%);
				--chat-card-shadow: 0 1.25rem 3rem rgba(0, 0, 0, 0.35);
				--chat-card-shadow-lg: 0 1.5rem 3.5rem rgba(0, 0, 0, 0.4);
				--chat-input-bg: #181d26;
				--chat-input-border: rgba(255, 255, 255, 0.14);
				--chat-msg-user-text: #0a0d12;
				--chat-msg-ai-bg: #1a1f28;
				--chat-msg-ai-text: #dde4f0;
				--chat-badge-bg: #d97a1d;
				--chat-crumb-sep: #54627a;
				--chat-chip-current-text: #0a0d12;
				--chat-red: #f28b8b;
				--chat-red-bg: rgba(242, 139, 139, 0.12);
				--chat-red-bg-strong: rgba(242, 139, 139, 0.22);
				--chat-red-border: rgba(242, 139, 139, 0.32);
			}

			.chat-shell {
				display: flex;
				flex-direction: column;
				background: var(--chat-card-bg);
				border: 1px solid var(--chat-border);
				border-radius: 1.4rem;
				box-shadow: var(--chat-card-shadow-lg);
				overflow: hidden;
			}

			.chat-shell > header.major {
				display: none;
			}

			.chat-shell > :last-child { border-bottom: 0 !important; }

			/* Intro card */
			.chat-intro {
				padding: 0.75rem 1.5rem;
				border-bottom: 1px solid var(--chat-border);
				background: var(--chat-card-bg-soft);
				display: flex;
				align-items: center;
				justify-content: space-between;
				flex-wrap: wrap;
				gap: 0.6rem;
			}
			.chat-intro .crumbs { margin-bottom: 0; }

			.chat-breadcrumb {
				display: flex;
				flex-wrap: wrap;
				gap: 0.45rem;
				align-items: center;
			}

			.chat-chip {
				display: inline-flex;
				align-items: center;
				padding: 0.38rem 0.8rem;
				border-radius: 999px;
				font-size: 0.86rem;
				font-weight: 700;
				text-decoration: none;
				border-bottom: 0 !important;
				background: var(--chat-blue-bg);
				box-shadow: inset 0 0 0 1.5px var(--chat-blue-border);
				color: var(--chat-blue) !important;
				transition: background 0.2s ease, transform 0.2s ease;
			}

			.chat-chip:hover {
				background: var(--chat-blue-bg-strong);
				transform: translateY(-1px);
				color: var(--chat-blue-hover) !important;
			}

			.chat-chip-current {
				background: var(--chat-blue);
				box-shadow: none;
				color: var(--chat-chip-current-text) !important;
				cursor: default;
			}

			.chat-chip-current:hover {
				background: var(--chat-blue);
				transform: none;
				color: var(--chat-chip-current-text) !important;
			}

			.chat-sep {
				font-size: 1.18rem;
				font-weight: 700;
				color: var(--chat-crumb-sep);
				user-select: none;
				line-height: 1;
			}

			.chat-badge {
				display: inline-flex;
				align-items: center;
				padding: 0.38rem 0.8rem;
				border-radius: 999px;
				font-size: 0.86rem;
				font-weight: 700;
				letter-spacing: .5px;
				text-transform: uppercase;
				color: var(--chat-msg-user-text);
				background: var(--chat-badge-bg);
				box-shadow: none;
			}

			/* Match .crumb sizing (bento.css) so the whole intro row lines up */
			.chat-beta {
				display: inline-flex; align-items: center; align-self: stretch;
				margin-left: 4px; padding: 0 12px; border-radius: 999px;
				font-size: 12px; font-weight: 700; letter-spacing: 0.8px;
			}
			#logout-btn, #new-chat-btn {
				display: inline-flex;
				align-items: center;
				gap: 0.25rem;
				padding: 7px 14px;
				border-radius: 999px;
				font-family: inherit;
				font-size: 14px;
				font-weight: 600;
				letter-spacing: normal;
				text-transform: none;
				text-decoration: none;
				border: none;
				border-bottom: 0 !important;
				cursor: pointer;
				transition: background 0.2s ease, transform 0.2s ease;
				line-height: inherit;
				height: auto;
			}
			#new-chat-btn {
				display: none;
				background: var(--chat-blue-bg);
				box-shadow: inset 0 0 0 1.5px var(--chat-blue-border);
				color: var(--chat-blue);
			}
			#new-chat-btn.active { display: inline-flex; }
			#new-chat-btn:hover {
				background: var(--chat-blue-bg-strong);
				transform: translateY(-1px);
				color: var(--chat-blue-hover);
			}
			#logout-btn {
				display: none;
				background: var(--chat-red-bg);
				box-shadow: inset 0 0 0 1.5px var(--chat-red-border);
				color: var(--chat-red);
			}
			#logout-btn:hover {
				background: var(--chat-red-bg-strong);
				transform: translateY(-1px);
			}
			#logout-btn.active { display: inline-flex; }

			/* Login notice */
			#login-notice {
				max-width: 520px;
				text-align: left;
				font-size: 0.85rem;
				line-height: 1.65;
				color: var(--chat-muted);
				margin: 0;
				list-style: none;
				padding: 0;
			}
			#login-notice li {
				padding: 3px 0 3px 1.2em;
				position: relative;
			}
			#login-notice li::before {
				content: "•";
				position: absolute;
				left: 0;
				color: var(--chat-blue);
				font-weight: 700;
			}
			#login-notice a { color: var(--chat-blue); font-weight: 600; }
			#login-notice strong { color: var(--chat-ink); }

			/* Chat card */
			.chat-card {
				background: var(--chat-card-bg);
				overflow: hidden;
				display: flex;
				flex-direction: column;
				height: calc(100vh - 280px);
				min-height: 300px;
			}
			.chat-card.login-mode {
				height: auto;
				min-height: 400px;
				overflow: visible;
			}

			/* Login gate */
			#password-gate {
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				flex: 1;
				gap: 14px;
				padding: 2rem;
			}
			#sso-login-btn {
				all: unset; box-sizing: border-box;
				display: inline-flex; align-items: center; gap: 12px;
				background: var(--chat-blue); color: var(--chat-msg-user-text);
				border-radius: 999px;
				padding: 10px 28px 10px 10px; cursor: pointer;
				font-size: 14.5px; font-weight: 700; letter-spacing: .02em;
				transition: background .15s, box-shadow .15s;
				box-shadow: 0 2px 8px rgba(36,79,143,.25);
			}
			#sso-login-btn:hover { background: var(--chat-blue-hover); box-shadow: 0 4px 16px rgba(36,79,143,.35); }
			#sso-login-btn img {
				width: 32px; height: 32px; border-radius: 50%;
				border: none; object-fit: cover;
			}
			#pw-toggle {
				all: unset; box-sizing: border-box;
				cursor: pointer; color: var(--chat-muted); font-size: 12.5px;
				border-bottom: 1px dashed var(--chat-border);
				transition: color .15s;
			}
			#pw-toggle:hover { color: var(--chat-blue); }
			#pw-section { display: none; flex-direction: column; align-items: center; gap: 12px; }
			#pw-section.active { display: flex; }
			#password-gate label {
				color: var(--chat-muted);
				font-size: 0.95em;
				font-weight: 600;
			}
			#password-gate input {
				all: unset;
				box-sizing: border-box;
				background: var(--chat-blue-bg);
				border: 1.5px solid var(--chat-border);
				color: var(--chat-ink);
				padding: 10px 16px;
				border-radius: 10px;
				font-size: 15px;
				width: 260px;
				text-align: center;
				transition: border-color .15s;
			}
			#password-gate input:focus {
				border-color: var(--chat-blue);
			}
			#password-gate .pw-btn {
				all: unset;
				box-sizing: border-box;
				background: var(--chat-blue);
				color: var(--chat-msg-user-text);
				border: none;
				padding: 10px 32px;
				border-radius: 10px;
				cursor: pointer;
				font-size: 14px;
				font-weight: 700;
				letter-spacing: .04em;
				text-transform: uppercase;
				transition: background .2s;
			}
			#password-gate .pw-btn:hover { background: var(--chat-blue-hover); }
			#password-error {
				color: var(--chat-red);
				font-size: 0.85em;
				min-height: 1.2em;
			}

			/* Chat area */
			#chat-area {
				display: none;
				flex-direction: column;
				flex: 1;
				min-height: 0;
			}
			#chat-area.active { display: flex; }

			#messages {
				flex: 1;
				overflow-y: auto;
				padding: 18px 20px;
				display: flex;
				flex-direction: column;
				gap: 12px;
				min-height: 0;
			}
			#messages::-webkit-scrollbar { width: 5px; }
			#messages::-webkit-scrollbar-thumb { background: var(--chat-blue-bg-strong); border-radius: 3px; }

			.msg {
				max-width: 85%;
				padding: 11px 16px;
				border-radius: 14px;
				font-size: 14.5px;
				line-height: 1.65;
				word-wrap: break-word;
				color: var(--chat-ink);
			}
			.msg.user {
				align-self: flex-end;
				background: var(--chat-blue);
				color: var(--chat-msg-user-text);
				border-bottom-right-radius: 4px;
				white-space: pre-wrap;
			}
			.msg.assistant {
				align-self: flex-start;
				max-width: 100%;
				background: none;
				color: var(--chat-ink);
				border: none;
				padding: 4px 40px;
				border-radius: 0;
			}
			.msg.assistant a { color: var(--chat-blue); text-decoration: underline; text-underline-offset: 2px; }
			.msg.assistant a:hover { color: var(--chat-blue-hover); }
			.msg.assistant strong { color: var(--chat-ink); font-weight: 700; }
			.msg.assistant em { font-style: italic; color: var(--chat-muted); }
			.msg.assistant h1, .msg.assistant h2, .msg.assistant h3, .msg.assistant h4 { color: var(--chat-ink); margin: 8px 0 4px; }
			.msg.assistant h1 { font-size: 16px; }
			.msg.assistant h2 { font-size: 15px; }
			.msg.assistant h3 { font-size: 14.5px; }
			.msg.assistant h4 { font-size: 14px; }
			.msg.assistant ul, .msg.assistant ol { margin: 4px 0; padding-left: 1.4em; }
			.msg.assistant li { margin: 2px 0; }
			.msg.assistant hr { border: none; border-top: 1px solid var(--chat-border); margin: 8px 0; }
			.msg.assistant blockquote {
				border-left: 3px solid var(--chat-blue-border); padding: 2px 0 2px 12px; margin: 6px 0;
				color: var(--chat-muted); font-style: italic;
			}
			.msg.assistant blockquote p { margin: 0; }
			.msg.assistant del { text-decoration: line-through; opacity: 0.6; }
			.msg.assistant table { border-collapse: collapse; margin: 6px 0; font-size: 13px; width: auto; }
			.msg.assistant th, .msg.assistant td { border: 1px solid var(--chat-border); padding: 5px 10px; text-align: left; background: var(--chat-input-bg); color: var(--chat-ink); }
			.msg.assistant th { background: var(--chat-blue-bg); font-weight: 700; color: var(--chat-ink); }
			.msg.assistant tbody tr:nth-child(even) td { background: var(--chat-msg-ai-bg); }
			.msg.assistant p { margin: 4px 0; }
			.msg.assistant pre.md-code {
				display: block; border: 1px solid var(--chat-border-soft);
				border-radius: 8px; padding: 10px 12px; margin: 6px 0;
				overflow-x: auto; line-height: 1.5; font-size: 13px;
				font-family: 'SF Mono','Fira Code',Consolas,monospace;
				background: #1e1e1e; color: #d4d4d4;
			}
			.msg.assistant pre.md-code code {
				font-family: inherit; font-size: inherit; background: none !important;
				padding: 0; border: none; color: inherit; white-space: pre; display: block;
			}
			.msg.assistant pre.md-code pre.shiki {
				margin: 0; padding: 0; border: none; border-radius: 0;
				background: none !important; overflow: visible;
			}
			.msg.assistant pre.md-code pre.shiki code {
				font-size: 0; line-height: 0;
			}
			.msg.assistant pre.md-code pre.shiki code .line {
				font-size: 13px; line-height: 1.5; display: block; min-height: 1em;
			}
			.msg.assistant .md-inline-code {
				background: var(--chat-blue-bg); padding: 1px 5px; border-radius: 3px; font-size: 13px;
				font-family: 'SF Mono','Fira Code',Consolas,monospace; color: var(--chat-blue);
				border: none;
			}
			.msg.assistant .katex-display { margin: 6px 0; overflow-x: auto; overflow-y: hidden; }
			.msg.assistant .katex { font-size: 1em; }
			.msg.error {
				align-self: flex-start;
				background: var(--chat-red-bg);
				color: var(--chat-red);
				border: 1px solid var(--chat-red-border);
				border-bottom-left-radius: 4px;
			}
			.msg.system {
				align-self: center;
				color: var(--chat-muted);
				font-size: 13px;
				background: none;
				padding: 4px;
				opacity: 0.7;
			}

			.msg.user img {
				max-width: 220px; max-height: 160px; border-radius: 8px; margin-top: 8px; display: block;
				border: 1px solid rgba(255,255,255,.2); object-fit: cover;
			}
			.msg.user .file-badge {
				display: flex; align-items: center; gap: 6px; margin-top: 8px;
				padding: 7px 12px; border-radius: 8px; font-size: 12px; font-weight: 600;
				background: rgba(255,255,255,.12); color: rgba(255,255,255,.85);
				border: 1px solid rgba(255,255,255,.15);
			}
			.msg.user .file-badge svg { width: 14px; height: 14px; flex-shrink: 0; opacity: .7; }

			/* File preview */
			#file-preview-bar {
				display: none; padding: 8px 16px; border-top: 1px solid var(--chat-border);
				background: var(--chat-msg-ai-bg); align-items: center; gap: 10px;
			}
			#file-preview-bar.active { display: flex; }
			#file-preview-bar img {
				max-height: 60px; max-width: 120px; border-radius: 6px;
				border: 1px solid var(--chat-border); object-fit: cover;
			}
			#file-preview-bar .file-icon {
				width: 36px; height: 36px; min-width: 36px; border-radius: 6px;
				background: var(--chat-blue-bg); border: 1px solid var(--chat-blue-border);
				display: flex; align-items: center; justify-content: center;
				color: var(--chat-blue); font-size: 11px; font-weight: 700; text-transform: uppercase;
			}
			#file-preview-bar .file-name {
				flex: 1; font-size: 12.5px; color: var(--chat-muted);
				overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
			}
			#file-remove {
				all: unset; box-sizing: border-box; cursor: pointer;
				color: var(--chat-muted); font-size: 18px; line-height: 1;
				width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
				border-radius: 50%; transition: all .15s;
			}
			#file-remove:hover { color: var(--chat-red); background: var(--chat-red-bg); }

			/* Thinking indicator: shimmering label until the first token, then a small "Thought for Ns" note */
			.msg.think { display: flex; flex-direction: column; gap: 6px; }
			.think-label {
				font-weight: 500; color: transparent; -webkit-background-clip: text; background-clip: text;
				background-image: linear-gradient(90deg, var(--chat-muted) 0%, var(--chat-blue-border) 50%, var(--chat-muted) 100%);
				background-size: 200% 100%; animation: think-shimmer 1.6s linear infinite;
			}
			@keyframes think-shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
			.thought { align-self: flex-start; padding: 0 40px; margin-bottom: -6px; font-size: 13px; color: var(--chat-muted); }

			/* Input */
			#input-row {
				display: flex;
				gap: 10px;
				padding: 12px 16px;
				border-top: 1px solid var(--chat-border);
				align-items: center;
				background: var(--chat-msg-ai-bg);
			}
			#chat-input {
				all: unset;
				box-sizing: border-box;
				flex: 1;
				background: var(--chat-input-bg);
				border: 1.5px solid var(--chat-border);
				color: var(--chat-ink);
				padding: 10px 14px;
				border-radius: 10px;
				font-size: 14.5px;
				font-family: inherit;
				resize: none;
				overflow: hidden;
				transition: border-color .15s;
				min-height: 44px;
				height: 44px;
			}
			#chat-input:focus { border-color: var(--chat-blue); }
			#chat-input::placeholder { color: var(--chat-muted) !important; opacity: 1 !important; -webkit-text-fill-color: var(--chat-muted); }
			#chat-input::-webkit-input-placeholder { color: var(--chat-muted); opacity: 1; -webkit-text-fill-color: var(--chat-muted); }
			#file-upload-btn {
				all: unset; box-sizing: border-box;
				cursor: pointer; color: var(--chat-muted);
				width: 44px; height: 44px; min-width: 44px;
				display: flex; align-items: center; justify-content: center;
				border-radius: 10px; border: 1.5px solid var(--chat-border);
				transition: all .15s; flex-shrink: 0;
			}
			#file-upload-btn:hover { color: var(--chat-blue); border-color: var(--chat-blue-border); background: var(--chat-blue-bg); }
			#file-upload-btn svg { width: 18px; height: 18px; }
			#send-btn {
				all: unset;
				box-sizing: border-box;
				background: var(--chat-blue);
				color: var(--chat-msg-user-text);
				border: none;
				width: 44px; height: 44px; min-width: 44px;
				border-radius: 10px;
				cursor: pointer;
				display: flex; align-items: center; justify-content: center;
				transition: background .2s;
				flex-shrink: 0;
			}
			#send-btn svg { width: 18px; height: 18px; fill: currentColor; }
			#send-btn:hover { background: var(--chat-blue-hover); }
			#send-btn:disabled { background: var(--chat-blue-bg-strong); color: var(--chat-muted); cursor: default; }
			#chat-footer-hint {
				text-align: center; font-size: 11.5px; color: var(--chat-crumb-sep);
				padding: 6px 16px 10px; background: var(--chat-msg-ai-bg);
				border-radius: 0 0 1.4rem 1.4rem;
			}

			@media screen and (max-width: 736px) {
				#main > * > .inner {
					width: 100% !important;
					max-width: 100vw !important;
					box-sizing: border-box !important;
					padding: 0.75rem 0 1rem 0 !important;
				}

				.chat-shell {
					gap: 0.6rem;
				}

				.chat-shell > header.major {
					display: none;
				}

				.chat-shell {
					border-radius: 0;
					border-left: none;
					border-right: none;
				}

				.chat-intro {
					padding: 0.5rem 1rem;
					flex-direction: column;
					align-items: flex-start;
