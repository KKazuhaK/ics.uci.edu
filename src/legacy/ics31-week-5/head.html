<style>
			:root {
				--crumb-blue: #24508f;
				--crumb-blue-bg: rgba(36, 80, 143, 0.10);
				--crumb-blue-border: rgba(36, 80, 143, 0.22);
				--crumb-blue-bg-strong: rgba(36, 80, 143, 0.17);
				--crumb-blue-dark: #183b73;

				--demo-ink: #23324a;
				--demo-muted: #64748b;
				--demo-card-bg: rgba(255, 255, 255, 0.98);
				--demo-card-bg-soft:
					radial-gradient(circle at bottom left, rgba(36, 80, 143, 0.05), transparent 16rem),
					rgba(255, 255, 255, 0.98);
				--demo-card-border: rgba(33, 82, 164, 0.14);
				--demo-card-shadow: 0 1.25rem 3rem rgba(23, 43, 77, 0.08);
				--demo-card-shadow-sm: 0 0.8rem 2rem rgba(23, 43, 77, 0.06);
				--demo-btn-bg: #f5f5f3;
				--demo-btn-bg-hover: #eaeae8;
				--demo-btn-border: #ccc;
				--demo-tab-border: #cdd5e0;
				--demo-input-border: #e0e4ea;
				--demo-input-bg: #f8f9fb;
				--demo-info-border: #ddd;
				--demo-info-bg: #f7f9fc;
				--demo-step-counter: #888;

				--demo-area: #854F0B;
				--demo-area-bg: #FAEEDA;
				--demo-group: #185FA5;
				--demo-group-bg: #E6F1FB;
				--demo-serial: #1D9E75;
				--demo-serial-bg: #E1F5EE;
				--demo-red: #C13B3B;
				--demo-red-bg: #FCE4E4;

				--color-text-primary: var(--demo-ink);
				--color-text-secondary: var(--demo-muted);
				--color-background-primary: var(--demo-input-bg);
				--color-background-secondary: var(--demo-info-bg);
			}

			html[data-theme="dark"] {
				--crumb-blue: #6aa3f5;
				--crumb-blue-bg: rgba(106, 163, 245, 0.15);
				--crumb-blue-border: rgba(106, 163, 245, 0.32);
				--crumb-blue-bg-strong: rgba(106, 163, 245, 0.24);
				--crumb-blue-dark: #a8c9ff;

				--demo-ink: #dde4f0;
				--demo-muted: #8c9cb5;
				--demo-card-bg: #181d26;
				--demo-card-bg-soft:
					radial-gradient(circle at bottom left, rgba(106, 163, 245, 0.08), transparent 16rem),
					#181d26;
				--demo-card-border: rgba(255, 255, 255, 0.08);
				--demo-card-shadow: 0 1.25rem 3rem rgba(0, 0, 0, 0.35);
				--demo-card-shadow-sm: 0 0.8rem 2rem rgba(0, 0, 0, 0.25);
				--demo-btn-bg: #1a1f28;
				--demo-btn-bg-hover: #232937;
				--demo-btn-border: rgba(255, 255, 255, 0.14);
				--demo-tab-border: rgba(255, 255, 255, 0.14);
				--demo-input-border: rgba(255, 255, 255, 0.08);
				--demo-input-bg: #181d26;
				--demo-info-border: rgba(255, 255, 255, 0.08);
				--demo-info-bg: #14181f;
				--demo-step-counter: #8892a6;

				--demo-area: #e8b97a;
				--demo-area-bg: rgba(232, 185, 122, 0.16);
				--demo-group: #7ab5ff;
				--demo-group-bg: rgba(122, 181, 255, 0.16);
				--demo-serial: #58d4b0;
				--demo-serial-bg: rgba(88, 212, 176, 0.16);
				--demo-red: #f28b8b;
				--demo-red-bg: rgba(242, 139, 139, 0.16);
			}

			main.page > .page-head.card {
				border-radius: var(--r-lg) var(--r-lg) 0 0;
				margin-bottom: 0;
				box-shadow: none;
				border: 1px solid var(--demo-card-border);
				border-bottom: 1px solid var(--demo-card-border);
				background: var(--demo-card-bg);
			}

			.demo-shell {
				display: grid;
				grid-template-columns: minmax(0, 1fr);
				gap: 1.5rem;
				font-size: 1em;
				line-height: 1.65;
				background: var(--demo-card-bg);
				border-radius: 0 0 var(--r-lg) var(--r-lg);
				padding: 1.5rem;
				border: 1px solid var(--demo-card-border);
				border-top: 0;
				min-width: 0;
			}
			.demo-shell, .demo-shell p, .demo-shell li, .demo-shell ul, .demo-shell ol, .demo-shell h2, .demo-shell h3 {
				color: var(--demo-ink);
			}

			.lab-desc {
				border: 1px solid var(--demo-card-border);
				border-radius: 1.3rem;
				background: var(--demo-card-bg-soft);
				box-shadow: var(--demo-card-shadow-sm);
				padding: 1.4rem 1.6rem;
			}
			.lab-desc h3 { margin-bottom: 0.5em; font-size: 1.1em; }
			.lab-desc p { margin: 0; font-size: 0.85em; line-height: 1.65; color: var(--demo-muted); }
			.lab-desc strong { color: var(--demo-ink); }

			.demo-widget {
				border: 1px solid var(--demo-card-border);
				border-radius: 1.3rem;
				background: var(--demo-card-bg);
				box-shadow: var(--demo-card-shadow);
				padding: 1.6rem 1.8rem;
				min-width: 0;
			}

			.step-toolbar {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 8px;
				margin-bottom: 20px;
				flex-wrap: wrap;
			}
			.step-btns { display: flex; gap: 6px; flex-wrap: wrap; }
			.step-nav { display: flex; align-items: center; gap: 6px; }
			.step-nav .step-counter { min-width: 2.5em; text-align: center; }

			.demo-widget button {
				padding: 8px 18px !important;
				border-radius: 6px !important;
				cursor: pointer;
				font-size: 0.85em !important;
				font-weight: 500 !important;
				text-transform: none !important;
				letter-spacing: normal !important;
				line-height: 1.5 !important;
				box-shadow: none !important;
				min-width: 0 !important;
				height: auto !important;
			}
			.step-nav button {
				border: 1px solid var(--demo-btn-border) !important;
				background: var(--demo-btn-bg) !important;
				color: var(--demo-ink) !important;
				padding: 6px 12px !important;
			}
			.step-nav button:hover { background: var(--demo-btn-bg-hover) !important; }
			.step-nav button.disabled { opacity: 0.35; cursor: default; pointer-events: none; }

			.input-display {
				margin-bottom: 18px;
				padding: 14px 18px;
				border: 1px solid var(--demo-input-border);
				border-radius: 8px;
				background: var(--demo-input-bg);
				font-size: 0.82em;
				line-height: 1.8;
			}
			.input-display .label { font-weight: 700; color: var(--crumb-blue); }
			.input-display code {
				background: var(--crumb-blue-bg);
				padding: 0.15em 0.45em;
				border-radius: 4px;
				font-size: 0.92em;
				color: var(--demo-ink);
			}

			/* ── n value + condition stage ── */
			.n-stage {
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 22px;
				margin-bottom: 18px;
				padding: 22px 0 14px;
				flex-wrap: wrap;
			}
			.n-card {
				display: inline-flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				min-width: 100px;
				padding: 14px 22px 16px;
				border: 2.5px solid var(--demo-group);
				border-radius: 14px;
				background: var(--demo-group-bg);
				font-family: 'JetBrains Mono', Consolas, monospace;
				transition: all 0.3s ease;
			}
			.n-card .nc-name {
				font-size: 0.78em;
				font-weight: 700;
				color: var(--demo-group);
				margin-bottom: 4px;
				letter-spacing: 0.08em;
			}
			.n-card .nc-val {
				font-size: 2.2em;
				font-weight: 800;
				line-height: 1;
				color: var(--demo-group);
			}
			.n-card.matched { border-color: var(--demo-serial); background: var(--demo-serial-bg); }
			.n-card.matched .nc-name, .n-card.matched .nc-val { color: var(--demo-serial); }

			.cond-box {
				display: inline-flex;
				flex-direction: column;
				align-items: center;
				gap: 6px;
				padding: 10px 18px;
				border: 2px dashed var(--demo-area);
				border-radius: 12px;
				background: var(--demo-area-bg);
				font-family: 'JetBrains Mono', Consolas, monospace;
			}
			.cond-box .cond-label {
				font-size: 0.7em;
				font-weight: 700;
				color: var(--demo-area);
				letter-spacing: 0.08em;
			}
			.cond-box .cond-expr { font-size: 0.92em; color: var(--demo-ink); font-weight: 700; }
			.cond-box .cond-result {
				font-size: 0.85em;
				font-weight: 800;
				padding: 2px 10px;
				border-radius: 6px;
			}
			.cond-box .cond-result.true { background: var(--demo-serial); color: #fff; }
			.cond-box .cond-result.false { background: var(--demo-red); color: #fff; }

			/* ── Char comparison row ── */
			.char-compare {
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 10px;
				flex-wrap: wrap;
				margin-bottom: 22px;
				padding: 6px 0 12px;
				font-family: 'JetBrains Mono', Consolas, monospace;
			}
			.cc-prefix {
				font-size: 0.95em;
				color: var(--demo-muted);
				font-weight: 600;
			}
			.cc-prefix .cc-str {
				color: var(--demo-ink);
				background: var(--demo-input-bg);
				border: 1px dashed var(--demo-tab-border);
				padding: 2px 8px;
				border-radius: 6px;
				margin-left: 4px;
			}
			.cc-arrow { color: var(--demo-muted); font-size: 1.1em; font-weight: 700; }
			.cc-char {
				display: inline-flex;
				flex-direction: column;
				align-items: center;
				gap: 3px;
				padding: 6px 12px 5px;
				border-radius: 10px;
				border: 2.5px solid;
				font-size: 1.4em;
				font-weight: 800;
				line-height: 1.1;
				min-width: 36px;
			}
			.cc-char .cc-sub {
				font-size: 0.45em;
				font-weight: 700;
				letter-spacing: 0.04em;
				opacity: 0.8;
			}
			.cc-char.tens { color: var(--demo-group); border-color: var(--demo-group); background: var(--demo-group-bg); }
			.cc-char.ones { color: var(--demo-area); border-color: var(--demo-area); background: var(--demo-area-bg); }
			.cc-op { font-size: 1.1em; font-weight: 800; color: var(--demo-muted); }
			.cc-result {
				padding: 4px 12px;
				border-radius: 7px;
				font-weight: 800;
				font-size: 0.92em;
			}
			.cc-result.true { background: var(--demo-serial); color: #fff; }
			.cc-result.false { background: var(--demo-red); color: #fff; }

			/* ── Output stream ── */
			.output-stream {
				border: 1px solid var(--demo-input-border);
				border-radius: 10px;
				background: #0d1117;
				color: #e6edf3;
				padding: 14px 18px;
				margin-bottom: 18px;
				font-family: 'JetBrains Mono', Consolas, monospace;
				font-size: 0.95em;
				line-height: 1.55;
				max-height: 220px;
				overflow-y: auto;
				min-height: 70px;
			}
			.output-stream .out-header {
				color: #7d8590;
				font-size: 0.78em;
				font-weight: 700;
				letter-spacing: 0.06em;
				text-transform: uppercase;
				margin-bottom: 6px;
				border-bottom: 1px solid #21262d;
				padding-bottom: 4px;
			}
			.output-stream .out-line { color: #d4d4d4; }
			.output-stream .out-line.fresh {
				color: #4EC9B0;
				font-weight: 700;
				animation: outFresh 0.35s ease;
			}
			.output-stream .out-line.match { color: #B5CEA8; font-weight: 800; }
			.output-stream .out-line.match::after {
				content: '  ← digits match!';
				color: #6A9955;
				font-style: italic;
				font-weight: 500;
				font-size: 0.85em;
			}
			.output-stream .out-empty { color: #484f58; font-style: italic; }
			@keyframes outFresh { from { background: rgba(78, 201, 176, 0.18); } to { background: transparent; } }

			/* ── Variable watch ── */
			.var-watch {
				background: #1e1e1e;
				border: 1px solid #333;
				border-radius: 8px;
				padding: 10px 0;
				margin-bottom: 20px;
				font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace;
				font-size: 0.82em;
				line-height: 1.7;
			}
			.var-watch .vw-header {
				padding: 0 14px 6px;
				font-size: 0.85em;
				font-weight: 600;
				color: #888;
				text-transform: uppercase;
				letter-spacing: 0.06em;
				border-bottom: 1px solid #2a2a2a;
				margin-bottom: 4px;
			}
			.var-watch .vw-row {
				padding: 2px 14px;
				display: flex;
				gap: 8px;
				color: #555;
				transition: all 0.2s ease;
			}
			.var-watch .vw-row.active { background: rgba(255, 255, 255, 0.04); }
			.var-watch .vw-row.active .vw-name { color: #9CDCFE; }
			.var-watch .vw-row.active .vw-eq { color: #D4D4D4; }
			.var-watch .vw-row.active .vw-val { color: #B5CEA8; }
			.var-watch .vw-row.active .vw-val.str { color: #CE9178; }
			.var-watch .vw-row.highlight {
				background: rgba(78, 201, 176, 0.1);
				border-left: 2px solid #4EC9B0;
				padding-left: 12px;
			}
			.var-watch .vw-row.highlight .vw-name { color: #4EC9B0; }
			.var-watch .vw-row.highlight .vw-val { color: #4EC9B0; font-weight: 600; }
			.var-watch .vw-name { min-width: 80px; color: #555; }
			.var-watch .vw-eq { color: #444; }
			.var-watch .vw-val { color: #555; }

			.info-panel {
				border: 1px solid var(--demo-info-border);
				border-radius: 10px;
				padding: 18px 22px;
				min-height: 130px;
				background: var(--demo-info-bg);
				font-size: 0.92em;
				line-height: 1.65;
			}
			.info-panel strong { color: var(--demo-ink); font-weight: 600; }
			.info-panel code {
				background: var(--crumb-blue-bg);
				padding: 0.15em 0.4em;
				border-radius: 4px;
				color: var(--crumb-blue);
				font-size: 0.92em;
			}
			.info-panel em { color: var(--demo-muted); }

			.step-counter { font-size: 0.85em; color: var(--demo-step-counter); }

			/* ── Method comparison block (used in final step) ── */
			.method-cmp {
				display: grid;
				grid-template-columns: repeat(2, minmax(0, 1fr));
				gap: 10px;
				margin: 10px 0 6px;
			}
			.method-cmp .mc-card {
				border: 1px solid var(--demo-card-border);
				border-radius: 10px;
				background: var(--demo-card-bg);
				padding: 12px 14px;
				font-family: 'JetBrains Mono', Consolas, monospace;
				font-size: 1em;
				line-height: 1.55;
			}
			.method-cmp .mc-tag {
				display: inline-block;
				font-size: 0.72em;
				font-weight: 700;
				letter-spacing: 0.06em;
				text-transform: uppercase;
				padding: 2px 8px;
				border-radius: 5px;
				margin-bottom: 6px;
			}
			.method-cmp .mc-card.primary .mc-tag { background: var(--demo-group-bg); color: var(--demo-group); }
			.method-cmp .mc-card.alt .mc-tag { background: var(--demo-area-bg); color: var(--demo-area); }
			@media screen and (max-width: 600px) {
				.method-cmp { grid-template-columns: 1fr; }
			}

			/* ── Method toggle ── */
			.method-toggle {
				display: flex;
				align-items: center;
				gap: 10px;
				margin-bottom: 16px;
				padding: 10px 14px;
				background: var(--demo-input-bg);
				border: 1px solid var(--demo-input-border);
				border-radius: 10px;
				flex-wrap: wrap;
			}
			.mt-label {
				font-size: 0.78em;
				font-weight: 700;
				letter-spacing: 0.06em;
				text-transform: uppercase;
				color: var(--demo-muted);
			}
			.mt-group {
				display: inline-flex;
				background: var(--demo-card-bg);
				border: 1px solid var(--demo-tab-border);
				border-radius: 8px;
				padding: 3px;
				gap: 2px;
			}
			.mt-btn {
				padding: 6px 14px !important;
				border-radius: 6px !important;
				border: 0 !important;
				background: transparent !important;
				color: var(--demo-muted) !important;
				cursor: pointer;
				font-size: 0.88em !important;
				font-weight: 600 !important;
				font-family: inherit !important;
				letter-spacing: normal !important;
				text-transform: none !important;
				line-height: 1.4 !important;
				box-shadow: none !important;
				transition: background 0.18s ease, color 0.18s ease;
			}
			.mt-btn:hover { color: var(--crumb-blue) !important; }
			.mt-btn.active {
				background: var(--crumb-blue) !important;
				color: #fff !important;
			}
			html[data-theme="dark"] .mt-btn.active { color: #0a0d12 !important; }
			.mt-hint {
				font-size: 0.82em;
				color: var(--demo-muted);
				margin-left: auto;
			}
			@media screen and (max-width: 520px) {
				.mt-hint { margin-left: 0; flex-basis: 100%; }
			}

			/* ── Lab selector tabs (top-of-shell) ── */
			.lab-tabs {
				display: flex;
				gap: 6px;
				flex-wrap: wrap;
				border: 1px solid var(--demo-card-border);
				border-radius: 1.3rem;
				background: var(--demo-card-bg);
				box-shadow: var(--demo-card-shadow);
				padding: 0.8rem 1rem;
			}
			.lab-tab {
				display: inline-flex;
				align-items: center;
				gap: 0.5em;
				padding: 0.6em 1.15em;
				border-radius: 0.7em;
				font-size: 0.92em;
				font-weight: 700;
				cursor: pointer;
				border: 1.5px solid var(--demo-tab-border);
				background: transparent;
				color: var(--demo-muted);
				transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
				user-select: none;
				text-transform: none !important;
				letter-spacing: normal !important;
			}
			.lab-tab:hover { background: var(--crumb-blue-bg); color: var(--crumb-blue); }
			.lab-tab.active {
				background: var(--crumb-blue);
				border-color: var(--crumb-blue);
				color: var(--demo-card-bg);
				box-shadow: 0 2px 8px rgba(36, 80, 143, 0.2);
			}
			html[data-theme="dark"] .lab-tab.active { color: #0a0d12; }
			.lab-tab.active:hover { background: var(--crumb-blue-dark); }
			.lab-tab .tab-lab {
				font-size: 0.75em;
				font-weight: 600;
				text-transform: uppercase;
				letter-spacing: 0.04em;
				opacity: 0.5;
			}
			.lab-tab.active .tab-lab { opacity: 0.65; }
			.lab-tab .tab-title { font-weight: 700; }

			.lab-panel { display: none; }
			.lab-panel.active {
				display: grid;
				grid-template-columns: minmax(0, 1fr);
				gap: 1.5rem;
				min-width: 0;
			}

			/* ── Input queue (Lab 5.19) ── */
			.input-queue {
				border: 1px solid var(--demo-input-border);
				border-radius: 10px;
				background: var(--demo-input-bg);
				padding: 14px 18px;
				margin-bottom: 18px;
			}
			.iq-header {
				display: flex;
				align-items: center;
				justify-content: space-between;
				font-size: 0.78em;
				font-weight: 700;
				letter-spacing: 0.06em;
				text-transform: uppercase;
				color: var(--demo-muted);
				margin-bottom: 8px;
			}
			.iq-header .iq-counter { font-weight: 600; letter-spacing: 0; text-transform: none; }
			.iq-list { display: flex; flex-direction: column; gap: 5px; }
			.iq-row {
				display: flex;
				align-items: center;
				gap: 10px;
				padding: 6px 12px;
				border-radius: 7px;
				font-family: 'JetBrains Mono', Consolas, monospace;
				font-size: 0.92em;
				transition: all 0.25s ease;
				background: transparent;
				border: 1.5px dashed transparent;
			}
			.iq-marker {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				width: 18px;
				height: 18px;
				border-radius: 50%;
				font-size: 0.75em;
				font-weight: 800;
				flex-shrink: 0;
			}
			.iq-row.pending { color: var(--demo-muted); }
			.iq-row.pending .iq-marker {
				background: transparent;
				border: 1.5px dashed var(--demo-tab-border);
				color: var(--demo-muted);
			}
			.iq-row.active {
				color: var(--crumb-blue);
				background: var(--crumb-blue-bg);
				border-color: var(--crumb-blue);
