<script>
			function keepScroll(fn) {
				var y = window.scrollY;
				fn();
				window.scrollTo(0, y);
			}

			function escHtml(s) {
				return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
			}

			/* ── Lab tabs (top-level lab selector) ── */
			var labs = [
				{ id: '5_18', lab: 'Lab 5.18', title: 'Countdown Until Matching Digits' },
				{ id: '5_19', lab: 'Lab 5.19', title: 'Mad Lib (sentinel loop)' }
			];
			var visibleLabs = labs.filter(function (l) { return !l.hidden; });
			var activeLab = visibleLabs[0].id;

			function renderLabTabs() {
				var el = document.getElementById('lab-tabs');
				var html = '';
				for (var i = 0; i < visibleLabs.length; i++) {
					var l = visibleLabs[i];
					var isActive = l.id === activeLab;
					html += '<button class="lab-tab' + (isActive ? ' active' : '') + '" onclick="switchLab(\'' + l.id + '\')">';
					html += '<span class="tab-lab">' + l.lab + '</span><span class="tab-title">' + l.title + '</span>';
					html += '</button>';
				}
				el.innerHTML = html;
			}

			function switchLab(id, updateHash) {
				activeLab = id;
				renderLabTabs();
				var panels = document.querySelectorAll('.lab-panel');
				for (var i = 0; i < panels.length; i++) panels[i].classList.remove('active');
				var p = document.getElementById('panel-' + id);
				if (p) p.classList.add('active');
				if (updateHash !== false) history.replaceState(null, '', '#lab-' + id);
			}

			function labFromHash() {
				var h = location.hash.replace('#lab-', '');
				for (var i = 0; i < visibleLabs.length; i++) if (visibleLabs[i].id === h) return h;
				return visibleLabs[0].id;
			}

			renderLabTabs();
			switchLab(labFromHash(), false);
			window.addEventListener('hashchange', function () { switchLab(labFromHash(), false); });

			/* ── Python syntax highlighter (VS Code Dark+) ── */
			function highlightPy(code) {
				var tokens = [], i = 0, src = code;
				var keywords = ['if','else','elif','for','while','def','return','import','from','as','class','try','except','finally','with','in','not','and','or','is','True','False','None','pass','break','continue','lambda','del','global','nonlocal','yield','assert','raise'];
				var builtins = ['print','len','find','int','str','float','range','input','type','list','dict','set','tuple','abs','max','min','sum','sorted','enumerate','zip','map','filter','open','round','format','isinstance','hasattr','getattr','setattr','split','replace','remove','append'];

				while (i < src.length) {
					if (src[i] === '#') {
						var end = src.indexOf('\n', i);
						if (end === -1) end = src.length;
						tokens.push('<span style="color:#6A9955">' + escHtml(src.slice(i, end)) + '</span>');
						i = end; continue;
					}
					if (src[i] === '"' || src[i] === "'") {
						var q = src[i], j = i + 1;
						while (j < src.length && src[j] !== q) { if (src[j] === '\\') j++; j++; }
						j = Math.min(j + 1, src.length);
						tokens.push('<span style="color:#CE9178">' + escHtml(src.slice(i, j)) + '</span>');
						i = j; continue;
					}
					if (/[0-9]/.test(src[i]) && (i === 0 || /[\s=+\-*/%<>!,([\]:]/.test(src[i-1]))) {
						var j = i;
						while (j < src.length && /[0-9.]/.test(src[j])) j++;
						tokens.push('<span style="color:#B5CEA8">' + escHtml(src.slice(i, j)) + '</span>');
						i = j; continue;
					}
					if (/[a-zA-Z_]/.test(src[i])) {
						var j = i;
						while (j < src.length && /[a-zA-Z0-9_]/.test(src[j])) j++;
						var word = src.slice(i, j);
						if (keywords.indexOf(word) !== -1) tokens.push('<span style="color:#C586C0">' + escHtml(word) + '</span>');
						else if (builtins.indexOf(word) !== -1 && j < src.length && src[j] === '(') tokens.push('<span style="color:#DCDCAA">' + escHtml(word) + '</span>');
						else if (i > 0 && src[i-1] === '.') {
							if (j < src.length && src[j] === '(') tokens.push('<span style="color:#DCDCAA">' + escHtml(word) + '</span>');
							else tokens.push('<span style="color:#9CDCFE">' + escHtml(word) + '</span>');
						} else tokens.push('<span style="color:#9CDCFE">' + escHtml(word) + '</span>');
						i = j; continue;
					}
					if ('=!<>+-*/%'.indexOf(src[i]) !== -1) {
						var op = src[i];
						if (i + 1 < src.length && (src.slice(i, i+2) === '//' || src.slice(i, i+2) === '==' || src.slice(i, i+2) === '!=' || src.slice(i, i+2) === '<=' || src.slice(i, i+2) === '>=' || src.slice(i, i+2) === '-=' || src.slice(i, i+2) === '+=')) op = src.slice(i, i+2);
						tokens.push('<span style="color:#D4D4D4">' + escHtml(op) + '</span>');
						i += op.length; continue;
					}
					if (src[i] === '\n') { tokens.push('<br>'); i++; }
					else if (src[i] === ' ') {
						var j = i;
						while (j < src.length && src[j] === ' ') j++;
						tokens.push(new Array(j - i + 1).join('&nbsp;'));
						i = j;
					} else { tokens.push('<span style="color:#D4D4D4">' + escHtml(src[i]) + '</span>'); i++; }
				}
				return tokens.join('');
			}

			/* ── Render helpers ── */
			function renderVarWatch(elId, vars) {
				var html = '<div class="vw-header">Variables</div>';
				for (var i = 0; i < vars.length; i++) {
					var v = vars[i];
					var cls = 'vw-row' + (v.highlight ? ' highlight' : ' active');
					html += '<div class="' + cls + '">';
					html += '<span class="vw-name">' + v.name + '</span>';
					html += '<span class="vw-eq">=</span>';
					html += '<span class="vw-val' + (v.type === 'str' ? ' str' : '') + '">' + escHtml(v.val) + '</span>';
					html += '</div>';
				}
				document.getElementById(elId).innerHTML = html;
			}

			function renderInfoPanel(elId, title, code, note) {
				document.getElementById(elId).innerHTML =
					'<p style="font-size:1.05em;font-weight:600;margin:0 0 10px;color:var(--color-text-primary)">' + title + '</p>' +
					'<div style="font-family:\'JetBrains Mono\',Consolas,\'Courier New\',monospace;font-size:1.02em;background:#1e1e1e;border:1px solid #333;border-radius:7px;padding:14px 18px;margin-bottom:12px;line-height:1.6">' + highlightPy(code) + '</div>' +
					'<div style="font-size:0.95em;color:var(--color-text-secondary);margin:0;line-height:1.65">' + note + '</div>';
			}

			function paintStepBtns(prefix, total, n, color, bg) {
				for (var i = 0; i < total; i++) {
					var b = document.getElementById(prefix + '-b' + i);
					if (!b) continue;
					if (i === n) {
						b.style.border = '1px solid ' + color;
						b.style.background = bg;
						b.style.color = color;
						b.style.fontWeight = '500';
					} else {
						b.style.border = '1px solid #ccc';
						b.style.background = 'var(--demo-btn-bg)';
						b.style.color = 'var(--demo-muted)';
						b.style.fontWeight = '400';
					}
				}
			}
			function paintNav(prefix, n, total) {
				document.getElementById(prefix + '-counter').textContent = (n + 1) + ' / ' + total;
				document.getElementById(prefix + '-prev').className = n === 0 ? 'disabled' : '';
				document.getElementById(prefix + '-next').className = n === total - 1 ? 'disabled' : '';
			}

			function nStageHTML(name, val, matched, condExpr, condResult) {
				var html = '<div class="n-card' + (matched ? ' matched' : '') + '">';
				html += '<span class="nc-name">' + name + '</span>';
				html += '<span class="nc-val">' + escHtml(val) + '</span>';
				html += '</div>';
				if (condExpr) {
					html += '<div class="cond-box">';
					html += '<span class="cond-label">CONDITION</span>';
					html += '<span class="cond-expr">' + escHtml(condExpr) + '</span>';
					if (condResult !== undefined) {
						html += '<span class="cond-result ' + (condResult ? 'true' : 'false') + '">' + (condResult ? 'True' : 'False') + '</span>';
					}
					html += '</div>';
				}
				return html;
			}

			function compareRowHTML(method, nVal) {
				if (nVal === null || nVal === undefined) return '';
				var n = Number(nVal);
				if (isNaN(n)) return '';
				var html = '';
				if (method === 'string') {
					var s = String(n);
					if (s.length < 2) return '';
					var a = s[0], b = s[s.length - 1];
					var equal = (a === b);
					html += '<span class="cc-prefix">str(n) =<span class="cc-str">\'' + escHtml(s) + '\'</span></span>';
					html += '<span class="cc-arrow">→</span>';
					html += '<span class="cc-char tens">\'' + escHtml(a) + '\'<span class="cc-sub">str(n)[0]</span></span>';
					html += '<span class="cc-op">' + (equal ? '==' : '!=') + '</span>';
					html += '<span class="cc-char ones">\'' + escHtml(b) + '\'<span class="cc-sub">str(n)[' + (s.length - 1) + ']</span></span>';
					html += '<span class="cc-arrow">→</span>';
					var condTrue = !equal;
					html += '<span class="cc-result ' + (condTrue ? 'true' : 'false') + '">' + (condTrue ? 'True' : 'False') + '</span>';
				} else { // math
					var tens = Math.floor(n / 10);
					var ones = n % 10;
					var equal = (tens === ones);
					html += '<span class="cc-prefix">n =<span class="cc-str">' + escHtml(n) + '</span></span>';
					html += '<span class="cc-arrow">→</span>';
					html += '<span class="cc-char tens">' + escHtml(tens) + '<span class="cc-sub">n // 10</span></span>';
					html += '<span class="cc-op">' + (equal ? '==' : '!=') + '</span>';
					html += '<span class="cc-char ones">' + escHtml(ones) + '<span class="cc-sub">n % 10</span></span>';
					html += '<span class="cc-arrow">→</span>';
					var condTrue = !equal;
					html += '<span class="cc-result ' + (condTrue ? 'true' : 'false') + '">' + (condTrue ? 'True' : 'False') + '</span>';
				}
				return html;
			}

			function outputHTML(lines, freshIdx, matchIdx) {
				var html = '<div class="out-header">stdout</div>';
				if (!lines.length) {
					html += '<div class="out-empty">(no output yet)</div>';
					return html;
				}
				for (var i = 0; i < lines.length; i++) {
					var l = lines[i];
					var cls = 'out-line';
					if (i === matchIdx) cls += ' match';
					else if (i === freshIdx) cls += ' fresh';
					html += '<div class="' + cls + '">' + escHtml(l.text) + '</div>';
				}
				return html;
			}

			/* ── Steps ── */

			var cdMethod = 'string';

							'<br><strong>\'9\' != \'3\' is True</strong> → enter the body: <code>print(93)</code> emits 93, then <code>n -= 1</code> drops <code>n</code> to 92. Control jumps back to the top of the loop to re-check.',

						cond: 'n // 10 != n % 10', condResult: true

				},

					output: [{ text: '93' }, { text: '92' }], freshIdx: 1, matchIdx: -1,

						'<br><br><strong>Two natural ways to ask that question</strong> in Python &mdash; toggle the demo above to see each one trace through the same iterations:' +

							'<div class="mc-card primary">' +
								'<span class="mc-tag">Method · string</span>' +
								'<div>' + highlightPy('str(n)[0] != str(n)[1]') + '</div>' +
								'<div style="color:var(--demo-muted);font-size:0.92em;margin-top:4px">Treat <code>n</code> as a string of characters: index <code>[0]</code> is the first, <code>[1]</code> is the last.</div>' +
							'</div>' +
							'<div class="mc-card alt">' +
								'<span class="mc-tag">Method · math</span>' +
								'<div>' + highlightPy('n // 10 != n % 10') + '</div>' +
								'<div style="color:var(--demo-muted);font-size:0.92em;margin-top:4px"><code>// 10</code> drops the ones place (leaves the tens digit); <code>% 10</code> keeps only the ones digit.</div>' +
							'</div>' +
						'</div>' +
						'<strong>Worth thinking about</strong> (not telling you the answer &mdash; try them on paper first):' +
						'<ul style="margin:6px 0 0 18px;padding:0;font-size:0.95em">' +
							'<li><strong>n = 11</strong>: what does the loop do on the very first check? How many lines get printed?</li>' +
							'<li><strong>n = 100</strong>: <code>str(100)</code> has three characters &mdash; do <code>[0]</code> and <code>[1]</code> still pick the right ones? What about the math version?</li>' +
							'<li><strong>n = 9</strong> or <strong>n = 200</strong>: which branch handles these, and what does the program print?</li>' +
						'</ul>',
					cond: null, condResult: undefined,
					nVal: '88', matched: true,
					showCompare: false,
					output: [{ text: '93' }, { text: '92' }, { text: '91' }, { text: '90' }, { text: '89' }, { text: '88' }], freshIdx: -1, matchIdx: 5,
					vars: [{ name: 'n', val: '88' }],
					color: 'var(--demo-serial)', bg: 'var(--demo-serial-bg)'
				}
			];

			function pick(s, key) {
				if (s[cdMethod] && s[cdMethod][key] !== undefined) return s[cdMethod][key];
				return s[key];
			}

			function setCdMethod(m) {
				if (m !== 'string' && m !== 'math') return;
				cdMethod = m;
				var btns = document.querySelectorAll('#panel-5_18 .mt-btn');
				for (var i = 0; i < btns.length; i++) {
					btns[i].classList.toggle('active', btns[i].dataset.method === m);
				}
				document.getElementById('cd-method-hint').textContent =
					m === 'string' ? 'str(n)[0] != str(n)[1]' : 'n // 10 != n % 10';
				cdGo(cdCur);
			}

			function cdGo(n) {
				if (n < 0 || n >= cdSteps.length) return;
				keepScroll(function () { _cdGo(n); });
			}
			function _cdGo(n) {
				cdCur = n;
				var s = cdSteps[n], total = cdSteps.length;
				paintStepBtns('cd', total, n, s.color, s.bg);
				document.getElementById('cd-stage').innerHTML =
					nStageHTML('n', s.nVal, s.matched, pick(s, 'cond'), pick(s, 'condResult'));
				var charsEl = document.getElementById('cd-chars');
				if (s.showCompare) {
					charsEl.style.display = '';
					charsEl.innerHTML = compareRowHTML(cdMethod, s.compareN);
				} else {
					charsEl.style.display = 'none';
					charsEl.innerHTML = '';
				}
				document.getElementById('cd-output').innerHTML = outputHTML(s.output, s.freshIdx, s.matchIdx);
				renderVarWatch('cd-vars', s.vars);
				renderInfoPanel('cd-info', pick(s, 'title'), pick(s, 'code'), pick(s, 'note'));
				paintNav('cd', n, total);
			}
			cdGo(0);

			/* ══════════════════════════════════════════ */
			/*  Lab 5.19 — Mad Lib (sentinel loop)        */
			/* ══════════════════════════════════════════ */
			var mlCur = 0;
			var mlMethod = 'split-index';

			// Conceptual stdin queue. The trace consumes them top-to-bottom.
			var mlQueue = [
				{ raw: 'apples 5', word: 'apples', num: '5' },
				{ raw: 'shoes 2',  word: 'shoes',  num: '2' },
				{ raw: 'quit 0',   word: 'quit',   num: '0' }
			];

			function mlPick(s, key) {
				if (s[mlMethod] && s[mlMethod][key] !== undefined) return s[mlMethod][key];
				return s[key];
			}

			function setMlMethod(m) {
				if (m !== 'split-index' && m !== 'unpack') return;
				mlMethod = m;
				var btns = document.querySelectorAll('#panel-5_19 .mt-btn');
				for (var i = 0; i < btns.length; i++) {
					btns[i].classList.toggle('active', btns[i].dataset.method === m);
				}
				document.getElementById('ml-method-hint').textContent =
					m === 'split-index' ? "while line.split()[0] != 'quit':" : "while word != 'quit':";
				mlGo(mlCur);
			}

			function mlQueueHTML(consumed, activeIdx, sentinelHit) {
				var html = '<div class="iq-header"><span>Stdin queue</span><span class="iq-counter">' +
					Math.min(consumed, mlQueue.length) + ' of ' + mlQueue.length + ' read</span></div>';
				html += '<div class="iq-list">';
				for (var i = 0; i < mlQueue.length; i++) {
					var cls = 'iq-row';
					var marker;
					if (i === activeIdx) {
						cls += sentinelHit ? ' sentinel-hit' : ' active';
						marker = sentinelHit ? '✕' : '▸';
					} else if (i < consumed) {
						cls += ' consumed';
						marker = '✓';
					} else {
						cls += ' pending';
						marker = String(i + 1);
					}
					html += '<div class="' + cls + '">';
					html += '<span class="iq-marker">' + marker + '</span>';
					html += '<span class="iq-text">' + escHtml(mlQueue[i].raw) + '</span>';
					html += '</div>';
				}
				html += '</div>';
				return html;
			}

			function mlTokensHTML(method, item, isSentinel) {
				if (!item) return '<div class="ts-empty">(no line read yet)</div>';
				var w = item.word, num = item.num;
				var html = '';
				if (method === 'split-index') {
					html += '<div class="ts-line">';
					html += '<span class="ts-name">line</span><span class="ts-eq">=</span>';
					html += '<span class="ts-val">\'' + escHtml(item.raw) + '\'</span>';
					html += '</div>';
					html += '<span class="ts-arrow">↓ <code>line.split()</code></span>';
					html += '<div class="ts-tokens">';
					html += '<span class="ts-tok idx-0' + (isSentinel ? ' sentinel' : '') + '">\'' + escHtml(w) + '\'<span class="ts-idx">[0]</span></span>';
					html += '<span class="ts-tok idx-1 dim">\'' + escHtml(num) + '\'<span class="ts-idx">[1]</span></span>';
					html += '</div>';
				} else { // unpack
					html += '<div class="ts-line">';
					html += '<span class="ts-name">input()</span><span class="ts-eq">=</span>';
					html += '<span class="ts-val">\'' + escHtml(item.raw) + '\'</span>';
					html += '</div>';
					html += '<span class="ts-arrow">↓ <code>.split()</code> then unpack</span>';
					html += '<div class="unpack-row">';
					html += '<span class="up-pair"><span class="up-name">word =</span>\'' + escHtml(w) + '\'</span>';
					html += '<span class="up-pair"><span class="up-name">num =</span>\'' + escHtml(num) + '\'</span>';
					html += '</div>';
				}
				return html;
			}

			var mlSteps = [
				{
					// Priming read: read the FIRST line BEFORE the loop
					nVal: 'apples 5', cond: null, condResult: undefined, matched: false,
					queueConsumed: 1, queueActive: 0, sentinelHit: false,
					tokensItem: mlQueue[0], tokensSentinel: false,
					output: [], freshIdx: -1, matchIdx: -1,
					color: 'var(--demo-group)', bg: 'var(--demo-group-bg)',
					'split-index': {
						title: 'Step 1 — Priming read: grab the FIRST line before the loop',
						code: 'line = input()    # ← reads "apples 5" from stdin',
						note: 'A <code>while</code> loop checks its condition <em>before</em> the first iteration. So we need a value to check &mdash; we read the first line into <code>line</code> <strong>before the loop starts</strong>. This is called the <strong>priming read</strong>.' +
							'<br>Without it, the loop has nothing to look at on its first check.',
						vars: [{ name: 'line', val: "'apples 5'", type: 'str', highlight: true }]
					},
					unpack: {
						title: 'Step 1 — Priming read: grab the FIRST line and unpack it',
						code: 'word, num = input().split()    # word=\'apples\', num=\'5\'',
						note: 'A <code>while</code> loop checks its condition <em>before</em> the first iteration. So we need values to check — we read the first line and <strong>unpack it</strong> directly into <code>word</code> and <code>num</code>. This is the <strong>priming read</strong>.' +
							'<br><code>input().split()</code> returns the list <code>[\'apples\', \'5\']</code>; tuple unpacking assigns each piece to a name in one go.',
						vars: [
							{ name: 'word', val: "'apples'", type: 'str', highlight: true },
							{ name: 'num',  val: "'5'",      type: 'str', highlight: true }
						]
					}
				},
				{
					// Iter 1: condition True → print → read NEXT line
					nVal: 'shoes 2', matched: false,
					queueConsumed: 2, queueActive: 1, sentinelHit: false,
					tokensItem: mlQueue[0], tokensSentinel: false,
					output: [{ text: 'Eating 5 apples a day keeps you happy and healthy.' }],
					freshIdx: 0, matchIdx: -1,
					color: 'var(--demo-group)', bg: 'var(--demo-group-bg)',
					'split-index': {
						title: 'Step 2 — Iteration 1: \'apples\' != \'quit\' → True. Print, then read next.',
						code: "while line.split()[0] != 'quit':    # 'apples' != 'quit' → True\n    word = line.split()[0]            # 'apples'\n    num = line.split()[1]             # '5'\n    print(f'Eating {num} {word} a day keeps you happy and healthy.')\n    line = input()                    # ← grabs the NEXT line: 'shoes 2'",
						note: 'Check the condition: index <code>[0]</code> of <code>line.split()</code> is the first token, <code>\'apples\'</code>. <code>\'apples\' != \'quit\'</code> is <strong>True</strong> → enter the body.' +
							'<br>Inside the body: pull <code>word</code> and <code>num</code> out of the split, build the f-string, then <strong>read the next line</strong> at the bottom &mdash; that gives the loop a fresh value to check next time.',
						cond: "line.split()[0] != 'quit'", condResult: true,
						vars: [{ name: 'line', val: "'shoes 2'", type: 'str', highlight: true, hint: '(after the bottom-of-loop input())' }]
					},
					unpack: {
						title: 'Step 2 — Iteration 1: \'apples\' != \'quit\' → True. Print, then read next.',
						code: "while word != 'quit':    # 'apples' != 'quit' → True\n    print(f'Eating {num} {word} a day keeps you happy and healthy.')\n    word, num = input().split()    # ← reads NEXT line, unpacks into 'shoes', '2'",
						note: 'Check the condition: <code>word</code> is <code>\'apples\'</code>, not <code>\'quit\'</code> → <strong>True</strong> → enter the body.' +
							'<br>Print the sentence, then <strong>read the next line and unpack again</strong>. Each iteration overwrites <code>word</code> and <code>num</code> with the next pair.',
						cond: "word != 'quit'", condResult: true,
						vars: [
							{ name: 'word', val: "'shoes'", type: 'str', highlight: true },
							{ name: 'num',  val: "'2'",     type: 'str', highlight: true }
						]
					}
				},
				{
					// Iter 2: condition True → print → read NEXT line (the sentinel)
					nVal: 'quit 0', matched: false,
					queueConsumed: 3, queueActive: 2, sentinelHit: false,
					tokensItem: mlQueue[1], tokensSentinel: false,
					output: [
						{ text: 'Eating 5 apples a day keeps you happy and healthy.' },
						{ text: 'Eating 2 shoes a day keeps you happy and healthy.' }
					],
					freshIdx: 1, matchIdx: -1,
					color: 'var(--demo-group)', bg: 'var(--demo-group-bg)',
					'split-index': {
						title: 'Step 3 — Iteration 2: \'shoes\' != \'quit\' → True. Print, then read \'quit 0\'.',
						code: "while line.split()[0] != 'quit':    # 'shoes' != 'quit' → True\n    word = line.split()[0]            # 'shoes'\n    num = line.split()[1]             # '2'\n    print(f'Eating {num} {word} a day keeps you happy and healthy.')\n    line = input()                    # ← reads the sentinel line: 'quit 0'",
						note: 'Same pattern as before. The first token is now <code>\'shoes\'</code>, still not <code>\'quit\'</code> → loop continues.' +
							'<br>The bottom-of-loop <code>input()</code> reads <code>\'quit 0\'</code> — the sentinel line. The <strong>condition is not checked yet</strong> &mdash; it’ll happen at the top of the next iteration.',
						cond: "line.split()[0] != 'quit'", condResult: true,
						vars: [{ name: 'line', val: "'quit 0'", type: 'str', highlight: true, hint: '(sentinel line — about to be checked)' }]
					},
					unpack: {
						title: 'Step 3 — Iteration 2: \'shoes\' != \'quit\' → True. Print, then read \'quit 0\'.',
						code: "while word != 'quit':    # 'shoes' != 'quit' → True\n    print(f'Eating {num} {word} a day keeps you happy and healthy.')\n    word, num = input().split()    # reads 'quit 0' → word='quit', num='0'",
						note: 'Same pattern. <code>word</code> is <code>\'shoes\'</code>, still not <code>\'quit\'</code> → loop continues.' +
							'<br>The unpack at the bottom of the body reads <code>\'quit 0\'</code> and assigns <code>word=\'quit\'</code>, <code>num=\'0\'</code>. <strong>Note: <code>num</code> just gets a value here too &mdash; even though we won’t use it, the unpack still requires both names.</strong> The condition will be checked at the top of the next iteration.',
						cond: "word != 'quit'", condResult: true,
						vars: [
							{ name: 'word', val: "'quit'", type: 'str', highlight: true },
							{ name: 'num',  val: "'0'",    type: 'str', highlight: true, hint: '(read but never used)' }
						]
					}
				},
				{
					// Iter 3 attempt: condition False → loop exits
					nVal: 'quit 0', matched: true,
					queueConsumed: 3, queueActive: 2, sentinelHit: true,
					tokensItem: mlQueue[2], tokensSentinel: true,
					output: [
						{ text: 'Eating 5 apples a day keeps you happy and healthy.' },
						{ text: 'Eating 2 shoes a day keeps you happy and healthy.' }
					],
					freshIdx: -1, matchIdx: -1,
					color: 'var(--demo-serial)', bg: 'var(--demo-serial-bg)',
					'split-index': {
						title: 'Step 4 — Sentinel hit: \'quit\' != \'quit\' → False. Loop exits.',
						code: "while line.split()[0] != 'quit':    # 'quit' != 'quit' → False!\n    word = line.split()[0]\n    num = line.split()[1]\n    print(f'Eating {num} {word} a day keeps you happy and healthy.')\n    line = input()\n# ← control jumps here, body NEVER ran for 'quit 0'",
						note: 'Now the first token of <code>line.split()</code> is <code>\'quit\'</code>. <code>\'quit\' != \'quit\'</code> is <strong>False</strong> &mdash; the body is skipped entirely.' +
							'<br>That’s why the sentinel’s integer (the <code>0</code>) doesn’t affect output: by the time we’d normally pull <code>num</code> and print, we’ve already exited the loop. The <code>0</code> is sitting in <code>line</code> but the <code>print</code> never runs.',
						cond: "line.split()[0] != 'quit'", condResult: false,
						vars: [{ name: 'line', val: "'quit 0'", type: 'str', hint: '(loop exited — body did not run for this line)' }]
					},
					unpack: {
						title: 'Step 4 — Sentinel hit: \'quit\' != \'quit\' → False. Loop exits.',
						code: "while word != 'quit':    # 'quit' != 'quit' → False!\n    print(f'Eating {num} {word} a day keeps you happy and healthy.')\n    word, num = input().split()\n# ← control jumps here, body NEVER ran for 'quit'",
						note: '<code>word</code> is now <code>\'quit\'</code>. <code>\'quit\' != \'quit\'</code> is <strong>False</strong> → the body is skipped.' +
							'<br>So even though <code>num</code> got a value (<code>\'0\'</code>) when we unpacked the sentinel line, the <code>print</code> that uses it is inside the body that <em>doesn’t run</em>. The <code>0</code> is silently discarded.',
						cond: "word != 'quit'", condResult: false,
						vars: [
							{ name: 'word', val: "'quit'", type: 'str' },
							{ name: 'num',  val: "'0'",    type: 'str', hint: '(read but never used)' }
						]
					}
				},
				{
					// Recap
					nVal: 'quit 0', matched: true,
					queueConsumed: 3, queueActive: -1, sentinelHit: false,
					tokensItem: null, tokensSentinel: false,
					output: [
						{ text: 'Eating 5 apples a day keeps you happy and healthy.' },
						{ text: 'Eating 2 shoes a day keeps you happy and healthy.' }
					],
					freshIdx: -1, matchIdx: -1,
					color: 'var(--demo-serial)', bg: 'var(--demo-serial-bg)',
					title: 'Step 5 — Recap: priming read + bottom read = the sentinel pattern',
					code: '# Pseudocode shape (translate to Python yourself):\n#\n#   read the first line              ← priming read, BEFORE the loop\n#   while  ⟨first word is not "quit"⟩ :\n#       use the word and number to print one Mad Lib line\n#       read the NEXT line           ← bottom read, INSIDE the loop\n#   # when the sentinel arrives, condition is False → body skipped → done',
					note: 'Final output: two Mad Lib lines, no third.' +
						'<br><br><strong>The shape that makes a sentinel loop work</strong>: read once <em>before</em> the loop, read again <em>at the bottom of the body</em>. The condition gets a value to check before each iteration; the body uses that value, then loads the next one for the next check.' +
						'<br><br><strong>Two natural ways to grab the word out of each line:</strong>' +
						'<div class="method-cmp">' +
							'<div class="mc-card primary">' +
								'<span class="mc-tag">Method · split &amp; index</span>' +
								'<div>' + highlightPy("line = input()\nwhile line.split()[0] != 'quit':") + '</div>' +
								'<div style="color:var(--demo-muted);font-size:0.92em;margin-top:4px">Keep the whole <code>line</code> as a string, call <code>.split()</code> wherever you need a piece. Simple, but you call <code>.split()</code> a few times.</div>' +
							'</div>' +
							'<div class="mc-card alt">' +
								'<span class="mc-tag">Method · tuple unpack</span>' +
								'<div>' + highlightPy("word, num = input().split()\nwhile word != 'quit':") + '</div>' +
								'<div style="color:var(--demo-muted);font-size:0.92em;margin-top:4px">Unpack right at <code>input()</code> time. Cleaner, but you must know how many pieces to expect (always 2 here).</div>' +
							'</div>' +
						'</div>' +
						'<strong>Worth thinking about</strong> (don’t rush — try them on paper):' +
						'<ul style="margin:6px 0 0 18px;padding:0;font-size:0.95em">' +
							'<li>What happens if you <strong>forget the priming read</strong> and only read inside the loop?</li>' +
							'<li>What if the sentinel line is <code>quit 99</code> instead of <code>quit 0</code> &mdash; does the output change? Why?</li>' +
							'<li>For the unpack version, what would happen if a line had <strong>only one word</strong> (like just <code>quit</code>)?</li>' +
						'</ul>',
					cond: null, condResult: undefined,
					vars: [{ name: '(loop ended)', val: '—' }]
				}
			];

			function mlGo(n) {
				if (n < 0 || n >= mlSteps.length) return;
				keepScroll(function () { _mlGo(n); });
			}
			function _mlGo(n) {
				mlCur = n;
				var s = mlSteps[n], total = mlSteps.length;
				paintStepBtns('ml', total, n, s.color, s.bg);
				document.getElementById('ml-queue').innerHTML =
					mlQueueHTML(s.queueConsumed, s.queueActive, s.sentinelHit);
				// ml-stage shows only the while-condition box — the line value is
				// already displayed in the queue and tokens-stage above/below.
				var condExpr = mlPick(s, 'cond');
				var condResult = mlPick(s, 'condResult');
				var stageEl = document.getElementById('ml-stage');
				if (condExpr) {
					var html = '<div class="cond-box">' +
						'<span class="cond-label">WHILE CONDITION</span>' +
						'<span class="cond-expr">' + escHtml(condExpr) + '</span>';
					if (condResult !== undefined) {
						html += '<span class="cond-result ' + (condResult ? 'true' : 'false') + '">' + (condResult ? 'True' : 'False') + '</span>';
					}
					html += '</div>';
					stageEl.innerHTML = html;
					stageEl.style.display = '';
				} else {
					stageEl.innerHTML = '';
					stageEl.style.display = 'none';
				}
				document.getElementById('ml-tokens').innerHTML =
					mlTokensHTML(mlMethod, s.tokensItem, s.tokensSentinel);
				document.getElementById('ml-output').innerHTML = outputHTML(s.output, s.freshIdx, s.matchIdx);
				renderVarWatch('ml-vars', mlPick(s, 'vars') || []);
				renderInfoPanel('ml-info', mlPick(s, 'title'), mlPick(s, 'code'), mlPick(s, 'note'));
				paintNav('ml', n, total);
			}
			mlGo(0);
		</script>
