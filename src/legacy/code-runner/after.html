		<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.6/ace.min.js" crossorigin="anonymous"></script>

		<script>
		(function() {
			'use strict';

			var WANDBOX = 'https://wandbox.org/api/compile.json';

			var LANGS = [
				{ id: 'python',     label: 'Python',      ace: 'python',     ext: '.py',   tpl: 'print("Hello, World!")', versions: [
					{ label: '3.14',  compiler: 'cpython-3.14.0' },
					{ label: '3.13',  compiler: 'cpython-3.13.8' },
					{ label: '3.12',  compiler: 'cpython-3.12.7' },
					{ label: '3.11',  compiler: 'cpython-3.11.10' },
					{ label: '3.10',  compiler: 'cpython-3.10.15' },
					{ label: '3.9',   compiler: 'cpython-3.9.20' },
				]},
				{ id: 'cpp',        label: 'C++',          ace: 'c_cpp',      ext: '.cpp',  tpl: '#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << "Hello, World!" << endl;\n    return 0;\n}', versions: [
					{ label: 'GCC 13.2', compiler: 'gcc-13.2.0' },
					{ label: 'GCC 12.3', compiler: 'gcc-12.3.0' },
					{ label: 'GCC 11.4', compiler: 'gcc-11.4.0' },
					{ label: 'GCC 10.5', compiler: 'gcc-10.5.0' },
				]},
				{ id: 'c',          label: 'C',            ace: 'c_cpp',      ext: '.c',    tpl: '#include <stdio.h>\n\nint main() {\n    printf("Hello, World!\\n");\n    return 0;\n}', versions: [
					{ label: 'GCC 13.2', compiler: 'gcc-13.2.0-c' },
					{ label: 'GCC 12.3', compiler: 'gcc-12.3.0-c' },
					{ label: 'GCC 11.4', compiler: 'gcc-11.4.0-c' },
					{ label: 'GCC 10.5', compiler: 'gcc-10.5.0-c' },
				]},
				{ id: 'javascript', label: 'JavaScript',   ace: 'javascript', ext: '.js',   tpl: 'console.log("Hello, World!");', versions: [
					{ label: 'Node 20', compiler: 'nodejs-20.17.0' },
					{ label: 'Node 18', compiler: 'nodejs-18.20.4' },
				]},
				{ id: 'typescript', label: 'TypeScript',   ace: 'typescript', ext: '.ts',   tpl: 'const greeting: string = "Hello, World!";\nconsole.log(greeting);', versions: [
					{ label: '5.6', compiler: 'typescript-5.6.2' },
				]},
				{ id: 'java',       label: 'Java',         ace: 'java',       ext: '.java', tpl: 'class Main {\n    public static void main(String[] args) {\n        System.out.println("Hello, World!");\n    }\n}', versions: [
					{ label: 'JDK 22', compiler: 'openjdk-jdk-22+36' },
					{ label: 'JDK 21', compiler: 'openjdk-jdk-21+35' },
				]},
				{ id: 'go',         label: 'Go',           ace: 'golang',     ext: '.go',   tpl: 'package main\n\nimport "fmt"\n\nfunc main() {\n    fmt.Println("Hello, World!")\n}', versions: [
					{ label: '1.23', compiler: 'go-1.23.2' },
					{ label: '1.22', compiler: 'go-1.22.8' },
					{ label: '1.16', compiler: 'go-1.16.3' },
				]},
				{ id: 'rust',       label: 'Rust',         ace: 'rust',       ext: '.rs',   tpl: 'fn main() {\n    println!("Hello, World!");\n}', versions: [
					{ label: '1.82', compiler: 'rust-1.82.0' },
					{ label: '1.81', compiler: 'rust-1.81.0' },
					{ label: '1.80', compiler: 'rust-1.80.1' },
				]},
				// Runs in the browser, not on Wandbox: the "version" select picks a library.
				{ id: 'web',        label: 'Web (HTML/CSS/JS)', ace: 'html', ext: '.html', web: true, tpl: {
					html: '<h1>Hello, World!</h1>\n<button id="btn">Click me</button>',
					css: 'body {\n  font-family: system-ui, sans-serif;\n  padding: 1rem;\n}\n\nh1 {\n  color: #0064a4;\n}',
					js: 'const btn = document.querySelector("#btn");\nbtn.addEventListener("click", () => {\n  console.log("clicked!");\n});'
				}, versions: [
					{ label: 'No library',      compiler: '' },
					{ label: '+ Bootstrap 5.3', compiler: 'bootstrap' },
					{ label: '+ Vega-Lite 5',   compiler: 'vega-lite' },
					{ label: '+ math.js',       compiler: 'mathjs' },
					{ label: '+ Moment.js',     compiler: 'moment' },
				]},
				{ id: 'bash',       label: 'Bash',         ace: 'sh',         ext: '.sh',   tpl: 'echo "Hello, World!"', versions: [
					{ label: 'Bash', compiler: 'bash' },
				]},
			];

			/* ── Compile backend ───────────────────────── */
			function getCompiler() {
				return verSelect.value || currentLang.versions[0].compiler;
			}

			function compile(code, stdin) {
				return fetch(WANDBOX, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({
						code: code,
						compiler: getCompiler(),
						stdin: stdin || ''
					})
				}).then(function(res) {
					if (!res.ok) throw new Error('API returned HTTP ' + res.status);
					return res.json();
				});
			}

			/* ── Language & version selector ─────────────── */
			var langSelect = document.getElementById('cr-lang');
			var verSelect  = document.getElementById('cr-ver');
			var currentLang = LANGS[0];

			LANGS.forEach(function(l) {
				var opt = document.createElement('option');
				opt.value = l.id;
				opt.textContent = l.label;
				langSelect.appendChild(opt);
			});

			function populateVersions() {
				verSelect.innerHTML = '';
				currentLang.versions.forEach(function(v) {
					var opt = document.createElement('option');
					opt.value = v.compiler;
					opt.textContent = v.label;
					verSelect.appendChild(opt);
				});
				// Restore saved version for this language
				var savedVer = localStorage.getItem('cr-ver-' + currentLang.id);
				if (savedVer) {
					var exists = currentLang.versions.some(function(v) { return v.compiler === savedVer; });
					if (exists) verSelect.value = savedVer;
				}
			}

			verSelect.addEventListener('change', function() {
				localStorage.setItem('cr-ver-' + currentLang.id, verSelect.value);
				if (currentLang.web) runWeb();
			});

			var savedLang = localStorage.getItem('cr-lang');
			if (savedLang) {
				var found = LANGS.find(function(l) { return l.id === savedLang; });
				if (found) { currentLang = found; langSelect.value = savedLang; }
			}
			populateVersions();

			/* ── Ace Editor ─────────────────────────────── */
			ace.config.set('basePath', 'https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.6/');

			/* ── VS Code Dark+ theme for Ace ───────────── */
			ace.define("ace/theme/vscode_dark_plus",["require","exports","module","ace/lib/dom"],function(require,exports,module){
				exports.isDark=true;
				exports.cssClass="ace-vscode-dark-plus";
				exports.cssText="\
.ace-vscode-dark-plus{background:#1e1e1e;color:#d4d4d4}\
.ace-vscode-dark-plus .ace_gutter{background:#1e1e1e;color:#858585}\
.ace-vscode-dark-plus .ace_gutter-active-line{background:transparent;color:#c6c6c6}\
.ace-vscode-dark-plus .ace_cursor{color:#d4d4d4}\
.ace-vscode-dark-plus .ace_marker-layer .ace_selection{background:#264f78}\
.ace-vscode-dark-plus .ace_marker-layer .ace_active-line{background:rgba(255,255,255,0.04)}\
.ace-vscode-dark-plus .ace_invisible{color:#404040}\
.ace-vscode-dark-plus .ace_fold{background:#569cd6;border-color:#d4d4d4}\
.ace-vscode-dark-plus .ace_keyword{color:#569cd6}\
.ace-vscode-dark-plus .ace_keyword.ace_control{color:#c586c0}\
.ace-vscode-dark-plus .ace_keyword.ace_operator{color:#d4d4d4}\
.ace-vscode-dark-plus .ace_storage{color:#569cd6}\
.ace-vscode-dark-plus .ace_storage.ace_type{color:#569cd6}\
.ace-vscode-dark-plus .ace_constant{color:#569cd6}\
.ace-vscode-dark-plus .ace_constant.ace_numeric{color:#b5cea8}\
.ace-vscode-dark-plus .ace_constant.ace_language{color:#569cd6}\
.ace-vscode-dark-plus .ace_constant.ace_character.ace_escape{color:#d7ba7d}\
.ace-vscode-dark-plus .ace_string{color:#ce9178}\
.ace-vscode-dark-plus .ace_string.ace_regexp{color:#d16969}\
.ace-vscode-dark-plus .ace_comment{color:#6a9955;font-style:italic}\
.ace-vscode-dark-plus .ace_support{color:#4ec9b0}\
.ace-vscode-dark-plus .ace_support.ace_function{color:#dcdcaa}\
.ace-vscode-dark-plus .ace_support.ace_type{color:#4ec9b0}\
.ace-vscode-dark-plus .ace_support.ace_constant{color:#569cd6}\
.ace-vscode-dark-plus .ace_entity.ace_name.ace_function{color:#dcdcaa}\
.ace-vscode-dark-plus .ace_entity.ace_name.ace_tag{color:#569cd6}\
.ace-vscode-dark-plus .ace_meta.ace_tag{color:#808080}\
.ace-vscode-dark-plus .ace_meta.ace_tag.ace_tag-name{color:#569cd6}\
.ace-vscode-dark-plus .ace_string.ace_attribute-value{color:#ce9178}\
.ace-vscode-dark-plus .ace_entity.ace_other.ace_attribute-name{color:#9cdcfe}\
.ace-vscode-dark-plus .ace_variable{color:#9cdcfe}\
.ace-vscode-dark-plus .ace_variable.ace_parameter{color:#9cdcfe}\
.ace-vscode-dark-plus .ace_variable.ace_language{color:#569cd6}\
.ace-vscode-dark-plus .ace_meta.ace_preprocessor{color:#c586c0}\
.ace-vscode-dark-plus .ace_paren{color:#ffd700}\
.ace-vscode-dark-plus .ace_bracket{border:1px solid #888}\
.ace-vscode-dark-plus .ace_indent-guide{border-right:1px solid #404040}\
.ace-vscode-dark-plus .ace_marker-layer .ace_selected-word{border:1px solid #575757;background:transparent}\
.ace-vscode-dark-plus .ace_marker-layer .ace_search-result{background:rgba(255,150,50,.3);border:1px solid rgba(255,150,50,.5)}\
";
				require("ace/lib/dom").importCssString(exports.cssText,exports.cssClass,false);
			});

			var editor = ace.edit('cr-editor');
			editor.setTheme('ace/theme/vscode_dark_plus');
			editor.session.setMode('ace/mode/' + currentLang.ace);
			editor.setOptions({
				fontSize: '14px',
				showPrintMargin: false,
				tabSize: 4,
				useSoftTabs: true,
				wrap: false,
				showGutter: true,
				fontFamily: '"Consolas", "Cascadia Code", "Fira Code", "Menlo", monospace'
			});

			/* ── Web mode: one Ace session per file ───────── */
			var WEB_TABS = { html: 'html', css: 'css', js: 'javascript' };
			var WEB_TPL = LANGS.find(function(l) { return l.web; }).tpl;
			var mainSession = editor.getSession();
			var webSessions = {};
			var webTab = localStorage.getItem('cr-web-tab') || 'html';
			Object.keys(WEB_TABS).forEach(function(k) {
				var saved = localStorage.getItem('cr-code-web-' + k);
				var sess = ace.createEditSession(saved !== null ? saved : WEB_TPL[k], 'ace/mode/' + WEB_TABS[k]);
				sess.setTabSize(2);
				sess.setUseSoftTabs(true);
				webSessions[k] = sess;
			});
			var webTabsEl = document.getElementById('cr-web-tabs');
			var webAuto = document.getElementById('cr-web-auto');
			webAuto.checked = localStorage.getItem('cr-web-auto') !== 'off';
			webAuto.addEventListener('change', function() {
				localStorage.setItem('cr-web-auto', webAuto.checked ? 'on' : 'off');
				if (webAuto.checked) runWeb();
			});

			function showWebTab(k) {
				webTab = k;
				localStorage.setItem('cr-web-tab', k);
				editor.setSession(webSessions[k]);
				webTabsEl.querySelectorAll('.cr-web-tab').forEach(function(b) {
					b.classList.toggle('active', b.dataset.tab === k);
				});
				editor.focus();
			}
			webTabsEl.addEventListener('click', function(e) {
				var b = e.target.closest('.cr-web-tab');
				if (b) showWebTab(b.dataset.tab);
			});

			function saveCode() {
				if (currentLang.web) {
					Object.keys(webSessions).forEach(function(k) {
						localStorage.setItem('cr-code-web-' + k, webSessions[k].getValue());
					});
				} else {
					localStorage.setItem('cr-code-' + currentLang.id, editor.getValue());
				}
			}

			if (!currentLang.web) {
				var savedCode = localStorage.getItem('cr-code-' + currentLang.id);
				editor.setValue(savedCode || currentLang.tpl, -1);
			}
			editor.focus();

			var saveTimer = null;
			var autoTimer = null;
			editor.on('change', function() {
				clearTimeout(saveTimer);
				saveTimer = setTimeout(saveCode, 800);
				if (currentLang.web && webAuto.checked) {
					clearTimeout(autoTimer);
					autoTimer = setTimeout(runWeb, 700);
				}
			});

			/* ── Language switch ─────────────────────────── */
			langSelect.addEventListener('change', function() {
				saveCode();
				var newLang = LANGS.find(function(l) { return l.id === langSelect.value; });
				if (!newLang) return;
				currentLang = newLang;
				localStorage.setItem('cr-lang', currentLang.id);
				if (!currentLang.web) {
					editor.setSession(mainSession);
					editor.session.setMode('ace/mode/' + currentLang.ace);
					var saved = localStorage.getItem('cr-code-' + currentLang.id);
					editor.setValue(saved || currentLang.tpl, -1);
					editor.focus();
				}
				populateVersions();
				loadTestCases();
				applyMode();
			});

			/* ── Fullscreen ─────────────────────────────── */
			var card  = document.querySelector('.cr-card');
			var fsBtn = document.getElementById('cr-btn-fs');

			var fsExpand = fsBtn.querySelector('.cr-fs-expand');
			var fsShrink = fsBtn.querySelector('.cr-fs-shrink');
			var fsText   = fsBtn.querySelector('.cr-fs-text');

			function updateFsBtn() {
				var isFs = card.classList.contains('cr-fullscreen');
				fsExpand.style.display = isFs ? 'none' : '';
				fsShrink.style.display = isFs ? '' : 'none';
				fsText.textContent = isFs ? 'Exit Fullscreen' : 'Fullscreen';
			}

			fsBtn.addEventListener('click', function() {
				card.classList.toggle('cr-fullscreen');
				editor.resize();
				updateFsBtn();
			});

			document.addEventListener('keydown', function(e) {
				if (e.key === 'Escape' && card.classList.contains('cr-fullscreen')) {
					card.classList.remove('cr-fullscreen');
					editor.resize();
					updateFsBtn();
				}
			});

			/* ── Width drag ─────────────────────────────── */
			(function() {
				var shell = document.getElementById('cr-shell');
				var edgeL = document.getElementById('cr-edge-l');
				var edgeR = document.getElementById('cr-edge-r');

				function startDrag(e, side) {
					e.preventDefault();
					var startX = e.clientX;
					var startW = shell.offsetWidth;
					var handle = side === 'l' ? edgeL : edgeR;

					handle.classList.add('dragging');
					document.body.style.cursor = 'ew-resize';
					document.body.style.userSelect = 'none';

					function onMove(e) {
						var dx = e.clientX - startX;
						// Both edges move symmetrically (centered layout)
						var newW = side === 'r' ? startW + dx * 2 : startW - dx * 2;
						var maxW = window.innerWidth - 32;
						newW = Math.max(820, Math.min(maxW, newW));
						shell.style.maxWidth = newW + 'px';
						editor.resize();
					}
					function onUp() {
						handle.classList.remove('dragging');
						document.body.style.cursor = '';
						document.body.style.userSelect = '';
						document.removeEventListener('mousemove', onMove);
						document.removeEventListener('mouseup', onUp);
					}
					document.addEventListener('mousemove', onMove);
					document.addEventListener('mouseup', onUp);
				}

				edgeL.addEventListener('mousedown', function(e) { startDrag(e, 'l'); });
				edgeR.addEventListener('mousedown', function(e) { startDrag(e, 'r'); });
			})();

			/* ── Resizable panes ────────────────────────── */
			(function() {
				var body     = document.getElementById('cr-body');
				var rH       = document.getElementById('cr-resizer-h');

				// ── Horizontal: left/right split ──
				rH.addEventListener('mousedown', function(e) {
					e.preventDefault();
					var startX = e.clientX;
					var totalW = body.offsetWidth;
					var leftW  = body.querySelector('.cr-body-left').offsetWidth;

					rH.classList.add('dragging');
					document.body.style.cursor = 'col-resize';
					document.body.style.userSelect = 'none';

					function onMove(e) {
						var pct = (leftW + e.clientX - startX) / totalW * 100;
						pct = Math.max(20, Math.min(75, pct));
						body.style.gridTemplateColumns = pct + '% 8px 1fr';
						editor.resize();
					}
					function onUp() {
						rH.classList.remove('dragging');
						document.body.style.cursor = '';
						document.body.style.userSelect = '';
						document.removeEventListener('mousemove', onMove);
						document.removeEventListener('mouseup', onUp);
					}
					document.addEventListener('mousemove', onMove);
					document.addEventListener('mouseup', onUp);
				});

			})();

			/* ── Open / Save file ───────────────────────── */
			var fileInput = document.getElementById('cr-file-input');
			var EXT_TO_LANG = {};
			LANGS.forEach(function(l) { EXT_TO_LANG[l.ext] = l.id; });

			document.getElementById('cr-btn-open').addEventListener('click', function() {
				fileInput.value = '';
				fileInput.click();
			});

			fileInput.addEventListener('change', function() {
				var file = fileInput.files[0];
				if (!file) return;
				if (file.size > 5 * 1024 * 1024) { alert('File too large (max 5 MB)'); return; }
				var reader = new FileReader();
				reader.onload = function() {
					var dot = file.name.lastIndexOf('.');
					var lower = dot !== -1 ? file.name.substring(dot).toLowerCase() : '';
					// Web files go into their tab: .html/.htm/.css always, .js when already in Web mode
					var webTabFor = { '.html': 'html', '.htm': 'html', '.css': 'css' }[lower] || (lower === '.js' && currentLang.web ? 'js' : null);
					if (webTabFor) {
						if (!currentLang.web) {
							langSelect.value = 'web';
							langSelect.dispatchEvent(new Event('change'));
						}
						webSessions[webTabFor].setValue(reader.result);
						saveCode(); // the tab may not be on screen, so no editor 'change' fires
						showWebTab(webTabFor);
						runWeb();
						return;
					}
					// Auto-detect language from extension
					if (dot !== -1) {
						var ext = file.name.substring(dot).toLowerCase();
						var langId = EXT_TO_LANG[ext];
						if (langId && langId !== currentLang.id) {
							langSelect.value = langId;
							langSelect.dispatchEvent(new Event('change'));
						}
					}
					editor.setValue(reader.result, -1);
					editor.focus();
				};
				reader.readAsText(file);
			});

			document.getElementById('cr-btn-save').addEventListener('click', function() {
				if (currentLang.web) {
					// One self-contained index.html (CSS and JS inlined)
					getWebMod().then(function(m) {
						var page = m.pageDocument(webSource(), null, verSelect.value ? [verSelect.value] : []);
						var url = URL.createObjectURL(new Blob([page], { type: 'text/html;charset=utf-8' }));
						var link = document.createElement('a');
						link.href = url;
						link.download = 'index.html';
						link.click();
						URL.revokeObjectURL(url);
					});
					return;
				}
				var code = editor.getValue();
				var blob = new Blob([code], { type: 'text/plain;charset=utf-8' });
				var a = document.createElement('a');
				a.href = URL.createObjectURL(blob);
				a.download = 'code' + currentLang.ext;
				a.click();
				URL.revokeObjectURL(a.href);
			});

			/* ── Stdin ──────────────────────────────────── */
			var stdinArea = document.getElementById('cr-stdin');

			function getStdin() {
				return stdinArea.value;
			}

			/* ── Shared refs (needed early) ──────────────── */
			var outputEl = document.getElementById('cr-output');
			var statusEl = document.getElementById('cr-status');
			var runBtn   = document.getElementById('cr-btn-run');
			var running  = false;

			/* ── Test Cases ─────────────────────────────── */
			var tcList   = document.getElementById('cr-tc-list');
			var tcAddBtn = document.getElementById('cr-tc-add');
			var testCases = [];

			function esc(s) {
				var d = document.createElement('div');
				d.textContent = s;
				return d.innerHTML;
			}

			function renderTestCases() {
				if (testCases.length === 0) {
					tcList.innerHTML = '<div class="cr-tc-empty">No test cases yet. Click "+ Add" to create one.</div>';
					updateRunBtn();
					return;
				}
				var html = '';
				testCases.forEach(function(tc, i) {
					html += '<div class="cr-tc-case">' +
						'<span class="cr-tc-num">Case ' + (i + 1) + '</span>' +
						'<div class="cr-tc-field"><label>Input (stdin)</label>' +
						'<textarea data-i="' + i + '" data-f="input" placeholder="(empty)">' + esc(tc.input) + '</textarea></div>' +
						'<div class="cr-tc-field"><label>Expected Output</label>' +
						'<textarea data-i="' + i + '" data-f="expected" placeholder="expected stdout">' + esc(tc.expected) + '</textarea></div>' +
						'<button type="button" class="cr-tc-delbtn" data-del="' + i + '" title="Remove">\u00d7</button>' +
						'</div>';
				});
				tcList.innerHTML = html;

				tcList.querySelectorAll('textarea').forEach(function(ta) {
					ta.addEventListener('input', function() {
						testCases[parseInt(this.dataset.i)][this.dataset.f] = this.value;
						saveTestCases();
					});
				});
				tcList.querySelectorAll('[data-del]').forEach(function(btn) {
					btn.addEventListener('click', function() {
						testCases.splice(parseInt(this.dataset.del), 1);
						renderTestCases();
						saveTestCases();
					});
				});
				updateRunBtn();
			}

			function saveTestCases() {
				localStorage.setItem('cr-tc-' + currentLang.id, JSON.stringify(testCases));
			}

			function loadTestCases() {
				try {
					testCases = JSON.parse(localStorage.getItem('cr-tc-' + currentLang.id)) || [];
				} catch(e) { testCases = []; }
				renderTestCases();
			}

			tcAddBtn.addEventListener('click', function() {
				testCases.push({ input: '', expected: '' });
				renderTestCases();
				saveTestCases();
				var fields = tcList.querySelectorAll('textarea[data-f="input"]');
				if (fields.length) fields[fields.length - 1].focus();
			});

			var stdinSec  = document.getElementById('cr-sec-stdin');
			var tcSec     = document.getElementById('cr-sec-tc');
			var outputSec = document.getElementById('cr-sec-output');
			var previewSec = document.getElementById('cr-sec-preview');
			var allSections = [stdinSec, tcSec, previewSec, outputSec];

			/* ── Distribute flex: last expanded visible section fills ── */
			function syncSections() {
				var expanded = allSections.filter(function(s) {
					return s.style.display !== 'none' && !s.classList.contains('collapsed');
				});
				allSections.forEach(function(s) { s.style.flex = ''; });
				if (currentLang.web) {
					// Preview gets most of the height, the console the rest
					if (expanded.indexOf(previewSec) !== -1) previewSec.style.flex = '3 1 0';
					if (expanded.indexOf(outputSec) !== -1) outputSec.style.flex = expanded.length > 1 ? '1 1 0' : '1';
				} else if (expanded.length) {
					expanded[expanded.length - 1].style.flex = '1';
				}
			}

			/* ── Collapsible section headers ── */
			document.querySelectorAll('.cr-section-hdr[data-section]').forEach(function(hdr) {
				hdr.addEventListener('click', function(e) {
					if (e.target.closest('button')) return;
					var sec = hdr.closest('.cr-section');
					var body = sec.querySelector('.cr-section-body');
					var isCollapsed = sec.classList.toggle('collapsed');
					body.style.display = isCollapsed ? 'none' : '';
					hdr.classList.toggle('collapsed', isCollapsed);
					syncSections();
					updateRunBtn();
				});
			});

			function isJudgeMode() {
				return !currentLang.web && !tcSec.classList.contains('collapsed') && testCases.length > 0;
			}

			var RUN_ICON_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg>';
			function updateRunBtn() {
				if (!running) {
					runBtn.innerHTML = isJudgeMode()
						? RUN_ICON_SVG + 'Judge<span class="cr-shortcut">Ctrl+Enter</span>'
						: RUN_ICON_SVG + 'Run<span class="cr-shortcut">Ctrl+Enter</span>';
				}
			}

			loadTestCases();
			syncSections();

			/* ── Clear all ──────────────────────────────── */
			document.getElementById('cr-btn-clear').addEventListener('click', function() {
				if (currentLang.web) {
					Object.keys(webSessions).forEach(function(k) {
						webSessions[k].setValue('');
						localStorage.removeItem('cr-code-web-' + k);
					});
					preview.srcdoc = '';
					outputEl.innerHTML = CONSOLE_EMPTY;
					statusEl.textContent = '';
					editor.focus();
					return;
				}
				editor.setValue('', -1);
				editor.focus();
				stdinArea.value = '';
				outputEl.innerHTML = '<span class="cr-placeholder">Click Run or press Ctrl+Enter to execute your code.</span>';
				statusEl.textContent = '';
				localStorage.removeItem('cr-code-' + currentLang.id);
			});

			/* ── Run / Judge ────────────────────────────── */

			/* ── Web: render in a sandboxed iframe, console from the page ── */
			var preview = document.getElementById('cr-preview');
			var previewSize = document.getElementById('cr-preview-size');
			var outputTitle = document.getElementById('cr-output-title');
			var CONSOLE_EMPTY = '<span class="cr-placeholder">(console empty)</span>';
			var webToken = null;
			var webModPromise = null;
			var consoleLines = 0;

			// Shared with the notes' live demos (assets/viz/web-demo.js): same page
			// builder and console/alert/error hook.
			function getWebMod() {
				if (!webModPromise) webModPromise = import('../../assets/viz/web-demo.js');
				return webModPromise;
			}

			function webSource() {
				return { html: webSessions.html.getValue(), css: webSessions.css.getValue(), js: webSessions.js.getValue() };
			}

			// A pasted course file links style.css / script.js etc.; those files don't
			// exist here, so drop local <link>/<script src> and use the tabs instead.
			function dropLocalRefs(html, notes) {
				var local = function(url) { return !/^(?:[a-z]+:)?\/\//i.test(url); };
				return html
					.replace(/<link\b[^>]*\bhref\s*=\s*["']([^"']+)["'][^>]*>/gi, function(tag, url) {
						if (!/stylesheet/i.test(tag) || !local(url)) return tag;
						notes.push(url + ' \u2192 style.css tab');
						return '';
					})
					.replace(/<script\b[^>]*\bsrc\s*=\s*["']([^"']+)["'][^>]*>\s*<\/script>/gi, function(tag, url) {
						if (!local(url)) return tag;
						notes.push(url + ' \u2192 script.js tab');
						return '';
					});
			}

			function consoleLine(kind, text) {
				if (consoleLines === 0) outputEl.innerHTML = '';
				consoleLines++;
				var cls = { error: 'cr-stderr', warn: 'cr-con-warn', info: 'cr-con-info' }[kind];
				outputEl.insertAdjacentHTML('beforeend', (cls ? '<span class="' + cls + '">' + esc(text) + '</span>' : esc(text)) + '\n');
				outputEl.scrollTop = outputEl.scrollHeight;
				if (kind === 'error') {
					statusEl.innerHTML = '<span class="cr-exit-err">error</span> &middot; ' + new Date().toLocaleTimeString();
				}
			}

			window.addEventListener('message', function(e) {
				var d = e.data;
				if (!d || !webToken || d.__webDemo !== webToken || e.source !== preview.contentWindow) return;
				consoleLine(d.kind, d.text);
			});

			function runWeb() {
				if (!currentLang.web) return;
				getWebMod().then(function(m) {
					var notes = [];
					var src = webSource();
					src.html = dropLocalRefs(src.html, notes);
					webToken = 'cr' + Math.random().toString(36).slice(2);
					consoleLines = 0;
					outputEl.innerHTML = CONSOLE_EMPTY;
					notes.forEach(function(n) { consoleLine('info', '[runner] ' + n); });
					preview.srcdoc = m.pageDocument(src, webToken, verSelect.value ? [verSelect.value] : []);
					statusEl.innerHTML = '<span class="cr-exit-ok">rendered</span> &middot; ' + new Date().toLocaleTimeString();
				}).catch(function(err) {
					outputEl.innerHTML = '<span class="cr-error-msg">Error: ' + esc(err.message) + '</span>';
				});
			}

			if (typeof ResizeObserver !== 'undefined') {
				new ResizeObserver(function() {
					previewSize.textContent = preview.clientWidth ? preview.clientWidth + ' \u00d7 ' + preview.clientHeight : '';
				}).observe(preview);
			}

			// Show / hide the pieces that belong to Web vs. the compiled languages.
			function applyMode() {
				var web = !!currentLang.web;
				webTabsEl.hidden = !web;
				stdinSec.style.display = web ? 'none' : '';
				tcSec.style.display = web ? 'none' : '';
				previewSec.style.display = web ? '' : 'none';
				outputTitle.textContent = web ? 'Console' : 'Output';
				verSelect.title = web ? 'Library to load' : 'Compiler/runtime version';
				if (web) {
					showWebTab(webTab);
					runWeb();
				} else {
					// Stop the hidden page: its timers/listeners would keep logging into Output
					webToken = null;
					clearTimeout(autoTimer);
					preview.srcdoc = '';
					outputEl.innerHTML = '<span class="cr-placeholder">Click Run or press Ctrl+Enter to execute your code.</span>';
					statusEl.textContent = '';
				}
				syncSections();
				updateRunBtn();
				editor.resize();
			}

			function runCode() {
				if (currentLang.web) { runWeb(); return; }
				if (running) return;
				if (isJudgeMode()) { judgeCode(); return; }
				normalRun();
			}

			function normalRun() {
				running = true;
				runBtn.disabled = true;
				runBtn.innerHTML = '<span class="cr-spinner"></span> Running\u2026';
				outputEl.innerHTML = '<span class="cr-placeholder">Running\u2026</span>';
				statusEl.textContent = '';

				var code  = editor.getValue();
				var stdin = getStdin();
				var t0    = performance.now();

				compile(code, stdin)
				.then(function(data) {
					var elapsed = ((performance.now() - t0) / 1000).toFixed(2);
					var html = '';
					var exitCode = parseInt(data.status, 10) || 0;

					if (data.compiler_error) {
						html += '<span class="cr-compile-err">' + esc(data.compiler_error) + '</span>';
					}

					var hasOutput = false;
					if (data.program_output) { html += esc(data.program_output); hasOutput = true; }
					if (data.program_error)  { html += '<span class="cr-stderr">' + esc(data.program_error) + '</span>'; hasOutput = true; }
					if (!hasOutput && !data.compiler_error) { html += '<span class="cr-placeholder">(no output)</span>'; }
					if (data.signal) { html += '\n<span class="cr-stderr">Signal: ' + esc(data.signal) + '</span>'; }

					outputEl.innerHTML = html;
					var exitOk = exitCode === 0 && !data.signal;
					statusEl.innerHTML =
						'<span class="' + (exitOk ? 'cr-exit-ok' : 'cr-exit-err') + '">Exit: ' + exitCode + '</span>' +
						(data.signal ? ' (' + esc(data.signal) + ')' : '') +
						' &middot; ' + elapsed + 's &middot; ' + getCompiler();
				})
				.catch(function(err) {
					outputEl.innerHTML = '<span class="cr-error-msg">Error: ' + esc(err.message) + '</span>';
					statusEl.textContent = '';
				})
				.finally(function() {
					running = false;
					runBtn.disabled = false;
					updateRunBtn();
				});
			}

			function judgeCode() {
				running = true;
				runBtn.disabled = true;
				runBtn.innerHTML = '<span class="cr-spinner"></span> Judging\u2026';
				outputEl.innerHTML = '<span class="cr-placeholder">Running ' + testCases.length + ' test case' + (testCases.length > 1 ? 's' : '') + '\u2026</span>';
				statusEl.textContent = '';

				var code = editor.getValue();
				var t0 = performance.now();
				var results = new Array(testCases.length);

				// Run all test cases in parallel
				var promises = testCases.map(function(tc, i) {
					return compile(code, tc.input).then(function(data) {
						var actual   = (data.program_output || '').replace(/\r\n/g, '\n').replace(/\s+$/, '');
						var expected = tc.expected.replace(/\r\n/g, '\n').replace(/\s+$/, '');
						var compErr  = data.compiler_error || '';
						var runErr   = data.program_error || '';
						var signal   = data.signal || '';
						var pass     = !compErr && !signal && actual === expected;

						results[i] = {
							pass: pass,
							actual: data.program_output || '',
							compErr: compErr,
							runErr: runErr,
							signal: signal
						};
					}).catch(function(err) {
						results[i] = { pass: false, actual: '', compErr: '', runErr: '', signal: '', error: err.message };
					});
				});

				Promise.all(promises).then(function() {
					var elapsed = ((performance.now() - t0) / 1000).toFixed(2);
					var passed = results.filter(function(r) { return r.pass; }).length;
					var total = results.length;

					function trunc(s, n) { s = s.replace(/\s+$/, ''); return s.length > n ? s.substring(0, n) + '\u2026' : s; }

					var html = '<table class="cr-judge-table">';
					results.forEach(function(r, i) {
						var tc = testCases[i];
						var icon = r.pass
							? '<span class="cr-jpass">\u2713</span>'
							: '<span class="cr-jfail">\u2717</span>';
						var cls = r.pass ? 'cr-jpass' : 'cr-jfail';

						html += '<tr>';
						html += '<td class="cr-jidx ' + cls + '">' + icon + ' Case ' + (i + 1) + '</td>';

						if (r.error) {
							html += '<td class="cr-jfail cr-jdetail">' + esc(r.error) + '</td>';
						} else if (r.compErr) {
							html += '<td class="cr-jfail cr-jdetail">' + esc(trunc(r.compErr, 150)) + '</td>';
						} else if (r.pass) {
							html += '<td class="cr-jdetail"><code>' + esc(trunc(r.actual, 80) || '(empty)') + '</code></td>';
						} else {
							html += '<td class="cr-jdetail">' +
								'<span class="cr-jexpected">expected </span><code>' + esc(trunc(tc.expected, 60) || '(empty)') + '</code>' +
								'<span class="cr-jexpected"> got </span><span class="cr-jdiff"><code>' + esc(trunc(r.actual, 60) || '(empty)') + '</code></span>' +
								(r.signal ? ' <span class="cr-jfail">[' + esc(r.signal) + ']</span>' : '') +
								'</td>';
						}
						html += '</tr>';
					});
					html += '</table>';

					var allPass = passed === total;
					html += '<div class="cr-judge-summary ' + (allPass ? 'cr-jpass' : 'cr-jfail') + '">' +
						(allPass ? '\u2713 ' : '\u2717 ') + passed + '/' + total + ' passed</div>';

					outputEl.innerHTML = html;
					statusEl.innerHTML =
						'<span class="' + (allPass ? 'cr-exit-ok' : 'cr-exit-err') + '">' +
						passed + '/' + total + ' passed</span> &middot; ' + elapsed + 's';
				}).finally(function() {
					running = false;
					runBtn.disabled = false;
					updateRunBtn();
				});
			}

			runBtn.addEventListener('click', runCode);

			// Hand-off from a notes demo ("Code Runner" button in assets/viz/web-demo.js)
			if (/[?&]from=viz\b/.test(location.search)) {
				try {
					var handoff = JSON.parse(localStorage.getItem('cr-web-transfer') || 'null');
					localStorage.removeItem('cr-web-transfer');
					// Don't silently replace the reader's own Web code
					var mine = ['html', 'css', 'js'].some(function(k) {
						var v = localStorage.getItem('cr-code-web-' + k);
						return v !== null && v !== WEB_TPL[k] && v !== (handoff && handoff[k] || '');
					});
					if (handoff && mine && !confirm('Replace your current Web (HTML/CSS/JS) code with the code from the notes demo?\n\nCancel keeps your code.')) handoff = null;
					if (handoff) {
						currentLang = LANGS.find(function(l) { return l.web; });
						langSelect.value = 'web';
						localStorage.setItem('cr-lang', 'web');
						populateVersions();
						verSelect.value = (handoff.libs && handoff.libs[0]) || '';
						localStorage.setItem('cr-ver-web', verSelect.value);
						['html', 'css', 'js'].forEach(function(k) { webSessions[k].setValue(handoff[k] || ''); });
						webTab = handoff.js && !handoff.css ? 'js' : 'html';
						saveCode();
					}
				} catch (err) { /* ignore a malformed hand-off */ }
				history.replaceState(null, '', location.pathname);
			}
			applyMode();

			editor.commands.addCommand({
				name: 'runCode',
				bindKey: { win: 'Ctrl-Enter', mac: 'Command-Enter' },
				exec: runCode
			});

		})();
		</script>

		<!-- Header scroll detection (Type B — no banner) -->
		<script>
			(function() {
				var header = document.getElementById("header");
				var isRevealed = false;
				window.addEventListener("scroll", function() {
					var y = window.scrollY;
					if (!isRevealed && y > 80) {
						isRevealed = true;
						header.classList.remove("alt");
						header.classList.add("reveal");
					} else if (isRevealed && y <= 0) {
						isRevealed = false;
						header.classList.remove("reveal");
						header.classList.add("alt");
					}
				}, { passive: true });
			})();
		</script>
