<div id="main" class="alt">
				<section id="one">
					<div class="inner cr-shell" id="cr-shell">
						<div class="cr-edge cr-edge-l" id="cr-edge-l"></div>
						<div class="cr-edge cr-edge-r" id="cr-edge-r"></div>
						<header class="major" style="display:none;"><h1>Code Runner</h1></header>

						<div class="cr-intro">
							<nav class="crumbs" aria-label="Breadcrumb">
								<a href="../../tools/" class="crumb">Tools</a>
								<span class="crumb-sep">›</span>
								<span class="crumb crumb-current">Code Runner</span>
							</nav>
						</div>

						<div class="cr-card">
							<!-- Toolbar -->
							<div class="cr-toolbar">
								<div class="cr-toolbar-left">
									<select id="cr-lang" class="cr-lang-select"></select>
									<select id="cr-ver" class="cr-input-select" title="Compiler/runtime version"></select>
								</div>
								<input type="file" id="cr-file-input" style="display:none" />
								<div class="cr-toolbar-right">
									<button type="button" id="cr-btn-open" class="cr-btn cr-btn-secondary" title="Open file"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 14 1.45-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></svg>Open</button>
									<button type="button" id="cr-btn-save" class="cr-btn cr-btn-secondary" title="Download code"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Save</button>
									<button type="button" id="cr-btn-clear" class="cr-btn cr-btn-secondary" title="Clear all"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Clear All</button>
									<button type="button" id="cr-btn-fs" class="cr-btn cr-btn-secondary" title="Toggle fullscreen"><svg class="cr-fs-expand" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg><svg class="cr-fs-shrink" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg><span class="cr-fs-text">Fullscreen</span></button>
									<button type="button" id="cr-btn-run" class="cr-btn cr-btn-run" title="Run code"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg>Run<span class="cr-shortcut">Ctrl+Enter</span></button>
								</div>
							</div>

							<!-- Split body -->
							<div class="cr-body" id="cr-body">
								<!-- Left: Editor -->
								<div class="cr-body-left">
									<div class="cr-web-tabs" id="cr-web-tabs" hidden>
										<button type="button" class="cr-web-tab" data-tab="html">index.html</button>
										<button type="button" class="cr-web-tab" data-tab="css">style.css</button>
										<button type="button" class="cr-web-tab" data-tab="js">script.js</button>
										<label class="cr-web-auto" title="Re-run the page as you type"><input type="checkbox" id="cr-web-auto" checked />Auto-run</label>
									</div>
									<div id="cr-editor"></div>
								</div>

								<!-- Horizontal resizer -->
								<div class="cr-resizer cr-resizer-h" id="cr-resizer-h"></div>

								<!-- Right: Stdin + Test Cases + Output -->
								<div class="cr-body-right" id="cr-body-right">
									<div class="cr-section" id="cr-sec-stdin">
										<div class="cr-section-hdr" data-section="stdin">
											<svg class="cr-section-chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
											<span class="cr-section-title">Stdin</span>
											<span class="cr-stdin-hint">— Leave empty if not needed</span>
										</div>
										<div class="cr-section-body cr-stdin-body">
											<textarea id="cr-stdin" class="cr-stdin-area" placeholder="(empty)" rows="3"></textarea>
										</div>
									</div>

									<div class="cr-section" id="cr-sec-tc">
										<div class="cr-section-hdr" data-section="tc">
											<svg class="cr-section-chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
											<span class="cr-section-title">Test Cases</span>
											<button type="button" class="cr-tc-addbtn" id="cr-tc-add" style="margin-left:auto">+ Add</button>
										</div>
										<div class="cr-section-body cr-tc-list" id="cr-tc-list"></div>
									</div>

									<div class="cr-section" id="cr-sec-preview" style="display:none">
										<div class="cr-section-hdr" data-section="preview">
											<svg class="cr-section-chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
											<span class="cr-section-title">Preview</span>
											<span class="cr-preview-size" id="cr-preview-size"></span>
										</div>
										<div class="cr-section-body cr-preview-body">
											<iframe id="cr-preview" sandbox="allow-scripts allow-forms" title="Page preview"></iframe>
										</div>
									</div>

									<div class="cr-section" id="cr-sec-output">
										<div class="cr-section-hdr" data-section="output">
											<svg class="cr-section-chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
											<span class="cr-section-title" id="cr-output-title">Output</span>
											<span class="cr-output-status" id="cr-status" style="margin-left:auto"></span>
										</div>
										<pre class="cr-section-body cr-output" id="cr-output"><span class="cr-placeholder">Click Run or press Ctrl+Enter to execute your code.</span></pre>
									</div>
								</div>
							</div>

						</div>

					</div>
				</section>
			</div>
