<style>
			:root {
				/* Demo page theme vars — light defaults */
				--crumb-blue: #24508f;
				--crumb-blue-bg: rgba(36, 80, 143, 0.10);
				--crumb-blue-border: rgba(36, 80, 143, 0.22);
				--crumb-blue-bg-strong: rgba(36, 80, 143, 0.17);
				--crumb-blue-dark: #183b73;

				--demo-ink: #23324a;
				--demo-muted: #64748b;
				--demo-card-bg: rgba(255, 255, 255, 0.98);
				--demo-card-bg-soft:
					radial-gradient(circle at bottom left, rgba(36, 80, 143, 0.05), transparent 16rem),
					rgba(255, 255, 255, 0.98);
				--demo-card-border: rgba(33, 82, 164, 0.14);
				--demo-card-shadow: 0 1.25rem 3rem rgba(23, 43, 77, 0.08);
				--demo-card-shadow-sm: 0 0.8rem 2rem rgba(23, 43, 77, 0.06);
				--demo-btn-bg: #f5f5f3;
				--demo-btn-bg-hover: #eaeae8;
				--demo-btn-border: #ccc;
				--demo-tab-border: #cdd5e0;
				--demo-char-border: #ddd;
				--demo-char-bg: #f0f0ee;
				--demo-char-text: #bbb;
				--demo-char-idx: #aaa;
				--demo-info-border: #ddd;
				--demo-info-bg: #f7f9fc;
				--demo-input-border: #e0e4ea;
				--demo-input-bg: #f8f9fb;
				--demo-step-counter: #888;

				/* Educational semantic colors */
				--demo-area: #854F0B;
				--demo-area-bg: #FAEEDA;
				--demo-group: #185FA5;
				--demo-group-bg: #E6F1FB;
				--demo-serial: #1D9E75;
				--demo-serial-bg: #E1F5EE;
				--demo-red: #C13B3B;
				--demo-red-bg: #FCE4E4;

				/* Aliases used by legacy inline styles */
				--color-text-primary: var(--demo-ink);
				--color-text-secondary: var(--demo-muted);
				--color-background-primary: var(--demo-input-bg);
				--color-background-secondary: var(--demo-info-bg);
			}

			html[data-theme="dark"] {
				--crumb-blue: #6aa3f5;
				--crumb-blue-bg: rgba(106, 163, 245, 0.15);
				--crumb-blue-border: rgba(106, 163, 245, 0.32);
				--crumb-blue-bg-strong: rgba(106, 163, 245, 0.24);
				--crumb-blue-dark: #a8c9ff;

				--demo-ink: #dde4f0;
				--demo-muted: #8c9cb5;
				--demo-card-bg: #181d26;
				--demo-card-bg-soft:
					radial-gradient(circle at bottom left, rgba(106, 163, 245, 0.08), transparent 16rem),
					#181d26;
				--demo-card-border: rgba(255, 255, 255, 0.08);
				--demo-card-shadow: 0 1.25rem 3rem rgba(0, 0, 0, 0.35);
				--demo-card-shadow-sm: 0 0.8rem 2rem rgba(0, 0, 0, 0.25);
				--demo-btn-bg: #1a1f28;
				--demo-btn-bg-hover: #232937;
				--demo-btn-border: rgba(255, 255, 255, 0.14);
				--demo-tab-border: rgba(255, 255, 255, 0.14);
				--demo-char-border: rgba(255, 255, 255, 0.1);
				--demo-char-bg: rgba(255, 255, 255, 0.04);
				--demo-char-text: #54627a;
				--demo-char-idx: #54627a;
				--demo-info-border: rgba(255, 255, 255, 0.08);
				--demo-info-bg: #14181f;
				--demo-input-border: rgba(255, 255, 255, 0.08);
				--demo-input-bg: #181d26;
				--demo-step-counter: #8892a6;

				--demo-area: #e8b97a;
				--demo-area-bg: rgba(232, 185, 122, 0.16);
				--demo-group: #7ab5ff;
				--demo-group-bg: rgba(122, 181, 255, 0.16);
				--demo-serial: #58d4b0;
				--demo-serial-bg: rgba(88, 212, 176, 0.16);
				--demo-red: #f28b8b;
				--demo-red-bg: rgba(242, 139, 139, 0.16);
			}

			/* Merge page-head with demo-shell into a single unified card */
			main.page > .page-head.card {
				border-radius: var(--r-lg) var(--r-lg) 0 0;
				margin-bottom: 0;
				box-shadow: none;
				border: 1px solid var(--demo-card-border);
				border-bottom: 1px solid var(--demo-card-border);
				background: var(--demo-card-bg);
			}

			.demo-shell {
				display: grid;
				grid-template-columns: minmax(0, 1fr);
				gap: 1.5rem;
				font-size: 1em;
				line-height: 1.65;
				background: var(--demo-card-bg);
				border-radius: 0 0 var(--r-lg) var(--r-lg);
				padding: 1.5rem;
				border: 1px solid var(--demo-card-border);
				border-top: 0;
				min-width: 0;
			}

			.demo-shell,
			.demo-shell p,
			.demo-shell li,
			.demo-shell ul,
			.demo-shell ol,
			.demo-shell h2,
			.demo-shell h3 {
				color: var(--demo-ink);
			}

			.demo-meta {
				display: none;
			}

			/* ── Lab selector tabs ── */
			.lab-tabs {
				display: flex;
				gap: 6px;
				flex-wrap: wrap;
				border: 1px solid var(--demo-card-border);
				border-radius: 1.3rem;
				background: var(--demo-card-bg);
				box-shadow: var(--demo-card-shadow);
				padding: 0.8rem 1rem;
			}

			.lab-tab {
				display: inline-flex;
				align-items: center;
				gap: 0.5em;
				padding: 0.6em 1.15em;
				border-radius: 0.7em;
				font-size: 0.92em;
				font-weight: 700;
				cursor: pointer;
				border: 1.5px solid var(--demo-tab-border);
				background: transparent;
				color: var(--demo-muted);
				transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
				user-select: none;
				text-transform: none !important;
				letter-spacing: normal !important;
			}

			.lab-tab:hover {
				background: var(--crumb-blue-bg);
				color: var(--crumb-blue);
			}

			.lab-tab.active {
				background: var(--crumb-blue);
				border-color: var(--crumb-blue);
				color: var(--demo-card-bg);
				box-shadow: 0 2px 8px rgba(36, 80, 143, 0.2);
			}
			html[data-theme="dark"] .lab-tab.active {
				color: #0a0d12;
			}

			.lab-tab.active:hover {
				background: var(--crumb-blue-dark);
			}

			.lab-tab .tab-lab {
				font-size: 0.75em;
				font-weight: 600;
				text-transform: uppercase;
				letter-spacing: 0.04em;
				opacity: 0.5;
			}

			.lab-tab.active .tab-lab {
				opacity: 0.65;
			}

			.lab-tab .tab-title {
				font-weight: 700;
			}

			/* ── Lab panel (description + widget) ── */
			.lab-panel {
				display: none;
			}

			.lab-panel.active {
				display: grid;
				grid-template-columns: minmax(0, 1fr);
				gap: 1.5rem;
				min-width: 0;
			}

			.info-panel > div { overflow-x: auto; }

			.lab-desc {
				border: 1px solid var(--demo-card-border);
				border-radius: 1.3rem;
				background: var(--demo-card-bg-soft);
				box-shadow: var(--demo-card-shadow-sm);
				padding: 1.4rem 1.6rem;
			}

			.lab-desc h3 {
				margin-bottom: 0.5em;
				font-size: 1.1em;
			}

			.lab-desc p {
				margin: 0;
				font-size: 0.85em;
				line-height: 1.65;
				color: var(--demo-muted);
			}

			.lab-desc strong {
				color: var(--demo-ink);
			}

			/* ── Demo widget container ── */
			.demo-widget {
				border: 1px solid var(--demo-card-border);
				border-radius: 1.3rem;
				background: var(--demo-card-bg);
				box-shadow: var(--demo-card-shadow);
				padding: 1.6rem 1.8rem;
			}

			/* ── Step toolbar ── */
			.step-toolbar {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 8px;
				margin-bottom: 20px;
				flex-wrap: wrap;
			}

			.step-btns {
				display: flex;
				gap: 6px;
				flex-wrap: wrap;
			}

			.step-nav {
				display: flex;
				align-items: center;
				gap: 6px;
			}

			.step-nav .step-counter {
				min-width: 2.5em;
				text-align: center;
			}

			.demo-widget button {
				padding: 8px 18px !important;
				border-radius: 6px !important;
				cursor: pointer;
				font-size: 0.85em !important;
				font-weight: 500 !important;
				text-transform: none !important;
				letter-spacing: normal !important;
				line-height: 1.5 !important;
				box-shadow: none !important;
				min-width: 0 !important;
				height: auto !important;
			}

			.step-nav button {
				border: 1px solid var(--demo-btn-border) !important;
				background: var(--demo-btn-bg) !important;
				color: var(--demo-ink) !important;
				padding: 6px 12px !important;
			}

			.step-nav button:hover {
				background: var(--demo-btn-bg-hover) !important;
			}

			.step-nav button.disabled {
				opacity: 0.35;
				cursor: default;
				pointer-events: none;
			}

			/* ── Input display ── */
			.input-display {
				margin-bottom: 18px;
				padding: 14px 18px;
				border: 1px solid var(--demo-input-border);
				border-radius: 8px;
				background: var(--demo-input-bg);
				font-size: 0.82em;
				line-height: 1.8;
			}

			.input-display .label {
				font-weight: 700;
				color: var(--crumb-blue);
			}

			.input-display code {
				background: var(--crumb-blue-bg);
				padding: 0.15em 0.45em;
				border-radius: 4px;
				font-size: 0.92em;
				color: var(--demo-ink);
			}

			/* ── Ant list display ── */
			.ant-list {
				display: flex;
				gap: 8px;
				flex-wrap: wrap;
				justify-content: center;
				margin-bottom: 24px;
				padding: 14px 0;
			}

			.ant-badge {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				min-width: 40px;
				height: 44px;
				border-radius: 10px;
				font-size: 17px;
				font-weight: 800;
				border: 2.5px solid;
				transition: all 0.3s ease;
				position: relative;
				font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace;
			}

			.ant-idx {
				position: absolute;
				bottom: -17px;
				font-size: 10px;
				font-weight: 400;
				color: var(--demo-char-idx);
				font-family: inherit;
			}

			/* ── Ant legend ── */
			.ant-legend {
				display: flex;
				gap: 1rem;
				flex-wrap: wrap;
				margin-top: 0.7rem;
				font-size: 0.82em;
			}

			.legend-item {
				display: inline-flex;
				align-items: center;
				gap: 0.35rem;
				color: var(--color-text-secondary);
				font-weight: 600;
			}

			.legend-dot {
				width: 10px;
				height: 10px;
				border-radius: 50%;
				flex-shrink: 0;
			}

			/* ── Variable watch panel ── */
			.var-watch {
				background: #1e1e1e;
				border: 1px solid #333;
				border-radius: 8px;
				padding: 10px 0;
				margin-bottom: 20px;
				font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace;
				font-size: 0.82em;
				line-height: 1.7;
			}

			.var-watch .vw-header {
				padding: 0 14px 6px;
				font-size: 0.85em;
				font-weight: 600;
				color: #888;
				text-transform: uppercase;
				letter-spacing: 0.06em;
				border-bottom: 1px solid #2a2a2a;
				margin-bottom: 4px;
			}

			.var-watch .vw-row {
				padding: 2px 14px;
				display: flex;
				gap: 8px;
				color: #555;
				transition: all 0.2s ease;
			}

			.var-watch .vw-row.active {
				background: rgba(255, 255, 255, 0.04);
			}

			.var-watch .vw-row.active .vw-name {
				color: #9CDCFE;
			}

			.var-watch .vw-row.active .vw-eq {
				color: #D4D4D4;
			}

			.var-watch .vw-row.active .vw-val {
				color: #B5CEA8;
			}

			.var-watch .vw-row.active .vw-val.str {
				color: #CE9178;
			}

			.var-watch .vw-row.highlight {
				background: rgba(78, 201, 176, 0.1);
				border-left: 2px solid #4EC9B0;
				padding-left: 12px;
			}

			.var-watch .vw-row.highlight .vw-name {
				color: #4EC9B0;
			}

			.var-watch .vw-row.highlight .vw-val {
				color: #4EC9B0;
				font-weight: 600;
			}

			.var-watch .vw-name {
				min-width: 80px;
				color: #555;
			}

			.var-watch .vw-eq {
				color: #444;
			}

			.var-watch .vw-val {
				color: #555;
			}

			/* ── Info panel ── */
			.info-panel {
				border: 1px solid var(--demo-info-border);
				border-radius: 10px;
				padding: 18px 22px;
				min-height: 130px;
				background: var(--demo-info-bg);
				font-size: 0.82em;
				line-height: 1.65;
			}

			.info-panel strong {
				color: var(--demo-ink);
				font-weight: 600;
			}

			.info-panel code {
				background: var(--crumb-blue-bg);
				padding: 0.15em 0.4em;
				border-radius: 4px;
				color: var(--crumb-blue);
				font-size: 0.92em;
			}

			.info-panel em {
				color: var(--demo-muted);
			}

			.step-counter {
				font-size: 0.85em;
				color: var(--demo-step-counter);
			}

			@media screen and (max-width: 480px) {
				.ant-badge {
					min-width: 32px;
					height: 36px;
					font-size: 14px;
				}

				.ant-idx {
					font-size: 8px;
					bottom: -14px;
				}
			}

			/* ── For loop item display ── */
			.loop-items {
				display: flex;
				gap: 12px;
				flex-wrap: wrap;
				justify-content: center;
				margin-bottom: 24px;
				padding: 18px 0 26px;
			}

			.loop-item {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				min-width: 52px;
				height: 48px;
				border-radius: 10px;
				font-size: 17px;
				font-weight: 800;
				border: 2.5px solid;
				transition: all 0.3s ease;
				position: relative;
				font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace;
			}

			.loop-item .item-idx {
				position: absolute;
				bottom: -17px;
				font-size: 9px;
				font-weight: 600;
				color: var(--demo-char-idx);
			}

			.loop-item .item-ptr {
				position: absolute;
				top: -18px;
				left: 50%;
				transform: translateX(-50%);
				font-size: 12px;
				font-weight: 700;
				line-height: 1;
			}

			.loop-item .item-check {
				position: absolute;
				bottom: -7px;
				right: -7px;
				width: 16px;
				height: 16px;
				background: var(--demo-serial);
				color: #fff;
				border-radius: 50%;
				font-size: 10px;
				display: flex;
				align-items: center;
				justify-content: center;
				font-weight: bold;
				line-height: 1;
			}

			@media screen and (max-width: 480px) {
				.loop-item {
					min-width: 42px;
					height: 40px;
					font-size: 14px;
				}
			}

			/* ── Slice list display ── */
			.slice-list {
				display: flex;
				gap: 10px;
				flex-wrap: wrap;
				justify-content: center;
				margin-bottom: 24px;
				padding: 22px 0 24px;
			}

			.slice-item {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				min-width: 48px;
				height: 48px;
				border-radius: 10px;
				font-size: 18px;
				font-weight: 800;
				border: 2.5px solid;
				transition: all 0.3s ease;
				position: relative;
				font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace;
			}

			.slice-item .pos-idx {
				position: absolute;
				bottom: -17px;
				font-size: 10px;
				font-weight: 600;
			}

			.slice-item .neg-idx {
				position: absolute;
				top: -17px;
				font-size: 10px;
				font-weight: 600;
			}

			@media screen and (max-width: 480px) {
				.slice-item {
					min-width: 38px;
					height: 40px;
					font-size: 15px;
				}

				.slice-item .pos-idx,
				.slice-item .neg-idx {
					font-size: 8px;
				}
			}

			/* ── Mascot cards ── */
			.mascot-cards {
				display: grid;
				grid-template-columns: repeat(3, 1fr);
				gap: 10px;
				margin-bottom: 24px;
			}

			.mascot-card {
				border: 2.5px solid var(--demo-char-border);
				border-radius: 10px;
				padding: 14px 12px;
				text-align: center;
				transition: all 0.3s ease;
			}

			.mascot-card .mc-idx {
				font-family: 'JetBrains Mono', Consolas, monospace;
				font-size: 0.72em;
				font-weight: 700;
				margin-bottom: 4px;
			}

			.mascot-card .mc-name {
				font-size: 1em;
				font-weight: 800;
				margin-bottom: 2px;
			}

			.mascot-card .mc-detail {
				font-size: 0.78em;
				line-height: 1.5;
			}

			.mascot-card .mc-votes {
				font-family: 'JetBrains Mono', Consolas, monospace;
				font-weight: 700;
				font-size: 0.85em;
				margin-top: 8px;
				padding-top: 8px;
				border-top: 1px solid var(--demo-card-border);
			}

			@media screen and (max-width: 600px) {
				.mascot-cards {
					grid-template-columns: 1fr;
				}
			}
		</style>
